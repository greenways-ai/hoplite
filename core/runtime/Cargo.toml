[package]
name = "hoplite-runtime"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Native worker-local Hara runtime bridge for Hoplite/Nginx"
autobins = false

[lib]
name = "hoplite_runtime"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "hoplite-boundary-benchmark"
path = "src/bin/hoplite-boundary-benchmark.rs"
required-features = ["source-evaluation"]

[features]
default = ["bytecode-vm", "native-jit", "source-evaluation"]
bytecode-vm = ["hara-wasm/bytecode-vm"]
source-evaluation = []
cli-host = []
evaluation-journal = []
halc-encoder = []
hir-encoder = ["halc-encoder"]
tracing-jit = ["bytecode-vm", "hara-wasm/tracing-jit"]
native-jit = ["tracing-jit", "hara-wasm/native-jit"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.2"
hara-wasm = { path = "../../../hara/core/rust", features = ["bytecode-vm"] }
hoplite-application-bundle = { path = "../application-bundle" }
hoplite-data-plane-abi = { path = "../abi/data-plane" }
hoplite-data-plane-ffi = { path = "../abi/data-plane-ffi" }
hoplite-data-plane-registry = { path = "../abi/data-plane-registry" }
p256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1.0"
sha2 = "0.10"
str0m = { version = "=0.21.0", default-features = false, features = ["rust-crypto"] }
