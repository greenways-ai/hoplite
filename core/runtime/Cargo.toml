[package]
name = "hoplite-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Native worker-local Hara runtime bridge for Hoplite/Nginx"

[lib]
name = "hoplite_runtime"
crate-type = ["staticlib", "rlib"]

[features]
default = ["bytecode-vm"]
bytecode-vm = []
cli-host = []
evaluation-journal = []
halc-encoder = []
hir-encoder = ["halc-encoder"]
tracing-jit = ["bytecode-vm"]
native-jit = ["tracing-jit"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.2"
hara-wasm = { path = "../../../hara/core/rust", features = ["bytecode-vm"] }
hoplite-data-plane-abi = { path = "../abi/data-plane" }
hoplite-data-plane-ffi = { path = "../abi/data-plane-ffi" }
hoplite-data-plane-registry = { path = "../abi/data-plane-registry" }
p256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1.0"
sha2 = "0.10"
