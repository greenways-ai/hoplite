[package]
name = "hoplite"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Hara application server for Nginx"
default-run = "hoplite"
autobins = false

[workspace]
members = [
  ".",
  "application-bundle",
  "abi/data-plane",
  "abi/data-plane-ffi",
  "abi/data-plane-registry",
  "runtime",
]
exclude = [
  "abi/auth-store",
]
default-members = ["."]
resolver = "2"

[features]
default = ["bytecode-vm", "native-jit", "cli-host"]
bytecode-vm = ["hara-wasm/bytecode-vm"]
tracing-jit = ["bytecode-vm", "hara-wasm/tracing-jit"]
native-jit = ["tracing-jit", "hara-wasm/native-jit"]
cli-host = []
embedded-nginx = []
internal-evidence = []
legacy-provider-products = []
legacy-value-contract = []
legacy-management = [
  "dep:hoplite-auth-store-abi",
  "dep:hoplite-store-sqlite",
  "dep:rusqlite",
]

[[bin]]
name = "hoplite"
path = "src/main.rs"

[[bin]]
name = "hoplite-server"
path = "src/bin/hoplite-server.rs"

[[bin]]
name = "hoplite-bytecode-loading"
path = "src/bin/hoplite-bytecode-loading.rs"
required-features = ["internal-evidence"]

[[bin]]
name = "hoplite-object-backend-lock"
path = "src/bin/hoplite-object-backend-lock.rs"
required-features = ["legacy-provider-products"]

[[bin]]
name = "hoplite-provider-lock"
path = "src/bin/hoplite-provider-lock.rs"
required-features = ["legacy-provider-products"]

[[bin]]
name = "hoplite-provider-manifest"
path = "src/bin/hoplite-provider-manifest.rs"
required-features = ["legacy-provider-products"]

[[bin]]
name = "hoplite-provider-set-lock"
path = "src/bin/hoplite-provider-set-lock.rs"
required-features = ["legacy-provider-products"]

[dependencies]
base64 = "0.22"
hara-wasm = { path = "../../hara/core/rust", features = ["bytecode-vm"] }
hoplite-application-bundle = { path = "application-bundle" }
hoplite-auth-store-abi = { path = "abi/auth-store", optional = true }
hoplite-store-sqlite = { git = "https://github.com/greenways-ai/hoplite-store-sqlite", rev = "6ef90070e0fa7ffbc2f2dbcb9832d4f2b14ac29b", optional = true }
rustyline = "14.0.0"
home = "=0.5.9"
serde_json = "1.0"
semver = "1.0"
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = "0.10"

[patch."https://github.com/greenways-ai/hoplite"]
hoplite-auth-store-abi = { path = "abi/auth-store" }

# hara-db-postgres is distributed from hara-extensions but implements the ABI
# owned by the locally integrated Hara runtime. Cargo ignores patches declared
# by dependencies, so the embedding workspace must unify this trait identity.
[patch."https://github.com/hara-lang/hara.git"]
hara-abi = { path = "../../hara/core/rust/abi" }
