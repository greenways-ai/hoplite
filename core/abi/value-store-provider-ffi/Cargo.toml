[package]
name = "hoplite-value-store-provider-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Portable synchronous C boundary for Hoplite's generic hara.store provider"

[lib]
name = "hoplite_value_store_provider_ffi"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
hoplite-value-store = { path = "../value-store" }
hoplite-value-store-provider = { path = "../value-store-provider" }
hoplite-value-store-sqlite = { path = "../value-store-sqlite" }

[dev-dependencies]
hoplite-provider-hta = { path = "../provider-hta" }

[workspace]
