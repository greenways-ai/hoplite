[package]
name = "hoplite-blob-store-provider-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Work-scoped C boundary for Hoplite's canonical hoplite.blob provider"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
hoplite-blob-store = { path = "../blob-store" }
hoplite-blob-filesystem-reader = { path = "../blob-filesystem-reader" }
hoplite-blob-store-filesystem = { path = "../blob-store-filesystem" }
hoplite-blob-store-provider = { path = "../blob-store-provider" }
sha2 = "0.10"

[dev-dependencies]
hoplite-provider-hta = { path = "../provider-hta" }

[workspace]
