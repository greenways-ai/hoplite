name: Materialize Hoplite inspect

on:
  push:
    branches:
      - agent/hoplite-inspect-108

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add bounded source-free inspection
        run: python3 .github/scripts/materialize-inspect.py
      - name: Format and validate generated changes
        run: |
          rustfmt --edition 2021 core/src/diagnostics.rs
          python3 -m json.tool docs/public-surfaces.json >/dev/null
          python3 -m json.tool docs/core-boundary.json >/dev/null
          test ! -e .github/workflows/materialize-inspect.yml
          test ! -e .github/scripts/materialize-inspect.py
          test ! -e .github/scripts/diagnostics.rs.gz.b64
          git diff --check
      - name: Commit the implementation and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "materialization produced no changes" >&2
            exit 1
          }
          git commit -m "Add source-free application inspection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
