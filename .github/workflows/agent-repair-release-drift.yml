name: Repair release dependency drift

on:
  push:
    branches:
      - agent/import-harp-modules
    paths:
      - ".github/workflows/agent-repair-release-drift.yml"

permissions:
  contents: write

concurrency:
  group: agent-repair-release-drift
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/import-harp-modules
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Align the reviewed runtime, contracts, and Rust toolchain
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_hara = "6dd73bbb9ba546b90dee0a075323998dd3abac85"
          new_hara = "2b3efd14451e96e9e79cd9645fb7e10d9e3782d6"

          revision = Path("packaging/hara-revision")
          if revision.read_text().strip() != old_hara:
              raise SystemExit("unexpected reviewed Hara revision")
          revision.write_text(new_hara + "\n")

          ci = Path(".github/workflows/ci.yml")
          source = ci.read_text()
          if source.count(old_hara) != 1:
              raise SystemExit("unexpected CI Hara revision declaration")
          ci.write_text(source.replace(old_hara, new_hara))

          dockerfile = Path("packaging/docker/Dockerfile")
          source = dockerfile.read_text()
          old = "ARG NCHAN_VERSION=1.3.8\n\nFROM rust:1.85-bookworm AS builder"
          new = "ARG NCHAN_VERSION=1.3.8\nARG RUST_VERSION=1.88.0\n\nFROM rust:${RUST_VERSION}-bookworm AS builder"
          if source.count(old) != 1:
              raise SystemExit("unexpected production Docker toolchain declaration")
          dockerfile.write_text(source.replace(old, new))

          for manifest in [Path("core/Cargo.toml"), Path("core/runtime/Cargo.toml")]:
              source = manifest.read_text()
              old = 'rust-version = "1.78"'
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected rust-version declaration in {manifest}")
              manifest.write_text(source.replace(old, 'rust-version = "1.88"'))

          response_source = Path("core/lib/src/hoplite/response_source.hal")
          source = response_source.read_text()
          old = "   (= :hara/Integer (type value))"
          new = "   (integer? value)"
          if source.count(old) != 1:
              raise SystemExit("unexpected response-source integer contract")
          response_source.write_text(source.replace(old, new))

          Path("core/lib/test/hoplite/response_source_test.hal").write_text(r'''(ns hoplite.response-source-test
  (:require [hoplite.response-source :as source]))

(def valid
  (source/response-source "hoplite.blob" 17 4 9))

(Test/run
 [{:name "constructs one closed portable response source"
   :test (fn [] valid)
   :expected {:protocol "hoplite.response-source/0-alpha"
              :service "hoplite.blob"
              :source-handle 17
              :offset 4
              :length 9}}

  {:name "the short constructor starts at offset zero"
   :test (fn [] (source/response-source "hoplite.blob" 19 7))
   :expected {:protocol "hoplite.response-source/0-alpha"
              :service "hoplite.blob"
              :source-handle 19
              :offset 0
              :length 7}}

  {:name "accessors preserve the bounded half-open interval"
   :test (fn []
           [(source/source-service valid)
            (source/source-handle valid)
            (source/source-offset valid)
            (source/source-length valid)
            (source/source-end valid)])
   :expected ["hoplite.blob" 17 4 9 13]}

  {:name "the descriptor has an exact closed field set"
   :test (fn []
           [(source/response-source? valid)
            (source/response-source? (assoc valid :driver "memory"))
            (source/response-source? (dissoc valid :length))
            (source/response-source? (assoc valid :protocol "other/1"))])
   :expected [true false false false]}

  {:name "portable integer validation includes both exact safe bounds"
   :test (fn []
           [(source/safe-integer? source/safe-integer-min)
            (source/safe-integer? source/safe-integer-max)
            (source/safe-integer? -9007199254740992)
            (source/safe-integer? 9007199254740992)
            (source/safe-integer? 31)])
   :expected [true true false false true]}

  {:name "handles, offsets and lengths stay inside portable integer bounds"
   :test (fn []
           [(source/response-source? (source/response-source "hoplite.blob" 1 1))
            (source/response-source?
             (source/response-source
              "hoplite.blob"
              source/safe-integer-max
              0
              source/safe-integer-max))
            (source/response-source?
             {:protocol source/protocol
              :service "hoplite.blob"
              :source-handle 0
              :offset 0
              :length 1})
            (source/response-source?
             {:protocol source/protocol
              :service "hoplite.blob"
              :source-handle 1
              :offset -1
              :length 1})
            (source/response-source?
             {:protocol source/protocol
              :service "hoplite.blob"
              :source-handle 1
              :offset 0
              :length 0})
            (source/response-source?
             {:protocol source/protocol
              :service "hoplite.blob"
              :source-handle 1
              :offset source/safe-integer-max
              :length 1})])
   :expected [true true false false false false]}

  {:name "invalid constructors fail with one stable application-neutral error"
   :test (fn []
           (try
             (source/response-source "hoplite.blob" 0 0 1)
             (catch Throwable error
               [(ex-message error)
                (ex-data error)])))
   :expected ["invalid hoplite.response-source/0-alpha"
              {:phase :response-source/invalid
               :reason :descriptor}]}

  {:name "accessors reject forged descriptors through the same boundary"
   :test (fn []
           (try
             (source/source-length {:source-handle 17})
             (catch Throwable error
               (ex-data error))))
   :expected {:phase :response-source/invalid
              :reason :descriptor}}

  {:name "numeric handles do not carry provider, path or credential metadata"
   :test (fn []
           [(has? valid :provider)
            (has? valid :path)
            (has? valid :credentials)
            (has? valid :work)])
   :expected [false false false false]}])
''')
          PY

          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null
          cargo test --manifest-path core/Cargo.toml --bin hoplite response_source_boundary_contract_evaluates_from_hoplite
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          git diff --exit-code -- core/Cargo.lock
          git diff --check

      - name: Build the exact generic production image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .

      - name: Publish the repair to the pull-request branch
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-repair-release-drift.yml
          git add \
            .github/workflows/ci.yml \
            packaging/hara-revision \
            packaging/docker/Dockerfile \
            core/Cargo.toml \
            core/runtime/Cargo.toml \
            core/lib/src/hoplite/response_source.hal \
            core/lib/test/hoplite/response_source_test.hal
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair reviewed runtime and release compatibility"
          git push origin HEAD:agent/import-harp-modules
