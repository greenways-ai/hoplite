name: Repair release dependency drift

on:
  push:
    branches:
      - agent/import-harp-modules
    paths:
      - ".github/workflows/agent-repair-release-drift.yml"

permissions:
  contents: write

concurrency:
  group: agent-repair-release-drift
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/import-harp-modules
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 6dd73bbb9ba546b90dee0a075323998dd3abac85
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Align the declared toolchain and locked dependency graph
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dockerfile = Path("packaging/docker/Dockerfile")
          source = dockerfile.read_text()
          old = "ARG NCHAN_VERSION=1.3.8\n\nFROM rust:1.85-bookworm AS builder"
          new = "ARG NCHAN_VERSION=1.3.8\nARG RUST_VERSION=1.88.0\n\nFROM rust:${RUST_VERSION}-bookworm AS builder"
          if source.count(old) != 1:
              raise SystemExit("unexpected production Docker toolchain declaration")
          dockerfile.write_text(source.replace(old, new))

          for manifest in [Path("core/Cargo.toml"), Path("core/runtime/Cargo.toml")]:
              source = manifest.read_text()
              old = 'rust-version = "1.78"'
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected rust-version declaration in {manifest}")
              manifest.write_text(source.replace(old, 'rust-version = "1.88"'))
          PY

          cargo update \
            --manifest-path core/Cargo.toml \
            -p hara-db-postgres \
            --precise 6e1aa7f23e0f8ad91b911ba56e135570947f4074

          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          git diff --check

      - name: Build the exact generic production image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .

      - name: Publish the repair to the pull-request branch
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-repair-release-drift.yml
          git add \
            packaging/docker/Dockerfile \
            core/Cargo.toml \
            core/runtime/Cargo.toml \
            core/Cargo.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair release toolchain and dependency lock"
          git push origin HEAD:agent/import-harp-modules
