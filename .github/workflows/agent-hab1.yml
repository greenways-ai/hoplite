name: Build the Hoplite application bundle contract

on:
  push:
    branches:
      - agent/hoplite-application-bundle-v1

permissions:
  contents: write

concurrency:
  group: hoplite-application-bundle-v1
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/hoplite-application-bundle-v1
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Implement HAB1 and transactional startup
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new))
          
          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_at = text.find(end, start_at + len(start))
              if end_at < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              if text.find(start, start_at + len(start)) >= 0:
                  raise SystemExit(f"{path}: start marker is not unique: {start!r}")
              file.write_text(text[:start_at] + replacement + text[end_at:])
          
          def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)
          
          write("core/application-bundle/Cargo.toml", '[package]\nname = "hoplite-application-bundle"\nversion = "0.1.0"\nedition = "2021"\nlicense = "Apache-2.0"\nrust-version = "1.78"\ndescription = "Versioned application bundle envelope for Hoplite"\n\n[dependencies]\nsha2 = "0.10"\n')
          write("core/application-bundle/src/lib.rs", 'use sha2::{Digest, Sha256};\nuse std::fmt;\n\npub const FORMAT: &str = "hoplite.application-bundle/1";\npub const MAGIC: &[u8; 4] = b"HAB1";\npub const RUNTIME_ABI_VERSION: u32 = 4;\npub const MAX_MANIFEST_BYTES: usize = 8 * 1024 * 1024;\npub const MAX_BYTECODE_BYTES: usize = 64 * 1024 * 1024;\n\nconst CHECKSUM_BYTES: usize = 32;\nconst PREFIX_BYTES: usize = MAGIC.len() + CHECKSUM_BYTES;\nconst FIXED_PAYLOAD_BYTES: usize = 4 + CHECKSUM_BYTES + 4;\npub const MAX_BUNDLE_BYTES: usize = PREFIX_BYTES + FIXED_PAYLOAD_BYTES + MAX_BYTECODE_BYTES;\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub enum Error {\n    EmptyManifest,\n    ManifestTooLarge { actual: usize },\n    EmptyBytecode,\n    BytecodeTooLarge { actual: usize },\n    BundleTooSmall { actual: usize },\n    BundleTooLarge { actual: usize },\n    InvalidMagic,\n    ChecksumMismatch,\n    RuntimeAbiMismatch { actual: u32 },\n    ManifestDigestMismatch,\n    InvalidBytecodeMagic,\n    Truncated,\n    TrailingBytes { actual: usize },\n    LengthOverflow,\n}\n\nimpl fmt::Display for Error {\n    fn fmt(&self, formatter: &mut fmt::Formatter<\'_>) -> fmt::Result {\n        match self {\n            Self::EmptyManifest => {\n                formatter.write_str("hoplite/application-manifest-empty")\n            }\n            Self::ManifestTooLarge { actual } => write!(\n                formatter,\n                "hoplite/application-manifest-too-large: {actual} bytes exceeds {MAX_MANIFEST_BYTES}"\n            ),\n            Self::EmptyBytecode => formatter.write_str("hoplite/application-bytecode-empty"),\n            Self::BytecodeTooLarge { actual } => write!(\n                formatter,\n                "hoplite/application-bytecode-too-large: {actual} bytes exceeds {MAX_BYTECODE_BYTES}"\n            ),\n            Self::BundleTooSmall { actual } => write!(\n                formatter,\n                "hoplite/application-bundle-truncated: {actual} bytes"\n            ),\n            Self::BundleTooLarge { actual } => write!(\n                formatter,\n                "hoplite/application-bundle-too-large: {actual} bytes exceeds {MAX_BUNDLE_BYTES}"\n            ),\n            Self::InvalidMagic => {\n                formatter.write_str("hoplite/application-bundle-invalid: expected HAB1")\n            }\n            Self::ChecksumMismatch => {\n                formatter.write_str("hoplite/application-bundle-checksum-mismatch")\n            }\n            Self::RuntimeAbiMismatch { actual } => write!(\n                formatter,\n                "hoplite/application-bundle-incompatible: runtime ABI {actual}, expected {RUNTIME_ABI_VERSION}"\n            ),\n            Self::ManifestDigestMismatch => {\n                formatter.write_str("hoplite/application-manifest-mismatch")\n            }\n            Self::InvalidBytecodeMagic => formatter.write_str(\n                "hoplite/application-bytecode-invalid: expected embedded HBB2 bundle",\n            ),\n            Self::Truncated => formatter.write_str("hoplite/application-bundle-truncated"),\n            Self::TrailingBytes { actual } => write!(\n                formatter,\n                "hoplite/application-bundle-trailing-bytes: {actual}"\n            ),\n            Self::LengthOverflow => {\n                formatter.write_str("hoplite/application-bundle-length-overflow")\n            }\n        }\n    }\n}\n\nimpl std::error::Error for Error {}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct Decoded<\'a> {\n    bytecode: &\'a [u8],\n    manifest_digest: [u8; CHECKSUM_BYTES],\n}\n\nimpl<\'a> Decoded<\'a> {\n    pub fn bytecode(self) -> &\'a [u8] {\n        self.bytecode\n    }\n\n    pub fn manifest_digest(self) -> [u8; CHECKSUM_BYTES] {\n        self.manifest_digest\n    }\n}\n\npub fn encode(manifest: &[u8], bytecode: &[u8]) -> Result<Vec<u8>, Error> {\n    validate_manifest(manifest)?;\n    validate_bytecode(bytecode)?;\n\n    let length = u32::try_from(bytecode.len()).map_err(|_| Error::LengthOverflow)?;\n    let manifest_digest = digest(manifest);\n    let mut payload = Vec::with_capacity(FIXED_PAYLOAD_BYTES + bytecode.len());\n    payload.extend_from_slice(&RUNTIME_ABI_VERSION.to_le_bytes());\n    payload.extend_from_slice(&manifest_digest);\n    payload.extend_from_slice(&length.to_le_bytes());\n    payload.extend_from_slice(bytecode);\n\n    let checksum = digest(&payload);\n    let mut bundle = Vec::with_capacity(PREFIX_BYTES + payload.len());\n    bundle.extend_from_slice(MAGIC);\n    bundle.extend_from_slice(&checksum);\n    bundle.extend_from_slice(&payload);\n    Ok(bundle)\n}\n\npub fn decode<\'a>(bundle: &\'a [u8], manifest: &[u8]) -> Result<Decoded<\'a>, Error> {\n    validate_manifest(manifest)?;\n    if bundle.len() < PREFIX_BYTES + FIXED_PAYLOAD_BYTES {\n        return Err(Error::BundleTooSmall {\n            actual: bundle.len(),\n        });\n    }\n    if bundle.len() > MAX_BUNDLE_BYTES {\n        return Err(Error::BundleTooLarge {\n            actual: bundle.len(),\n        });\n    }\n    if &bundle[..MAGIC.len()] != MAGIC {\n        return Err(Error::InvalidMagic);\n    }\n\n    let expected_checksum: [u8; CHECKSUM_BYTES] =\n        bundle[MAGIC.len()..PREFIX_BYTES].try_into().unwrap();\n    let payload = &bundle[PREFIX_BYTES..];\n    if digest(payload) != expected_checksum {\n        return Err(Error::ChecksumMismatch);\n    }\n\n    let mut input = payload;\n    let runtime_abi = take_u32(&mut input)?;\n    if runtime_abi != RUNTIME_ABI_VERSION {\n        return Err(Error::RuntimeAbiMismatch {\n            actual: runtime_abi,\n        });\n    }\n\n    let manifest_digest: [u8; CHECKSUM_BYTES] =\n        take(&mut input, CHECKSUM_BYTES)?.try_into().unwrap();\n    if digest(manifest) != manifest_digest {\n        return Err(Error::ManifestDigestMismatch);\n    }\n\n    let bytecode_len = take_u32(&mut input)? as usize;\n    if bytecode_len == 0 {\n        return Err(Error::EmptyBytecode);\n    }\n    if bytecode_len > MAX_BYTECODE_BYTES {\n        return Err(Error::BytecodeTooLarge {\n            actual: bytecode_len,\n        });\n    }\n    let bytecode = take(&mut input, bytecode_len)?;\n    if !input.is_empty() {\n        return Err(Error::TrailingBytes {\n            actual: input.len(),\n        });\n    }\n    validate_bytecode(bytecode)?;\n    Ok(Decoded {\n        bytecode,\n        manifest_digest,\n    })\n}\n\nfn validate_manifest(manifest: &[u8]) -> Result<(), Error> {\n    if manifest.is_empty() {\n        return Err(Error::EmptyManifest);\n    }\n    if manifest.len() > MAX_MANIFEST_BYTES {\n        return Err(Error::ManifestTooLarge {\n            actual: manifest.len(),\n        });\n    }\n    Ok(())\n}\n\nfn validate_bytecode(bytecode: &[u8]) -> Result<(), Error> {\n    if bytecode.is_empty() {\n        return Err(Error::EmptyBytecode);\n    }\n    if bytecode.len() > MAX_BYTECODE_BYTES {\n        return Err(Error::BytecodeTooLarge {\n            actual: bytecode.len(),\n        });\n    }\n    if bytecode.len() < 4 || &bytecode[..4] != b"HBB2" {\n        return Err(Error::InvalidBytecodeMagic);\n    }\n    Ok(())\n}\n\nfn digest(bytes: &[u8]) -> [u8; CHECKSUM_BYTES] {\n    Sha256::digest(bytes).into()\n}\n\nfn take_u32(input: &mut &[u8]) -> Result<u32, Error> {\n    Ok(u32::from_le_bytes(\n        take(input, 4)?.try_into().unwrap(),\n    ))\n}\n\nfn take<\'a>(input: &mut &\'a [u8], length: usize) -> Result<&\'a [u8], Error> {\n    if input.len() < length {\n        return Err(Error::Truncated);\n    }\n    let (value, remaining) = input.split_at(length);\n    *input = remaining;\n    Ok(value)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn hbb2() -> Vec<u8> {\n        b"HBB2deterministic-bytecode".to_vec()\n    }\n\n    fn reseal(bundle: &mut [u8]) {\n        let checksum = digest(&bundle[PREFIX_BYTES..]);\n        bundle[MAGIC.len()..PREFIX_BYTES].copy_from_slice(&checksum);\n    }\n\n    #[test]\n    fn round_trip_is_deterministic_and_manifest_bound() {\n        let manifest = b"exact-route-manifest";\n        let bytecode = hbb2();\n        let first = encode(manifest, &bytecode).unwrap();\n        let second = encode(manifest, &bytecode).unwrap();\n        assert_eq!(first, second);\n        assert_eq!(&first[..4], MAGIC);\n        let decoded = decode(&first, manifest).unwrap();\n        assert_eq!(decoded.bytecode(), bytecode);\n        assert_eq!(decoded.manifest_digest(), digest(manifest));\n    }\n\n    #[test]\n    fn rejects_manifest_drift_before_exposing_bytecode() {\n        let bundle = encode(b"manifest-a", &hbb2()).unwrap();\n        assert_eq!(\n            decode(&bundle, b"manifest-b"),\n            Err(Error::ManifestDigestMismatch)\n        );\n    }\n\n    #[test]\n    fn rejects_runtime_abi_drift_even_with_a_valid_checksum() {\n        let mut bundle = encode(b"manifest", &hbb2()).unwrap();\n        bundle[PREFIX_BYTES..PREFIX_BYTES + 4].copy_from_slice(&5u32.to_le_bytes());\n        reseal(&mut bundle);\n        assert_eq!(\n            decode(&bundle, b"manifest"),\n            Err(Error::RuntimeAbiMismatch { actual: 5 })\n        );\n    }\n\n    #[test]\n    fn rejects_tampering_and_trailing_bytes() {\n        let mut tampered = encode(b"manifest", &hbb2()).unwrap();\n        *tampered.last_mut().unwrap() ^= 1;\n        assert_eq!(\n            decode(&tampered, b"manifest"),\n            Err(Error::ChecksumMismatch)\n        );\n\n        let mut trailing = encode(b"manifest", &hbb2()).unwrap();\n        trailing.push(0);\n        reseal(&mut trailing);\n        assert_eq!(\n            decode(&trailing, b"manifest"),\n            Err(Error::TrailingBytes { actual: 1 })\n        );\n    }\n\n    #[test]\n    fn rejects_empty_oversized_and_non_hbb2_inputs() {\n        assert_eq!(encode(b"", &hbb2()), Err(Error::EmptyManifest));\n        assert_eq!(encode(b"manifest", b""), Err(Error::EmptyBytecode));\n        assert_eq!(\n            encode(b"manifest", b"not-bytecode"),\n            Err(Error::InvalidBytecodeMagic)\n        );\n\n        let manifest = vec![0; MAX_MANIFEST_BYTES + 1];\n        assert_eq!(\n            encode(&manifest, &hbb2()),\n            Err(Error::ManifestTooLarge {\n                actual: MAX_MANIFEST_BYTES + 1\n            })\n        );\n    }\n}\n')
          write("docs/application-bundle.md", '# Hoplite application bundle v1\n\nProduction workers boot one **Hoplite application bundle** rather than treating\ncompiled Hara modules and the route manifest as unrelated inputs.\n\n## Format\n\nThe byte layout is deterministic:\n\n```text\nHAB1\nsha256(payload)\nruntime ABI (u32 little-endian)\nsha256(exact apps.hta bytes)\nembedded bytecode length (u32 little-endian)\nembedded Hara HBB2 bytecode bundle\n```\n\n`HAB1` is the Hoplite-owned compatibility boundary. `HBB2` remains the\nHara-owned container for namespace-preserving bytecode modules.\n\nThe v1 decoder rejects:\n\n- unsupported runtime ABI versions;\n- an empty or oversized route manifest;\n- an empty, oversized, or non-HBB2 bytecode payload;\n- checksum, manifest-digest, and declared-length mismatches;\n- truncation and trailing bytes.\n\nThe current limits are 8 MiB for `apps.hta` and 64 MiB for embedded HBB2\nbytecode.\n\n## Startup law\n\nThe worker validates the complete HAB1 envelope and decodes the exact bound\nroute manifest before mutating application state. It then:\n\n1. loads every eager HBB2 module transactionally;\n2. prepares every route handler transactionally;\n3. publishes the application routers only after both phases succeed.\n\nA bytecode failure, unknown handler, malformed manifest, checksum mismatch, or\nmanifest substitution leaves the worker with neither partially loaded\nnamespaces nor partially prepared routes.\n\n## Compatibility\n\nThe bundle records the exact Hoplite runtime ABI. Changing the envelope layout,\nmanifest-binding law, or required runtime ABI requires a new HAB format and a\ndocumented migration path.\n\nThe lower-level `hoplite_bootstrap_bytecode` and `hoplite_apps_prepare` symbols\nremain available for embedding compatibility, but the generated Nginx\nproduction configuration uses `hoplite_bootstrap_application_v1`.\n')
          
          replace_exact(
              "core/Cargo.toml",
              'members = [\n  ".",\n',
              'members = [\n  ".",\n  "application-bundle",\n',
          )
          replace_exact(
              "core/Cargo.toml",
              'hara-wasm = { path = "../../hara/core/rust", features = ["bytecode-vm"] }\n',
              'hara-wasm = { path = "../../hara/core/rust", features = ["bytecode-vm"] }\n'
              'hoplite-application-bundle = { path = "application-bundle" }\n',
          )
          replace_exact(
              "core/runtime/Cargo.toml",
              'hara-wasm = { path = "../../../hara/core/rust", features = ["bytecode-vm"] }\n',
              'hara-wasm = { path = "../../../hara/core/rust", features = ["bytecode-vm"] }\n'
              'hoplite-application-bundle = { path = "../application-bundle" }\n',
          )
          
          replace_exact(
              "core/src/main.rs",
              'use hara_wasm::Runtime;\n',
              'use hara_wasm::Runtime;\nuse hoplite_application_bundle as application_bundle;\n',
          )
          replace_exact("core/src/main.rs", '    let modules = application_modules(&sources)?;\n    compile_application_modules(&modules)\n        .map_err(|error| format!("Hoplite bytecode compilation failed: {error}"))?;\n    app::load(&project, settings.profile.as_deref(), settings.production)?;\n    platform::load(&project, settings.profile.as_deref())?;\n    Ok(project)\n', '    let modules = application_modules(&sources)?;\n    let hbb2 = compile_application_modules(&modules)\n        .map_err(|error| format!("Hoplite bytecode compilation failed: {error}"))?;\n    let app_config = app::load(&project, settings.profile.as_deref(), settings.production)?;\n    let manifest = app::manifest(&app_config)?;\n    application_bundle::encode(&manifest, &hbb2)\n        .map_err(|error| format!("cannot encode Hoplite application bundle: {error}"))?;\n    platform::load(&project, settings.profile.as_deref())?;\n    Ok(project)\n')
          replace_exact("core/src/main.rs", '    let bytecode = compile_application_modules(&modules)\n        .map_err(|error| format!("Hoplite bytecode compilation failed: {error}"))?;\n    let app_config = app::load(&project, settings.profile.as_deref(), settings.production)?;\n    let platform_config = platform::load(&project, settings.profile.as_deref())?;\n    let output = project.root.join(".hoplite");\n    let configuration = output.join("conf");\n    fs::create_dir_all(&configuration).map_err(io)?;\n    fs::write(output.join("app.hal"), &runtime_source).map_err(io)?;\n    fs::write(output.join("app.hbx"), bytecode).map_err(io)?;\n    fs::write(output.join("apps.hta"), app::manifest(&app_config)?).map_err(io)?;\n', '    let hbb2 = compile_application_modules(&modules)\n        .map_err(|error| format!("Hoplite bytecode compilation failed: {error}"))?;\n    let app_config = app::load(&project, settings.profile.as_deref(), settings.production)?;\n    let manifest = app::manifest(&app_config)?;\n    let bundle = application_bundle::encode(&manifest, &hbb2)\n        .map_err(|error| format!("cannot encode Hoplite application bundle: {error}"))?;\n    let platform_config = platform::load(&project, settings.profile.as_deref())?;\n    let output = project.root.join(".hoplite");\n    let configuration = output.join("conf");\n    fs::create_dir_all(&configuration).map_err(io)?;\n    fs::write(output.join("app.hal"), &runtime_source).map_err(io)?;\n    fs::write(output.join("app.hbx"), bundle).map_err(io)?;\n    fs::write(output.join("apps.hta"), manifest).map_err(io)?;\n')
          replace_exact("core/src/main.rs", '    #[test]\n    fn compiles_a_multi_namespace_application_bundle() {\n        let modules = [\n            module("(ns example.dependency) (defn answer [] 42)"),\n            module(\n                "(ns example.application (:require [example.dependency :as dependency])) \\\n                 (defn answer [] (dependency/answer))",\n            ),\n        ];\n        let bundle = compile_application_modules(&modules).unwrap();\n        assert_eq!(&bundle[..4], b"HBB2");\n    }\n', '    #[test]\n    fn compiles_hara_bytecode_and_wraps_the_hoplite_application_contract() {\n        let modules = [\n            module("(ns example.dependency) (defn answer [] 42)"),\n            module(\n                "(ns example.application (:require [example.dependency :as dependency])) \\\n                 (defn answer [] (dependency/answer))",\n            ),\n        ];\n        let hbb2 = compile_application_modules(&modules).unwrap();\n        assert_eq!(&hbb2[..4], b"HBB2");\n\n        let manifest = b"exact-app-manifest";\n        let bundle = application_bundle::encode(manifest, &hbb2).unwrap();\n        assert_eq!(&bundle[..4], application_bundle::MAGIC);\n        assert_eq!(\n            application_bundle::decode(&bundle, manifest)\n                .unwrap()\n                .bytecode(),\n            hbb2\n        );\n    }\n')
          
          replace_exact(
              "core/runtime/src/lib.rs",
              'use hara_wasm::{core, hta, kernel, vm};\n',
              'use hara_wasm::{core, hta, kernel, vm};\n'
              'use hoplite_application_bundle as application_bundle;\n',
          )
          replace_exact(
