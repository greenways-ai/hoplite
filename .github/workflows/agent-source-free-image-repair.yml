name: Repair source discovery and source-free production projection

on:
  push:
    branches:
      - agent/source-free-production-image

permissions:
  contents: write

concurrency:
  group: hoplite-source-free-production-image-repair
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-free-production-image
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply the source boundary and production projection
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_at = text.find(start)
              end_at = text.find(end, start_at + len(start))
              if start_at < 0 or end_at < 0:
                  raise SystemExit(f"{path}: section markers not found")
              file.write_text(text[:start_at] + replacement + text[end_at:])

          def insert_before_last(path: str, marker: str, content: str) -> None:
              file = Path(path)
              text = file.read_text()
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f"{path}: final marker not found")
              file.write_text(text[:index] + content + text[index:])

          # Hoplite owns the generated-output exclusion when loading app source.
          replace_exact(
              "core/src/app.rs",
              "use hara_wasm::core::{self, Value};\nuse hara_wasm::project::{self, Project};\nuse hara_wasm::Runtime;\nuse serde_json::{json, Map as JsonMap, Value as JsonValue};\n",
              "use hara_wasm::core::{self, Value};\nuse hara_wasm::kernel::{parse_forms, Form};\nuse hara_wasm::project::{self, Project};\nuse hara_wasm::Runtime;\nuse serde_json::{json, Map as JsonMap, Value as JsonValue};\nuse std::fs;\nuse std::path::Path;\n",
          )
          replace_exact(
              "core/src/app.rs",
              "pub fn load(project: &Project, profile: Option<&str>, production: bool) -> Result<Config, String> {\n",
              '''fn generated_output(path: &Path) -> bool {
              path.components()
                  .any(|component| component.as_os_str().to_str() == Some(".hoplite"))
          }

          fn declared_namespace(source: &str) -> Result<Option<String>, String> {
              Ok(parse_forms(source)?.into_iter().find_map(|form| match form {
                  Form::List(values)
                      if matches!(values.first(), Some(Form::Symbol(head)) if head == "ns" || head == "ns+") =>
                  {
                      match values.get(1) {
                          Some(Form::Symbol(namespace)) => Some(namespace.clone()),
                          _ => None,
                      }
                  }
                  _ => None,
              }))
          }

          fn register_project_sources(project: &Project, runtime: &mut Runtime) -> Result<(), String> {
              for path in project::files_in(&project.root, &project.source_paths)?
                  .into_iter()
                  .filter(|path| !generated_output(path))
              {
                  let source = fs::read_to_string(&path)
                      .map_err(|error| format!("cannot read {}: {error}", path.display()))?;
                  let namespace = declared_namespace(&source)
                      .map_err(|error| format!("{}: {error}", path.display()))?
                      .ok_or_else(|| {
                          format!("{} does not declare an ns or ns+ namespace", path.display())
                      })?;
                  runtime.register_resource(&namespace, &source);
              }
              Ok(())
          }

          pub fn load(project: &Project, profile: Option<&str>, production: bool) -> Result<Config, String> {
          ''',
          )
          replace_exact(
              "core/src/app.rs",
              "    project::register_sources(project, &mut runtime)?;\n",
              "    register_project_sources(project, &mut runtime)?;\n",
          )
          insert_before_last(
              "core/src/app.rs",
              "}\n",
              '''
              #[test]
              fn generated_hoplite_output_is_never_registered_as_application_source() {
                  let unique = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap()
                      .as_nanos();
                  let root = std::env::temp_dir().join(format!(
                      "hoplite-generated-source-filter-{}-{unique}",
                      std::process::id()
                  ));
                  fs::create_dir_all(root.join(".hoplite")).unwrap();
                  fs::write(
                      root.join("project.edn"),
                      "{:hara/type :project :hara/version \"1.0.0\" :project/id demo/app :project/version \"0.1.0\" :project/source-paths [\".\"] :project/test-paths [] :project/extension-paths [] :project/capabilities #{} :project/main demo.app :project/default-profile :server :project/profiles {:server {:profile/language :hoplite :profile/main demo.app/app}}}",
                  )
                  .unwrap();
                  fs::write(
                      root.join("app.hal"),
                      "(ns demo.app (:require [hoplite.core :as h])) (defn hello [_request] {:status 200 :body \"ok\"}) (def app (h/app {:name \"demo\" :resources [[\"/hello\" {:get {:handler #'hello}}]]}))",
                  )
                  .unwrap();
                  fs::write(
                      root.join(".hoplite/app.hal"),
                      "this generated projection is deliberately not valid HAL",
                  )
                  .unwrap();

                  let project = project::read(&root).unwrap();
                  let config = load(&project, None, true).unwrap();
                  assert_eq!(config.apps[0].name, "demo");
                  fs::remove_dir_all(root).unwrap();
              }
          ''',
          )

          # Development may project source; production removes it deterministically.
          replace_exact(
              "core/src/main.rs",
              "    let runtime_source = runtime_application_modules(&modules)?;\n",
              '''    let runtime_source = if settings.production {
                  None
              } else {
                  Some(runtime_application_modules(&modules)?)
              };
          ''',
          )
          replace_exact(
              "core/src/main.rs",
              "fn build(root: &Path, settings: &BuildSettings) -> Result<PathBuf, String> {\n",
              '''fn write_runtime_source_projection(
              output: &Path,
              runtime_source: Option<&str>,
          ) -> Result<(), String> {
              let path = output.join("app.hal");
              match runtime_source {
                  Some(source) => fs::write(&path, source).map_err(io),
                  None => match fs::remove_file(&path) {
                      Ok(()) => Ok(()),
                      Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(()),
                      Err(error) => Err(format!(
                          "cannot remove production source projection {}: {error}",
                          path.display()
                      )),
                  },
              }
          }

          fn build(root: &Path, settings: &BuildSettings) -> Result<PathBuf, String> {
          ''',
          )
          replace_exact(
              "core/src/main.rs",
              "    fs::write(output.join(\"app.hal\"), &runtime_source).map_err(io)?;\n",
              "    write_runtime_source_projection(&output, runtime_source.as_deref())?;\n",
          )
          insert_before_last(
              "core/src/main.rs",
              "}\n",
              '''
              #[test]
              fn production_projection_removes_stale_development_source() {
                  let unique = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap()
                      .as_nanos();
                  let output = std::env::temp_dir().join(format!(
                      "hoplite-source-projection-{}-{unique}",
                      std::process::id()
                  ));
                  fs::create_dir_all(&output).unwrap();
                  write_runtime_source_projection(&output, Some("(ns demo)"))
                      .unwrap();
                  assert!(output.join("app.hal").is_file());
                  write_runtime_source_projection(&output, None).unwrap();
                  assert!(!output.join("app.hal").exists());
                  fs::remove_dir_all(output).unwrap();
              }
          ''',
          )

          replace_exact(
              "packaging/docker/Dockerfile",
              "COPY --from=builder --chown=hoplite:hoplite /app /app\n",
              "COPY --from=builder --chown=hoplite:hoplite /app/.hoplite /app/.hoplite\n",
          )

          Path("packaging/scripts/assert-production-image.sh").write_text(
              textwrap.dedent('''\
              #!/usr/bin/env bash
              set -euo pipefail

              image="${1:-hoplite-ci}"

              docker run --rm --entrypoint sh "$image" -eu -c '
              test "$(id -u)" -ne 0
              test -d /app/.hoplite
              test "$(find /app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
              test -f /app/.hoplite/app.hbx
              test -f /app/.hoplite/apps.hta
              test -f /app/.hoplite/conf/nginx.conf
              test ! -e /app/.hoplite/app.hal
              test ! -e /app/app.hal
              test ! -e /app/project.edn
              test ! -e /app/Makefile
              if find /app -type f \\( -name "*.hal" -o -name "project.edn" -o -name "hara.extension.edn" \\) -print -quit | grep -q .; then
                echo "production image contains Hara application source or project input" >&2
                find /app -type f \\( -name "*.hal" -o -name "project.edn" -o -name "hara.extension.edn" \\) -print >&2
                exit 1
              fi
              for tool in hoplite cargo rustc cc make; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "production image unexpectedly contains build tool: $tool" >&2
                  exit 1
                fi
              done
              find /app -type f -print | sort
              '

              printf 'Validated source-free production composition for %s.\\n' "$image"
              ''')
          )

          replace_between(
              "README.md",
              "Production build output is isolated under `.hoplite/`:\n",
              "## Runtime model\n",
              '''Production build output is isolated under `.hoplite/`:

          ```text
          .hoplite/
            app.hbx
            apps.hta
            platform.edn
            platform.hta
            conf/nginx.conf
            openapi/<app-name>.json
          ```

          `app.hbx` is the deterministic HAB1 application bundle loaded transactionally
          by a worker. Development builds may also emit `.hoplite/app.hal` for inspection;
          production builds remove that source projection. Generated `.hoplite` output is
          never registered as application input, even when a project uses
          `:project/source-paths ["."]`. Verify a built application without executing it
          with `hoplite verify .`.

          ## Runtime model
          ''',
          )

          with Path("docs/application-bundle.md").open("a") as file:
              file.write('''

          ## Production artifact projection

          Development builds may emit `.hoplite/app.hal` as an inspectable projection.
          Hoplite excludes the entire generated `.hoplite` tree from application source
          registration, including projects whose source path is the project root.
          Production builds remove `app.hal` and retain only versioned serving artifacts,
          generated configuration, platform documents and API descriptions.

          The generic container image copies only `/app/.hoplite` from the builder stage.
          Application `.hal` files, `project.edn`, the development `hoplite` CLI, Cargo,
          Rust and native build tools are absent from the final image. The production image
          gate verifies this composition before exercising the real Nginx serving path.
          ''')
          PY
          chmod +x packaging/scripts/assert-production-image.sh
          cargo fmt --manifest-path core/Cargo.toml --all
          git diff --check
      - name: Prove source filtering and dev-to-production transition
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          rm -rf core/examples/.hoplite
          cargo run --manifest-path core/Cargo.toml -- serve build --mode dev core/examples
          test -f core/examples/.hoplite/app.hal
          cargo run --manifest-path core/Cargo.toml -- serve build --mode prod core/examples
          test ! -e core/examples/.hoplite/app.hal
          cargo run --manifest-path core/Cargo.toml -- verify core/examples
          cargo run --manifest-path core/Cargo.toml -- serve build --mode prod core/examples
          test ! -e core/examples/.hoplite/app.hal
          rm -rf core/examples/.hoplite
      - name: Commit the validated implementation
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/app.rs core/src/main.rs packaging/docker/Dockerfile \
            packaging/scripts/assert-production-image.sh README.md \
            docs/application-bundle.md
          git diff --cached --quiet && {
            echo "source-free production implementation produced no changes" >&2
            exit 1
          }
          git commit -m "Make the production image source-free"
          git push origin HEAD:agent/source-free-production-image
