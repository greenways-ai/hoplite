name: Generate Nginx request-body V3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'core/nginx/ngx_http_hoplite_module.c'
      - 'core/src/app.rs'
      - 'core/src/main.rs'
      - 'core/examples/app.hal'
      - 'packaging/scripts/generate-nginx-request-body-v3'
      - 'packaging/scripts/fix-nginx-request-body-v3'
      - '.github/workflows/generate-nginx-request-body-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-nginx-request-body-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'greenways-ai/hoplite' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'agent/nginx-request-body-v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          path: hoplite
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d0794a7f2e20993220778bcbff97c16735fbb8b4
          path: hara
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize the Nginx adapter and app policy
        working-directory: hoplite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile packaging/scripts/generate-nginx-request-body-v3
          python3 -m py_compile packaging/scripts/fix-nginx-request-body-v3
          python3 packaging/scripts/generate-nginx-request-body-v3
          python3 packaging/scripts/fix-nginx-request-body-v3
          cargo fmt --manifest-path core/Cargo.toml --all

      - name: Test the complete locked Rust workspace
        working-directory: hoplite
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

      - name: Commit materialized source for review
        working-directory: hoplite
        run: |
          if git diff --quiet -- \
            core/nginx/ngx_http_hoplite_module.c \
            core/src/app.rs \
            core/src/main.rs \
            core/examples/app.hal; then
            echo 'Nginx request-body V3 source is already materialized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/nginx/ngx_http_hoplite_module.c \
            core/src/app.rs \
            core/src/main.rs \
            core/examples/app.hal
          git commit -m "Bind declared Nginx request bodies to Hoplite ABI V3"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Remove local build output before the container build
        run: rm -rf hoplite/core/target hara/core/rust/target

      - name: Build the production Nginx image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-body-v3 .

      - name: Exercise body registration through the production image
        shell: bash
        run: |
          set -euo pipefail

          container=$(docker run --detach -p 127.0.0.1::8080 hoplite-body-v3)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          diagnose() {
            echo '--- docker ps ---' >&2
            docker ps -a --filter "id=$container" >&2 || true
            echo '--- container state ---' >&2
            docker inspect "$container" --format '{{json .State}}' >&2 || true
            echo '--- container logs ---' >&2
            docker logs "$container" >&2 || true
            echo '--- generated nginx configuration ---' >&2
            docker exec "$container" sh -c 'cat /app/.hoplite/conf/nginx.conf 2>/dev/null || true' >&2 || true
            echo '--- container processes ---' >&2
            docker top "$container" -eo pid,args >&2 || true
          }

          port=''
          for _ in $(seq 1 50); do
            port=$(docker port "$container" 8080/tcp 2>/dev/null \
              | head -n 1 | awk -F: '{print $NF}' || true)
            if [[ -n "$port" ]]; then
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != true ]]; then
              diagnose
              exit 1
            fi
            sleep .1
          done
          if [[ -z "$port" ]]; then
            echo 'Docker did not publish the Hoplite port.' >&2
            diagnose
            exit 1
          fi

          hello_body=$(mktemp)
          hello_headers=$(mktemp)
          ready=false
          last_status='000'
          for _ in $(seq 1 60); do
            last_status=$(curl --silent --show-error \
              --dump-header "$hello_headers" \
              --output "$hello_body" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:${port}/hello" || true)
            if [[ "$last_status" == 200 ]] \
              && [[ "$(cat "$hello_body")" == 'Hello from Hoplite' ]]; then
              ready=true
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Hoplite did not become ready; last HTTP status: $last_status" >&2
            echo '--- last response headers ---' >&2
            cat "$hello_headers" >&2 || true
            echo '--- last response body ---' >&2
            cat "$hello_body" >&2 || true
            diagnose
            exit 1
          fi

          body_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --data-binary 'hello' \
            "http://127.0.0.1:${port}/body-handle")
          if [[ "$status" != 200 ]] \
            || [[ "$(cat "$body_file")" != 'native-body-handle' ]]; then
            echo "Declared body conformance failed: status=$status body=$(cat "$body_file")" >&2
            diagnose
            exit 1
          fi

          large=$(printf '%040d' 0)
          status=$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --request POST \
            --data-binary "$large" \
            "http://127.0.0.1:${port}/body-handle")
          if [[ "$status" != 413 ]]; then
            echo "Oversized body was not rejected: status=$status body=$(cat "$body_file")" >&2
            diagnose
            exit 1
          fi

          status=$(printf 'hello' | curl --http1.1 --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Transfer-Encoding: chunked' \
            --header 'Content-Length:' \
            --data-binary @- \
            "http://127.0.0.1:${port}/body-handle")
          if [[ "$status" != 411 ]]; then
            echo "Unknown-length body was not rejected: status=$status body=$(cat "$body_file")" >&2
            diagnose
            exit 1
          fi

          status=$(curl --silent --show-error --output "$hello_body" --write-out '%{http_code}' \
            "http://127.0.0.1:${port}/hello")
          if [[ "$status" != 200 ]] \
            || [[ "$(cat "$hello_body")" != 'Hello from Hoplite' ]]; then
            echo 'Body requests damaged the body-free V2 route.' >&2
            diagnose
            exit 1
          fi
