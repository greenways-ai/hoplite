name: Format provider artifact lock 41

on:
  push:
    branches:
      - agent/blob-provider-artifact-lock-41

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d310105d54954399da0b0289b7d43c7d1bf9d984
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact rustfmt output
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          git add core/src/provider_lock.rs core/src/bin/hoplite-provider-lock.rs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Format provider artifact lock verifier"
          git push origin HEAD:${GITHUB_REF_NAME}
