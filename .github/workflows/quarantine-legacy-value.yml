name: Quarantine legacy hoplite.value

on:
  push:
    branches:
      - agent/quarantine-legacy-value-contract-107

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair the temporary materializer string
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/quarantine-legacy-value.py')
          source = path.read_text()
          start = source.index('(ROOT / "migration/value/README.md").write_text(')
          end = source.index('\n\nreplace_once(', start)
          readme = """# Legacy `hoplite.value` compatibility material

          This directory contains the historical bounded canonical-value HAL contract.
          It is migration input, not part of the default Hoplite runtime, application
          bundle, production image, public extension model, or required merge gate.

          The exact namespace remains available only with the non-default Cargo feature
          `legacy-value-contract`. Its focused conformance runs in the path-scoped
          Compatibility workflow. Request data cannot enable this feature or select the
          contract at runtime.

          ## Compatibility window

          The feature remains available for one documented pre-1.0 migration window while
          consumers move to the owning value-provider package. New Hoplite applications
          must not import `hoplite.value`. The eventual extraction or retirement change
          must preserve any generic boundedness, canonical decoding, digest, corruption,
          and failure-shape invariant at the appropriate provider or data-plane boundary.
          """
          replacement = f'(ROOT / "migration/value/README.md").write_text({readme!r})'
          path.write_text(source[:start] + replacement + source[end:])
          PY
      - name: Physically quarantine the migration-only value contract
        run: |
          set +e
          python3 .github/scripts/quarantine-legacy-value.py > /tmp/quarantine.log 2>&1
          status=$?
          set -e
          cat /tmp/quarantine.log
          if [[ "$status" -ne 0 ]]; then
            encoded="$(tail -c 3000 /tmp/quarantine.log | base64 -w0)"
            echo "::error file=.github/scripts/quarantine-legacy-value.py,title=quarantine-log-base64::$encoded"
          fi
          exit "$status"
      - name: Format and validate generated changes
        run: |
          rustfmt --edition 2021 \
            core/src/app.rs \
            core/src/main.rs \
            core/tests/core_boundary.rs \
            core/tests/public_surfaces.rs
          python3 -m json.tool docs/public-surfaces.json >/dev/null
          python3 -m json.tool docs/core-boundary.json >/dev/null
          test ! -e .github/workflows/quarantine-legacy-value.yml
          test ! -e .github/scripts/quarantine-legacy-value.py
          test -f migration/value/src/hoplite/value.hal
          test -f migration/value/test/hoplite/value_test.hal
          test ! -e core/lib/src/hoplite/value.hal
          test ! -e core/lib/test/hoplite/value_test.hal
          git diff --check
      - name: Commit the quarantined compatibility seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "quarantine produced no changes" >&2
            exit 1
          }
          git commit -m "Quarantine the legacy hoplite.value contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"