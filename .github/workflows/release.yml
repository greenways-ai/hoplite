name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.1.0
        required: true
        type: string
      hara_revision:
        description: Optional complete Hara commit SHA for rebuilding a legacy tag
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      hoplite_revision: ${{ steps.metadata.outputs.hoplite_revision }}
      hara_revision: ${{ steps.metadata.outputs.hara_revision }}
      license: ${{ steps.metadata.outputs.license }}
      nginx_version: ${{ steps.metadata.outputs.nginx_version }}
      nginx_sha256: ${{ steps.metadata.outputs.nginx_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          path: hara
          submodules: recursive
          fetch-depth: 0
      - name: Resolve immutable release inputs
        id: metadata
        working-directory: hoplite
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          HARA_REVISION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.hara_revision || '' }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac

          version=${RELEASE_TAG#v}
          crate_version=$(grep -m1 '^version = ' core/Cargo.toml | cut -d'"' -f2)
          test "$version" = "$crate_version"

          if test -n "$HARA_REVISION_OVERRIDE"; then
            hara_revision=$HARA_REVISION_OVERRIDE
            echo "Using explicitly requested Hara revision ${hara_revision}"
          elif test -s packaging/hara-revision; then
            hara_revision=$(tr -d '[:space:]' < packaging/hara-revision)
          elif hara_revision=$(git -C ../hara rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}"); then
            echo "Using matching Hara tag ${RELEASE_TAG} for this legacy release"
          else
            hara_revision=$(git -C ../hara rev-parse HEAD)
            echo "::warning::No pinned or matching-tag Hara revision; using ${hara_revision}"
          fi

          case "$hara_revision" in
            ''|*[!0-9a-f]*) echo "invalid Hara revision: $hara_revision" >&2; exit 1 ;;
          esac
          test "${#hara_revision}" -eq 40
          git -C ../hara cat-file -e "${hara_revision}^{commit}"
          git -C ../hara checkout --detach "$hara_revision"

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hoplite_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "hara_revision=$(git -C ../hara rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "license=$(grep -m1 '^license = ' core/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "nginx_version=$(sed -n 's/^NGINX_VERSION := //p' core/Makefile)" >> "$GITHUB_OUTPUT"
          echo "nginx_sha256=$(sed -n 's/^NGINX_SHA256 := //p' core/Makefile)" >> "$GITHUB_OUTPUT"

  harp:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ needs.prepare.outputs.hara_revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build deterministic HARP
        run: |
          version=${{ needs.prepare.outputs.version }}
          cargo run --manifest-path hara/core/rust/Cargo.toml --bin hara -- \
            package build hoplite/core --output "hoplite-${version}.harp"
          cargo run --manifest-path hara/core/rust/Cargo.toml --bin hara -- \
            package inspect "hoplite-${version}.harp"
          sha256sum "hoplite-${version}.harp"
      - uses: actions/upload-artifact@v4
        with:
          name: hoplite-harp
          path: hoplite-*.harp
          if-no-files-found: error

  container:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ needs.prepare.outputs.hara_revision }}
          path: hara
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/greenways-ai/hoplite
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hoplite/packaging/docker/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ needs.prepare.outputs.hara_revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install openssl@3 pcre2
      - name: Build and smoke-test standalone executable
        working-directory: hoplite/core
        run: |
          make macos
          artifact="target/dist/hoplite-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          test "$("$artifact" eval '(+ 19 23)')" = "42"
          "$artifact" version
      - uses: actions/upload-artifact@v4
        with:
          name: hoplite-${{ matrix.target }}
          path: hoplite/core/target/dist/hoplite-*-${{ matrix.target }}
          if-no-files-found: error

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ needs.prepare.outputs.hara_revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl libpcre2-dev libssl-dev zlib1g-dev
      - name: Build and smoke-test standalone executable
        working-directory: hoplite/core
        run: |
          make embedded-cli
          artifact="target/dist/hoplite-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p target/dist
          install -m 755 target/release/hoplite "$artifact"
          test "$("$artifact" eval '(+ 19 23)')" = "42"
          "$artifact" version
          sha256sum "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: hoplite-${{ matrix.target }}
          path: hoplite/core/target/dist/hoplite-*-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [prepare, harp, container, macos, linux]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.prepare.outputs.tag }}
          path: release-automation
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
      - name: Render formula
        run: |
          mkdir -p rendered/Formula
          VERSION="${{ needs.prepare.outputs.version }}" \
          HOPLITE_REVISION="${{ needs.prepare.outputs.hoplite_revision }}" \
          HARA_REVISION="${{ needs.prepare.outputs.hara_revision }}" \
          LICENSE="${{ needs.prepare.outputs.license }}" \
          NGINX_VERSION="${{ needs.prepare.outputs.nginx_version }}" \
          NGINX_SHA256="${{ needs.prepare.outputs.nginx_sha256 }}" \
            release-automation/packaging/scripts/render-homebrew-formula > rendered/Formula/hoplite.rb
          ruby -c rendered/Formula/hoplite.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: rendered/Formula/hoplite.rb
      - name: Update central Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/greenways-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered/Formula/hoplite.rb tap/Formula/hoplite.rb
          git -C tap diff --check
          if test -z "$(git -C tap status --porcelain -- Formula/hoplite.rb)"; then
            echo "Central tap already contains ${{ needs.prepare.outputs.tag }}"
            exit 0
          fi
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/hoplite.rb
          git -C tap commit -m "hoplite ${{ needs.prepare.outputs.tag }}"
          git -C tap push
