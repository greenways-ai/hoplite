name: Restore native Hoplite stream construction

on:
  push:
    branches:
      - agent/prune-generated-source-output
    paths:
      - ".github/workflows/agent-own-hoplite-stream.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/prune-generated-source-output
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoplite/website/package-lock.json

      - name: Restore the native Stream constructor
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("core/lib/src/hoplite/core.hal")
          source = path.read_text()
          header = '''(ns hoplite.core
            (:config {:override [stream]})
            (:require [std.foundation :as foundation]))
          '''
          corrected_header = '''(ns hoplite.core
            (:config {:override [stream]}))
          '''
          if source.count(header) != 1:
              raise SystemExit(
                  f"expected one Foundation stream alias header; found {source.count(header)}"
              )
          if source.count("(foundation/stream") != 1:
              raise SystemExit(
                  f"expected one foundation/stream call; found {source.count('(foundation/stream')}"
              )
          source = source.replace(header, corrected_header, 1)
          source = source.replace("(foundation/stream", "(Stream/generate", 1)
          path.write_text(source)
          PY
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check

      - name: Publish the stream repair
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-own-hoplite-stream.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore native Hoplite stream construction"
          git push origin HEAD:agent/prune-generated-source-output

      - name: Check Rust formatting
        working-directory: hoplite
        shell: bash
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Test the public HAL contract
        working-directory: hoplite
        shell: bash
        run: |
          cargo test --manifest-path core/Cargo.toml \
            --bin hoplite \
            app::tests::public_hal_contract_evaluates_from_disk \
            -- --exact --nocapture --test-threads=1

      - name: Test application source discovery
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --bin hoplite app::tests::application_source_discovery -- --nocapture

      - name: Test minimal project loading on the default caller stack
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --bin hoplite app::tests::minimal_application_project_loads -- --exact --nocapture

      - name: Test the complete Hoplite core workspace
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

      - name: Build and verify the documentation site
        working-directory: hoplite/website
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          npm ci
          npm run build
