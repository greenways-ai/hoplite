# Source-only helper; removed before review.
name: Apply provider set lock validator

env:
  HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984

on:
  push:
    branches:
      - agent/blob-value-provider-set-85-91
    paths:
      - .github/workflows/agent-apply-provider-set-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/blob-value-provider-set-85-91
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reconcile and test the closed validator
        working-directory: hoplite
        run: |
          git show origin/main:core/src/provider_lock.rs > core/src/provider_lock.rs

          python3 - <<'PY'
          from pathlib import Path

          lock = Path('core/src/provider_lock.rs')
          text = lock.read_text()
          marker = '''pub use object_backend::{
              validate as validate_object_backend_lock, Expected as ObjectBackendExpected,
              ValidatedLock as ValidatedObjectBackendLock, FORMAT as OBJECT_BACKEND_FORMAT,
          };

          '''
          addition = '''#[path = "provider_lock/provider_set.rs"]
          mod provider_set;
          pub use provider_set::{
              validate as validate_provider_set_lock, Expected as ProviderSetExpected,
              ValidatedSet as ValidatedProviderSet, FORMAT as PROVIDER_SET_FORMAT,
          };

          '''
          if text.count(marker) != 1:
              raise SystemExit('main provider lock module boundary changed')
          lock.write_text(text.replace(marker, marker + addition))

          provider_set = Path('core/src/provider_lock/provider_set.rs')
          text = provider_set.read_text()
          old = 'value["providers"][1] = value["providers"][0].clone();'
          new = 'value["providers"][1]["provider"] = Value::String("hoplite.blob".into());'
          if text.count(old) != 1:
              raise SystemExit('duplicate provider fixture changed')
          provider_set.write_text(text.replace(old, new))
          PY

          rustfmt --edition 2021 \
            core/src/provider_lock.rs \
            core/src/provider_lock/object_backend.rs \
            core/src/provider_lock/provider_set.rs \
            core/src/bin/hoplite-provider-set-lock.rs
          cargo test --manifest-path core/Cargo.toml --workspace --locked \
            --bin hoplite-provider-lock \
            --bin hoplite-object-backend-lock \
            --bin hoplite-provider-set-lock
      - name: Commit only the reconciled source
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/src/provider_lock.rs \
            core/src/provider_lock/provider_set.rs \
            core/src/bin/hoplite-provider-set-lock.rs
          git commit -m "Validate pinned provider sets"
          git push origin HEAD:agent/blob-value-provider-set-85-91
