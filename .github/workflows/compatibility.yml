name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/compatibility.yml"
      - "core/abi/blob-store/**"
      - "core/abi/blob-store-filesystem/**"
      - "core/abi/blob-store-conformance/**"
      - "core/abi/provider-hta/**"
      - "core/abi/value-store/**"
      - "core/abi/value-store-sqlite/**"
      - "core/abi/value-store-provider/**"
      - "core/abi/value-store-provider-ffi/**"

permissions:
  contents: read

concurrency:
  group: hoplite-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-interfaces:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: provider-hta
            manifest: core/abi/provider-hta/Cargo.toml
          - package: blob-store
            manifest: core/abi/blob-store/Cargo.toml
          - package: blob-store-filesystem
            manifest: core/abi/blob-store-filesystem/Cargo.toml
          - package: blob-store-conformance
            manifest: core/abi/blob-store-conformance/Cargo.toml
          - package: value-store
            manifest: core/abi/value-store/Cargo.toml
          - package: value-store-sqlite
            manifest: core/abi/value-store-sqlite/Cargo.toml
          - package: value-store-provider
            manifest: core/abi/value-store-provider/Cargo.toml
          - package: value-store-provider-ffi
            manifest: core/abi/value-store-provider-ffi/Cargo.toml
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --manifest-path "${{ matrix.manifest }}" --all -- --check
      - name: Reject warnings
        run: cargo clippy --manifest-path "${{ matrix.manifest }}" --all-targets --locked -- -D warnings
      - name: Run conformance tests
        run: cargo test --manifest-path "${{ matrix.manifest }}" --all-targets --locked

  public-store-header:
    name: public store header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compile the public C interface
        run: |
          cat > /tmp/hoplite-value-store-provider.c <<'EOF'
          #include "hoplite_value_store_provider.h"

          static void check_signatures(void) {
            uint32_t (*version)(void) = hoplite_value_store_provider_abi_version;
            int32_t (*open_sqlite)(const uint8_t *, size_t, size_t, size_t,
                                   hoplite_value_store_provider_t **) =
              hoplite_value_store_provider_open_sqlite_v1;
            int32_t (*execute)(hoplite_value_store_provider_t *,
                               const uint8_t *, size_t,
                               const uint8_t *, size_t,
                               hoplite_value_store_result_v1_t *) =
              hoplite_value_store_provider_execute_v1;
            void (*free_result)(hoplite_value_store_result_v1_t *) =
              hoplite_value_store_provider_result_free_v1;
            void (*close_provider)(hoplite_value_store_provider_t *) =
              hoplite_value_store_provider_close_v1;
            (void)version;
            (void)open_sqlite;
            (void)execute;
            (void)free_result;
            (void)close_provider;
          }

          int main(void) {
            check_signatures();
            return HOPLITE_VALUE_STORE_PROVIDER_ABI_VERSION == 1u &&
                   HOPLITE_VALUE_STORE_PROVIDER_OK == 0 &&
                   HOPLITE_VALUE_STORE_RESULT_SUCCESS == 0u &&
                   HOPLITE_VALUE_STORE_RESULT_FAILURE == 1u ? 0 : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/abi/value-store-provider-ffi/include \
            -fsyntax-only /tmp/hoplite-value-store-provider.c
