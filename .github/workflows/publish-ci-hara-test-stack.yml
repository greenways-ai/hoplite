name: Publish CI Hara test stack

on:
  push:
    branches:
      - fix/ci-hara-test-stack-clean

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-hara-test-stack-clean
      - name: Add the stack setting without rewriting CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          needle = "  HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6\n"
          addition = (
              needle
              + "  # Cargo is invoked from the parent of the hoplite checkout, so repository\n"
              + "  # .cargo configuration is not discovered by CI. Match the normal Linux\n"
              + "  # process stack used by the builder and worker for evaluator-heavy tests.\n"
              + "  RUST_MIN_STACK: 8388608\n"
          )
          if 'RUST_MIN_STACK:' in text:
              raise SystemExit('CI already declares RUST_MIN_STACK')
          if text.count(needle) != 1:
              raise SystemExit('expected one HARA_REF insertion point')
          path.write_text(text.replace(needle, addition, 1))
          PY
          git diff -- .github/workflows/ci.yml
          additions=$(git diff --numstat -- .github/workflows/ci.yml | cut -f1)
          deletions=$(git diff --numstat -- .github/workflows/ci.yml | cut -f2)
          test "$additions" = 4
          test "$deletions" = 0
      - name: Commit the exact CI boundary change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Apply the Hara test stack at the CI process boundary"
          git push origin HEAD:fix/ci-hara-test-stack-clean
