name: Fix Nginx runtime ABI compatibility

on:
  push:
    branches:
      - agent/data-plane-request-v3
    paths:
      - '.github/workflows/fix-nginx-runtime-abi-compat.yml'

permissions:
  contents: write

concurrency:
  group: fix-nginx-runtime-abi-compat
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/data-plane-request-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Accept newer runtimes that preserve the V2 ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/nginx/ngx_http_hoplite_module.c')
          source = path.read_text(encoding='utf-8')
          old = 'ngx_http_hoplite_runtime == NULL || hoplite_abi_version() != 2'
          new = 'ngx_http_hoplite_runtime == NULL || hoplite_abi_version() < 2'
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one exact ABI compatibility check, found {source.count(old)}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
          grep -F 'hoplite_abi_version() < 2' core/nginx/ngx_http_hoplite_module.c
      - name: Commit the compatibility repair and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-nginx-runtime-abi-compat.yml
          git add core/nginx/ngx_http_hoplite_module.c
          git commit -m 'Accept newer runtimes that retain the V2 ABI'
          git push origin HEAD:agent/data-plane-request-v3
