name: Build blob store shared reader integration

on:
  push:
    branches:
      - agent/blob-store-shared-reader-91
    paths:
      - .github/workflows/agent-blob-store-shared-reader.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/blob-store-shared-reader-91
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d2a2e376917131cfb8954ac156db3a5e174f2c1a
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy

      - name: Apply the shared-reader integration
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          reader_source = Path("core/abi/blob-filesystem-reader/src/source.rs")
          reader_text = reader_source.read_text()
          old_reader_source = """pub struct FilesystemResponseSource {
              file: File,
          """
          new_reader_source = """#[derive(Debug)]
          pub struct FilesystemResponseSource {
              file: File,
          """
          if reader_text.count(old_reader_source) != 1:
              raise SystemExit("shared response-source declaration changed")
          reader_source.write_text(reader_text.replace(old_reader_source, new_reader_source))

          blob = Path("core/abi/blob-store-filesystem/src/lib.rs")
          text = blob.read_text()

          old_docs = """//! The driver owns byte movement, incremental SHA-256 verification, fsync,
          //! restart recovery and digest-derived object paths. It does not understand
          """
          new_docs = """//! The driver owns staging, immutable installation, fsync and restart
          //! recovery. Verified immutable reads and response ranges are delegated to
          //! the shared filesystem object reader. It does not understand
          """
          if text.count(old_docs) != 1:
              raise SystemExit("blob driver ownership documentation changed")
          text = text.replace(old_docs, new_docs)

          import_marker = "use fs2::FileExt;\n"
          reader_import = (
              "use hoplite_blob_filesystem_reader::{\n"
              "    FilesystemObjectReader, FilesystemResponseSource, Limits as ReaderLimits,\n"
              "};\n"
          )
          if text.count(import_marker) != 1:
              raise SystemExit("blob driver import marker changed")
          text = text.replace(import_marker, import_marker + reader_import)

          response_import = (
              "    ObjectRange, ResponseSource, StagingAppend, StagingCommit, StagingKey, "
              "StagingOpen,\n"
          )
          if text.count(response_import) != 1:
              raise SystemExit("blob driver ResponseSource import changed")
          text = text.replace(
              response_import,
              "    ObjectRange, StagingAppend, StagingCommit, StagingKey, StagingOpen,\n",
          )

          old_struct = """    limits: Limits,
              process_lock: Mutex<()>,
          }"""
          new_struct = """    limits: Limits,
              reader: FilesystemObjectReader,
              process_lock: Mutex<()>,
          }"""
          if text.count(old_struct) != 1:
              raise SystemExit("blob driver struct shape changed")
          text = text.replace(old_struct, new_struct)

          old_open = """        drop(lock);
              sync_directory(&root)?;

              let store = Self {
                  root,
                  staging_dir,
                  objects_dir,
                  lock_path,
                  limits,
                  process_lock: Mutex::new(()),
              };"""
          new_open = """        drop(lock);
              sync_directory(&root)?;

              let reader_max_object_bytes = usize::try_from(limits.max_object_bytes).map_err(|_| {
                  Error::InvalidLimits("max_object_bytes exceeds the host usize range")
              })?;
              let reader = FilesystemObjectReader::open(
                  &root,
                  ReaderLimits {
                      max_object_bytes: reader_max_object_bytes,
                      max_media_type_bytes: limits.max_media_type_bytes,
                      io_chunk_bytes: IO_CHUNK_BYTES.min(reader_max_object_bytes),
                  },
              )
              .map_err(|error| Error::driver(error.code(), error.to_string()))?;

              let store = Self {
                  root,
                  staging_dir,
                  objects_dir,
                  lock_path,
                  limits,
                  reader,
                  process_lock: Mutex::new(()),
              };"""
          if text.count(old_open) != 1:
              raise SystemExit("blob driver open sequence changed")
          text = text.replace(old_open, new_open)

          function_marker = (
              "    fn object_open_source(&self, request: ObjectRange) "
              "-> Result<Self::Source, Error> {"
          )
          function_start = text.find(function_marker)
          source_marker = "\n}\n\npub struct FilesystemResponseSource {"
          function_boundary = text.find(source_marker, function_start)
          if function_start < 0 or function_boundary < 0:
              raise SystemExit("blob driver object_open_source boundary changed")
          replacement = (
              "    fn object_open_source(&self, request: ObjectRange) "
              "-> Result<Self::Source, Error> {\n"
              "        self.reader.open_source(request)\n"
              "    }\n"
          )
          text = text[:function_start] + replacement + text[function_boundary:]

          source_start = text.find("pub struct FilesystemResponseSource {")
          guard_start = text.find("struct OperationGuard<'a> {", source_start)
          if source_start < 0 or guard_start < 0:
              raise SystemExit("local response-source block changed")
          text = text[:source_start] + text[guard_start:]
          blob.write_text(text)

          tests = Path("core/abi/blob-store-filesystem/src/tests.rs")
          tests_text = tests.read_text()
          test_import = "use super::*;\n"
          if tests_text.count(test_import) != 1:
              raise SystemExit("blob driver test import changed")
          tests.write_text(
              tests_text.replace(
                  test_import,
                  test_import + "use hoplite_blob_store::ResponseSource;\n",
              )
          )

          replace_once(
              "core/abi/blob-store-filesystem/Cargo.toml",
              'fs2 = "0.4"\nhoplite-blob-store = { path = "../blob-store" }\n',
              'fs2 = "0.4"\n'
              'hoplite-blob-filesystem-reader = { path = "../blob-filesystem-reader" }\n'
              'hoplite-blob-store = { path = "../blob-store" }\n',
          )

          replace_once(
              "core/abi/blob-store-provider-ffi/Cargo.toml",
              'hoplite-blob-store = { path = "../blob-store" }\n'
              'hoplite-blob-store-filesystem = { path = "../blob-store-filesystem" }\n',
              'hoplite-blob-store = { path = "../blob-store" }\n'
              'hoplite-blob-filesystem-reader = { path = "../blob-filesystem-reader" }\n'
              'hoplite-blob-store-filesystem = { path = "../blob-store-filesystem" }\n',
          )

          ffi = Path("core/abi/blob-store-provider-ffi/src/lib.rs")
          ffi_text = ffi.read_text()
          old_import = (
              "use hoplite_blob_store_filesystem::{"
              "FilesystemBlobStore, FilesystemResponseSource};\n"
          )
          new_import = (
              "use hoplite_blob_filesystem_reader::FilesystemResponseSource;\n"
              "use hoplite_blob_store_filesystem::FilesystemBlobStore;\n"
          )
          if ffi_text.count(old_import) != 1:
              raise SystemExit("FFI filesystem source import changed")
          ffi_text = ffi_text.replace(old_import, new_import)

          old_variant = "    Filesystem(FilesystemBlobStore),\n"
          new_variant = "    Filesystem(Box<FilesystemBlobStore>),\n"
          if ffi_text.count(old_variant) != 1:
              raise SystemExit("FFI installed filesystem variant changed")
          ffi_text = ffi_text.replace(old_variant, new_variant)

          old_constructor = (
              "        let store = FilesystemBlobStore::open(Path::new(root), limits)\n"
              "            .map(InstalledBlobStore::Filesystem)\n"
              "            .map_err(|_| ())?;\n"
          )
          new_constructor = (
              "        let store = FilesystemBlobStore::open(Path::new(root), limits)\n"
              "            .map(Box::new)\n"
              "            .map(InstalledBlobStore::Filesystem)\n"
              "            .map_err(|_| ())?;\n"
          )
          if ffi_text.count(old_constructor) != 1:
              raise SystemExit("FFI filesystem constructor changed")
          ffi.write_text(ffi_text.replace(old_constructor, new_constructor))

          build = Path("packaging/scripts/build-blob-provider-artifact.sh")
          build_text = build.read_text()
          old_payload = (
              "  core/abi/blob-store\n"
              "  core/abi/blob-store-filesystem\n"
          )
          new_payload = (
              "  core/abi/blob-store\n"
              "  core/abi/blob-filesystem-reader\n"
              "  core/abi/blob-store-filesystem\n"
          )
          if build_text.count(old_payload) != 1:
              raise SystemExit("blob artifact payload inventory changed")
          build_text = build_text.replace(old_payload, new_payload)

          old_crates = (
              "  blob-store \\\n"
              "  blob-store-filesystem \\\n"
          )
          new_crates = (
              "  blob-store \\\n"
              "  blob-filesystem-reader \\\n"
              "  blob-store-filesystem \\\n"
          )
          if build_text.count(old_crates) != 1:
              raise SystemExit("blob artifact crate list changed")
          build.write_text(build_text.replace(old_crates, new_crates))

          replace_once(
              "packaging/scripts/verify-blob-provider-artifact.sh",
              "  abi/blob-store/Cargo.toml\n"
              "  abi/blob-store-filesystem/Cargo.toml\n",
              "  abi/blob-store/Cargo.toml\n"
              "  abi/blob-filesystem-reader/Cargo.toml\n"
              "  abi/blob-store-filesystem/Cargo.toml\n",
          )

          artifact_workflow = Path(".github/workflows/blob-provider-artifact.yml")
          artifact_text = artifact_workflow.read_text()
          if artifact_text.count("PROVIDER_VERSION: 0.1.0") != 1:
              raise SystemExit("blob provider artifact version changed")
          artifact_text = artifact_text.replace(
              "PROVIDER_VERSION: 0.1.0",
              "PROVIDER_VERSION: 0.1.1",
          )
          old_paths = (
              "      - core/abi/blob-store/**\n"
              "      - core/abi/blob-store-filesystem/**\n"
          )
          new_paths = (
              "      - core/abi/blob-store/**\n"
              "      - core/abi/blob-filesystem-reader/**\n"
              "      - core/abi/blob-store-filesystem/**\n"
          )
          if artifact_text.count(old_paths) != 2:
              raise SystemExit("blob provider artifact workflow paths changed")
          artifact_workflow.write_text(artifact_text.replace(old_paths, new_paths))

          reader_readme = Path("core/abi/blob-filesystem-reader/README.md")
          readme_text = reader_readme.read_text()
          old_consumers = """The filesystem blob driver remains responsible for staging, installation and
          response-source mechanics. A follow-up under Hoplite #91 will route its immutable
          read verification through this package as well, leaving one authoritative
          filesystem object-read implementation.
          """
          new_consumers = """The filesystem blob driver remains responsible for staging and immutable
          installation. Its `object/open-source` path delegates whole-object verification
          and bounded range-source construction to this package. `hoplite.value` delegates
          bounded value materialization to the same backend, leaving one authoritative
          filesystem object-read implementation.
          """
          if readme_text.count(old_consumers) != 1:
              raise SystemExit("shared reader README consumer section changed")
          reader_readme.write_text(readme_text.replace(old_consumers, new_consumers))

          artifact_doc = Path("packaging/providers/blob/ARTIFACT.md")
          doc_text = artifact_doc.read_text()
          old_contents = (
              "- the application-neutral blob-store contract;\n"
              "- the filesystem driver;\n"
          )
          new_contents = (
              "- the application-neutral blob-store contract;\n"
              "- the shared verified filesystem object reader;\n"
              "- the filesystem staging and immutable-installation driver;\n"
          )
          if doc_text.count(old_contents) != 1:
              raise SystemExit("blob artifact contents section changed")
          doc_text = doc_text.replace(old_contents, new_contents)
          old_heading = "## Published package `0.1.0`\n"
          new_heading = "## Current pinned production package `0.1.0`\n"
          if doc_text.count(old_heading) != 1:
              raise SystemExit("blob artifact published package heading changed")
          doc_text = doc_text.replace(old_heading, new_heading)
          note_marker = (
              "The source-tree `provider-manifest.json` keeps `artifact.digest` null because an\n"
          )
          release_note = (
              "The source build workflow now emits `0.1.1`, which adds the shared reader to\n"
              "the closed artifact. A follow-up pin PR will bind its published digest and\n"
              "source revision before production composition moves from `0.1.0`.\n\n"
          )
          if doc_text.count(note_marker) != 1:
              raise SystemExit("blob artifact pin note marker changed")
          artifact_doc.write_text(doc_text.replace(note_marker, release_note + note_marker))
          PY

          cargo generate-lockfile \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml
          cargo generate-lockfile \
            --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml
          rustfmt --edition 2021 \
            core/abi/blob-filesystem-reader/src/source.rs \
            core/abi/blob-store-filesystem/src/lib.rs \
            core/abi/blob-store-filesystem/src/tests.rs \
            core/abi/blob-store-provider-ffi/src/lib.rs

      - name: Commit the clean source patch locally
        working-directory: hoplite
        run: |
          rm .github/workflows/agent-blob-store-shared-reader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route filesystem blob reads through the shared backend"

      - name: Validate reader, blob, value and FFI packages
        working-directory: hoplite
        run: |
          cargo clippy \
            --manifest-path core/abi/blob-filesystem-reader/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test \
            --manifest-path core/abi/blob-filesystem-reader/Cargo.toml \
            --all-targets --locked

          cargo clippy \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked

          cargo clippy \
            --manifest-path core/abi/value-provider-filesystem/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test \
            --manifest-path core/abi/value-provider-filesystem/Cargo.toml \
            --all-targets --locked

          cargo clippy \
            --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test \
            --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml \
            --all-targets --locked

      - name: Build and verify the deterministic 0.1.1 source artifact
        working-directory: hoplite
        run: |
          revision=$(git rev-parse HEAD)
          artifact="$RUNNER_TEMP/hoplite-blob-provider-0.1.1.tar.gz"
          extracted="$RUNNER_TEMP/extracted"

          bash packaging/scripts/build-blob-provider-artifact.sh \
            0.1.1 "$revision" "$artifact"
          digest=$(awk '{print $1}' "$artifact.sha256")
          bash packaging/scripts/verify-blob-provider-artifact.sh \
            "$artifact" "$digest" "$extracted"

          package="$extracted/hoplite-blob-provider-0.1.1"
          test -f "$package/abi/blob-filesystem-reader/Cargo.toml"
          cargo test \
            --manifest-path "$package/abi/blob-store-provider-ffi/Cargo.toml" \
            --locked

      - name: Push the validated clean commit
        working-directory: hoplite
        run: |
          git push origin HEAD:agent/blob-store-shared-reader-91
