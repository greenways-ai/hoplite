name: Hara blob response plans

env:
  HARA_REF: d0794a7f2e20993220778bcbff97c16735fbb8b4

on:
  push:
    branches:
      - agent/hara-blob-response-plans
    paths:
      - core/nginx/ngx_http_hoplite_module.c
      - core/nginx/hoplite_blob_host_provider.c
      - core/nginx/hoplite_blob_host_provider.h
      - core/examples/**
      - packaging/scripts/smoke-request-body-v3.sh
      - packaging/scripts/smoke-response-source.sh
      - scripts/materialize-hara-blob-response-plans.py
      - .github/workflows/hara-blob-response-plans.yml
  pull_request:
    paths:
      - core/nginx/ngx_http_hoplite_module.c
      - core/nginx/hoplite_blob_host_provider.c
      - core/nginx/hoplite_blob_host_provider.h
      - core/examples/**
      - packaging/scripts/smoke-request-body-v3.sh
      - packaging/scripts/smoke-response-source.sh
      - .github/workflows/hara-blob-response-plans.yml

permissions:
  contents: write

concurrency:
  group: hara-blob-response-plans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-source-response:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/hara-blob-response-plans
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - name: Materialize the source-backed response engine
        if: hashFiles('hoplite/scripts/materialize-hara-blob-response-plans.py') != ''
        run: |
          cd hoplite
          python3 scripts/materialize-hara-blob-response-plans.py
          bash -n packaging/scripts/smoke-request-body-v3.sh
          bash -n packaging/scripts/smoke-response-source.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            core/nginx/ngx_http_hoplite_module.c \
            core/examples/app.hal \
            packaging/scripts/smoke-request-body-v3.sh \
            packaging/scripts/smoke-response-source.sh \
            scripts/materialize-hara-blob-response-plans.py
          git commit -m "Stream hara.blob sources through Nginx responses"
          git fetch origin agent/hara-blob-response-plans
          git rebase origin/agent/hara-blob-response-plans
          git push origin HEAD:agent/hara-blob-response-plans
      - name: Validate shell fixtures
        run: |
          bash -n hoplite/packaging/scripts/smoke-request-body-v3.sh
          bash -n hoplite/packaging/scripts/smoke-response-source.sh
      - name: Build the production image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-response-source .
      - name: Preserve ordinary and request-body responses
        run: |
          bash hoplite/packaging/scripts/smoke-request-body-v3.sh hoplite-response-source
          bash hoplite/packaging/scripts/smoke-host-providers.sh hoplite-response-source
      - name: Exercise complete, HEAD, range, slow and rejected source responses
        run: bash hoplite/packaging/scripts/smoke-response-source.sh hoplite-response-source
