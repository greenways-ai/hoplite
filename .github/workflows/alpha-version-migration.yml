name: Alpha version alignment migration

on:
  push:
    branches:
      - agent/align-alpha-versioning

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 6dd73bbb9ba546b90dee0a075323998dd3abac85
          path: hara
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align Hoplite with the alpha contract epoch
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          migration = Path('.github/workflows/alpha-version-migration.yml')
          old_hara = '494b17a39c952f24a68bfeda1bd66283a80f735c'
          alpha_hara = '6dd73bbb9ba546b90dee0a075323998dd3abac85'
          replacements = [
              ('hoplite.application-bundle/1', 'hoplite.application-bundle/0-alpha'),
              ('HAB1', 'HAB0'),
              ('hab1', 'hab0'),
              ('HBB2', 'HBX0'),
              ('hbb2', 'hbx0'),
              ('Hoplite 0.2', 'Hoplite alpha'),
              ('0.2 release line', 'alpha release line'),
              ('0.2 release', 'alpha release'),
              ('0.2 line', 'alpha line'),
              ('0.2 acceptance', 'alpha acceptance'),
              (old_hara, alpha_hara),
          ]

          counts = {old: 0 for old, _ in replacements[:5]}
          changed = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if path == migration:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  found = text.count(old)
                  if old in counts:
                      counts[old] += found
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          for required in ('hoplite.application-bundle/1', 'HAB1', 'HBB2'):
              if counts[required] == 0:
                  raise SystemExit(f'expected stale alpha-reset marker was not found: {required}')

          bundle_path = Path('core/application-bundle/src/lib.rs')
          bundle = bundle_path.read_text()
          constants = '''pub const FORMAT: &str = "hoplite.application-bundle/0-alpha";
pub const MAGIC: &[u8; 4] = b"HAB0";
pub const RUNTIME_ABI_VERSION: u32 = 4;'''
          replacement_constants = '''/// Portable document identity for the current pre-release application envelope.
pub const FORMAT: &str = "hoplite.application-bundle/0-alpha";
/// Four-byte marker for the Hoplite-owned alpha application envelope.
pub const MAGIC: &[u8; 4] = b"HAB0";
/// Hara-owned alpha bundle marker required inside the Hoplite envelope.
pub const HARA_BUNDLE_MAGIC: &[u8; 4] = b"HBX0";
/// Numeric embedding ABI compatibility. This is independent of format maturity.
pub const RUNTIME_ABI_VERSION: u32 = 4;'''
          if constants not in bundle:
              raise SystemExit('application-bundle constants did not match the expected shape')
          bundle = bundle.replace(constants, replacement_constants, 1)
          validator = 'if bytecode.len() < 4 || &bytecode[..4] != b"HBX0" {'
          validator_replacement = '''if bytecode.len() < HARA_BUNDLE_MAGIC.len()
        || &bytecode[..HARA_BUNDLE_MAGIC.len()] != HARA_BUNDLE_MAGIC
    {'''
          if validator not in bundle:
              raise SystemExit('application-bundle inner magic validator was not found')
          bundle = bundle.replace(validator, validator_replacement, 1)
          test_marker = '''    #[test]
    fn bounded_file_reads_preserve_exact_bytes_and_reject_oversize() {'''
          negative_test = '''    #[test]
    fn rejects_pre_reset_bundle_markers() {
        let manifest = b"manifest";

        let mut old_outer = encode(manifest, &hbx0()).unwrap();
        let mut old_outer_magic = *MAGIC;
        old_outer_magic[3] = b'1';
        old_outer[..MAGIC.len()].copy_from_slice(&old_outer_magic);
        assert_eq!(decode(&old_outer, manifest), Err(Error::InvalidMagic));

        let mut old_inner = HARA_BUNDLE_MAGIC.to_vec();
        old_inner[2] = b'B';
        old_inner[3] = b'2';
        old_inner.extend_from_slice(b"legacy-bytecode");
        assert_eq!(
            encode(manifest, &old_inner),
            Err(Error::InvalidBytecodeMagic)
        );
    }

'''
          if test_marker not in bundle:
              raise SystemExit('application-bundle insertion point was not found')
          bundle = bundle.replace(test_marker, negative_test + test_marker, 1)
          bundle_path.write_text(bundle)

          header_path = Path('core/nginx/hoplite_runtime.h')
          header = header_path.read_text()
          header_marker = '''/*
 * Validate one HAB0 bundle against the exact route manifest, load its embedded
 * HBX0 modules, and prepare every app route as one transactional startup.
 */'''
          header_replacement = '''/*
 * The `_v1` suffix on these exported bootstrap symbols identifies the first C
 * function shape. It is independent of the alpha document epoch below.
 *
 * Validate one HAB0 bundle against the exact route manifest, load its embedded
 * HBX0 modules, and prepare every app route as one transactional startup.
 */'''
          if header_marker not in header:
              raise SystemExit('runtime header alpha bootstrap comment was not found')
          header_path.write_text(header.replace(header_marker, header_replacement, 1))

          Path('docs/application-bundle.md').write_text('''# Hoplite application bundle alpha

Production workers boot one **Hoplite application bundle** rather than treating
compiled Hara modules and the route manifest as unrelated inputs.

The current portable document identity is
`hoplite.application-bundle/0-alpha`. Its four-byte outer marker is `HAB0`.
The format is intentionally pre-release and is not a stability promise.

## Format

The byte layout is deterministic:

```text
HAB0
sha256(payload)
runtime ABI (u32 little-endian)
sha256(exact apps.hta bytes)
embedded bytecode length (u32 little-endian)
embedded Hara HBX0 bytecode bundle
```

`HAB0` is the Hoplite-owned application envelope. `HBX0` remains the Hara-owned
container for namespace-preserving HBC0 modules. Hoplite does not duplicate the
Hara module table inside its envelope.

The alpha decoder rejects:

- unsupported runtime ABI versions;
- an empty or oversized route manifest;
- an empty, oversized, or non-HBX0 bytecode payload;
- checksum, manifest-digest, and declared-length mismatches;
- truncation and trailing bytes;
- markers from the pre-reset stable-looking format epoch.

The current limits are 8 MiB for `apps.hta` and 64 MiB for embedded HBX0
bytecode.

## Startup law

The worker validates the complete HAB0 envelope, then performs a full
bytecode-and-route preflight on an isolated thread. Hara's thread-local protocol
and multimethod state cannot leak from a rejected preflight. Only after that
succeeds does Hoplite construct a fresh staged runtime, load the same HBX0 bytes,
prepare the same route handlers, and atomically replace the pristine worker
runtime.

A bytecode failure, unknown handler, malformed manifest, checksum mismatch, or
manifest substitution leaves the serving runtime with neither partially loaded
namespaces nor partially prepared routes. Combined application bootstrap is
therefore accepted only on a fresh runtime.

## Compatibility during alpha

The envelope records numeric Hoplite runtime ABI compatibility separately from
its portable document identity. Runtime ABI `4` and the exported
`hoplite_bootstrap_application_v1` symbols describe native call shapes; they do
not promote the application document out of alpha.

An incompatible change to the envelope, manifest-binding law, or required inner
Hara format must change the alpha epoch or marker and include a migration note.
No `/1` portable application-bundle contract is claimed by the current code.
See [Versioning during alpha](versioning.md) for the complete rule.

The lower-level `hoplite_bootstrap_bytecode`, `hoplite_apps_prepare`, and
byte-oriented `hoplite_bootstrap_application_v1` symbols remain available for
embedding compatibility. Generated Nginx production configuration uses the
bounded file-based `hoplite_bootstrap_application_files_v1` entry point.

## Source-free verification

`hoplite verify [--manifest FILE] [PROJECT|OUTPUT|BUNDLE]` reads only the built
HAB0 and its exact manifest. It applies the same regular-file and size limits
used by production worker startup, verifies the envelope and manifest digest,
validates the HTA document, and reports the runtime ABI, digest, and embedded
HBX0 size without executing application code.

The Nginx module passes configured paths to the Rust runtime rather than
allocating files in C. Bundle and manifest limits are therefore checked before
allocation from one library-owned implementation.

## Production artifact projection

Development builds may emit `.hoplite/app.hal` as an inspectable projection.
Hoplite excludes the entire generated `.hoplite` tree from application source
registration, including projects whose source path is the project root.
Production builds remove `app.hal` and retain only alpha serving artifacts,
generated configuration, platform documents, and API descriptions.

The generic container image copies only `/app/.hoplite` from the builder stage.
Application `.hal` files, `project.edn`, the development `hoplite` CLI, Cargo,
Rust, and native build tools are absent from the final image. The production
image gate verifies this composition before exercising the real Nginx serving
path.
''')

          Path('docs/versioning.md').write_text('''# Versioning during alpha

Hara and Hoplite are in a pre-release development period. Version labels belong
to distinct compatibility spaces and must not be interpreted as one global
maturity number.

## Distribution versions

Cargo crates, Homebrew formulae, container tags, and project packages use
ordinary pre-1.0 SemVer such as `0.1.x`. These numbers let package managers order
artifacts. They do not declare the language, HTTP runtime, or portable contracts
stable.

## Portable formats and protocols

Evolving Hara- and Hoplite-owned wire documents use an explicit alpha epoch:

| Surface | Current identity |
| --- | --- |
| Hara bytecode artifact | `HBC0` |
| Hara bytecode bundle | `HBX0` |
| Hoplite application bundle | `hoplite.application-bundle/0-alpha` / `HAB0` |
| Other evolving portable contracts | `<contract>/0-alpha` |

An incompatible alpha change may replace an epoch or marker, but it must update
code, fixtures, documentation, and migration notes together. Stable-looking
portable major versions are not introduced until that surface is deliberately
frozen.

Independently mature formats are not reset merely because another surface is in
alpha. Each contract must name its own compatibility law.

## Native ABI and symbol revisions

Numeric runtime ABI values and suffixes such as `_v1`, `_v2`, and `_v3` identify
native structure or function shapes. For example, Hoplite runtime ABI `4` remains
the current embedding compatibility value. These identifiers are independent of
portable document maturity and must not be rewritten as marketing or release
versions.

## Repository rule

A change is conforming when:

1. evolving portable contracts use the declared alpha identity;
2. package-manager versions remain valid pre-1.0 SemVer;
3. native ABI generations change only when their binary shape changes;
4. tests reject obsolete format markers rather than silently accepting them;
5. user-facing documentation describes the same identities enforced by code.

`packaging/scripts/verify-alpha-versioning.sh` protects these invariants in CI.
''')

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme_anchor = '''bounded host boundaries, asynchronous suspension, and streaming responses.

'''
          alpha_note = '''bounded host boundaries, asynchronous suspension, and streaming responses.

> **Alpha versioning:** evolving Hoplite documents use explicit alpha identities.
> Production application bundles are `hoplite.application-bundle/0-alpha` / `HAB0`
> and carry Hara `HBX0`. Distribution packages remain ordinary pre-1.0 SemVer,
> while native ABI numbers and symbol suffixes describe call shapes. See
> [Versioning during alpha](docs/versioning.md).

'''
          if readme_anchor not in readme:
              raise SystemExit('README alpha-note insertion point was not found')
          readme_path.write_text(readme.replace(readme_anchor, alpha_note, 1))

          direction_path = Path('docs/project-direction.md')
          direction = direction_path.read_text()
          if '## Alpha versioning' not in direction:
              direction += '''

## Alpha versioning

Hoplite follows the separate distribution, portable-format, and native-ABI
version spaces defined in [`docs/versioning.md`](versioning.md). Evolving owned
portable contracts remain in the `0-alpha` epoch until explicitly frozen.
'''
              direction_path.write_text(direction)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          guard_marker = '''      - name: Verify the reviewed Hara revision
        working-directory: hoplite
        run: test "$(tr -d '[:space:]' < packaging/hara-revision)" = "$HARA_REF"
'''
          guard_step = guard_marker + '''      - name: Verify the alpha version policy
        working-directory: hoplite
        run: bash packaging/scripts/verify-alpha-versioning.sh
'''
          if guard_marker not in ci:
              raise SystemExit('CI alpha guard insertion point was not found')
          ci_path.write_text(ci.replace(guard_marker, guard_step, 1))

          verify = Path('packaging/scripts/verify-alpha-versioning.sh')
          verify.write_text('''#!/usr/bin/env bash
set -euo pipefail

ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"
cd "$ROOT"

forbidden='HAB1|HBB2|hoplite\\.application-bundle/1|hoplite\\.public-surfaces/1|Hoplite 0\\.2|0\\.2 release line'
if matches="$(git grep -n -E "$forbidden" -- . ':!packaging/scripts/verify-alpha-versioning.sh' || true)" \
   && [[ -n "$matches" ]]; then
  printf '%s\n' "$matches" >&2
  echo 'stale stable-looking version identifiers remain' >&2
  exit 1
fi

grep -F 'pub const FORMAT: &str = "hoplite.application-bundle/0-alpha";' \
  core/application-bundle/src/lib.rs >/dev/null
grep -F 'pub const MAGIC: &[u8; 4] = b"HAB0";' \
  core/application-bundle/src/lib.rs >/dev/null
grep -F 'pub const HARA_BUNDLE_MAGIC: &[u8; 4] = b"HBX0";' \
  core/application-bundle/src/lib.rs >/dev/null
grep -F 'HARA_REF: 6dd73bbb9ba546b90dee0a075323998dd3abac85' \
  .github/workflows/ci.yml >/dev/null
test "$(tr -d '[:space:]' < packaging/hara-revision)" = \
  '6dd73bbb9ba546b90dee0a075323998dd3abac85'
grep -F 'docs/versioning.md' README.md >/dev/null
grep -F 'hoplite.application-bundle/0-alpha' docs/application-bundle.md >/dev/null

echo 'alpha version policy verified'
''')
          verify.chmod(0o755)

          migration.unlink()
          print('updated files:')
          for path in sorted(set(changed + [
              'core/application-bundle/src/lib.rs',
              'core/nginx/hoplite_runtime.h',
              'docs/application-bundle.md',
              'docs/versioning.md',
              'README.md',
              'docs/project-direction.md',
              '.github/workflows/ci.yml',
              'packaging/scripts/verify-alpha-versioning.sh',
              'packaging/hara-revision',
          ])):
              print(path)
          PY
      - name: Verify the migration policy
        working-directory: hoplite
        run: bash packaging/scripts/verify-alpha-versioning.sh
      - name: Format and test the complete Hoplite workspace
        run: |
          cargo fmt --manifest-path hoplite/core/Cargo.toml -- --check
          cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Commit the aligned alpha epoch
        working-directory: hoplite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align Hoplite with the alpha contract epoch'
          git push origin HEAD:agent/align-alpha-versioning
