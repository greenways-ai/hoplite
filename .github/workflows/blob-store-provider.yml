name: hoplite.blob provider conformance

on:
  pull_request:
    paths:
      - ".github/workflows/blob-store-provider.yml"
      - "core/abi/blob-store/**"
      - "core/abi/blob-store-provider/**"
      - "core/abi/provider-hta/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/blob-store-provider.yml"
      - "core/abi/blob-store/**"
      - "core/abi/blob-store-provider/**"
      - "core/abi/provider-hta/**"

permissions:
  contents: read

concurrency:
  group: blob-store-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --manifest-path core/abi/blob-store-provider/Cargo.toml --all -- --check
      - name: Reject warnings
        run: cargo clippy --manifest-path core/abi/blob-store-provider/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run canonical protocol conformance
        run: cargo test --manifest-path core/abi/blob-store-provider/Cargo.toml --all-targets --locked
