name: Fix native response lifetime

on:
  push:
    branches: [agent/nginx-request-body-v3]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/nginx-request-body-v3
          fetch-depth: 0
      - name: Retain borrowed native response slices until request cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/nginx/ngx_http_hoplite_module.c")
          source = path.read_text()
          eager_close = """            if (ctx->response != 0) {
                (void) hoplite_response_close_v2(ngx_http_hoplite_runtime,
                                                 ctx->response);
                ctx->response = 0;
            }
"""
          count = source.count(eager_close)
          if count != 2:
              raise SystemExit(f"expected two eager response closes, found {count}")
          source = source.replace(eager_close, "")
          path.write_text(source)
          PY
      - name: Remove this one-shot workflow
        run: rm .github/workflows/fix-native-response-lifetime.yml
      - name: Commit the reviewed ownership fix
        run: |
          git config user.name "greenways-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/nginx/ngx_http_hoplite_module.c .github/workflows/fix-native-response-lifetime.yml
          git diff --cached --check
          git commit -m "Retain native response slices through Nginx request cleanup"
          git push origin HEAD:agent/nginx-request-body-v3
