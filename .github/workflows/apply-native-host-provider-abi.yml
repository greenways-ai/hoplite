              """static int32_t
ngx_http_hoplite_complete(void *data,
                          const uint8_t *hta,
                          size_t hta_len,
                          ngx_flag_t failure)
{
    ngx_http_hoplite_completion_t *completion = data;
    ngx_http_hoplite_ctx_t *ctx;
    ngx_flag_t retained;
    int rc;

    if (completion == NULL || completion->ctx == NULL
        || completion->completed || (hta_len != 0 && hta == NULL)
        || ngx_http_hoplite_runtime == NULL)
    {
        return HOPLITE_HOST_PROVIDER_ERROR;
    }
    ctx = completion->ctx;
    if (ctx->done || ctx->completion != completion) {
        return HOPLITE_HOST_PROVIDER_ERROR;
    }

    retained = completion->retained;
    completion->completed = 1;
    ctx->completion = NULL;
    ctx->provider = NULL;
    rc = failure
        ? hoplite_call_reject(ngx_http_hoplite_runtime,
                              completion->call, hta, hta_len)
        : hoplite_call_resolve(ngx_http_hoplite_runtime,
                               completion->call, hta, hta_len);
    if (rc != 0) {
        return HOPLITE_HOST_PROVIDER_ERROR;
    }
    if (retained && ngx_http_hoplite_drain(completion->log) != NGX_OK) {
        ngx_str_t body = ngx_string("Hoplite runtime delivery failed\\n");
        ngx_http_hoplite_send(ctx, NGX_HTTP_INTERNAL_SERVER_ERROR,
                              &body, NULL);
        return HOPLITE_HOST_PROVIDER_ERROR;
    }
    return HOPLITE_HOST_PROVIDER_OK;
}

static int32_t
ngx_http_hoplite_complete_success(void *data,
                                  const uint8_t *hta,
                                  size_t hta_len)
{
