name: Apply native host provider ABI

on:
  push:
    branches:
      - agent/export-native-host-provider-abi

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/export-native-host-provider-abi
      - name: Check the transformation script
        run: python3 -m py_compile core/nginx/tools/apply_host_provider_abi.py
      - name: Materialize the exported provider dispatch
        run: |
          python3 core/nginx/tools/apply_host_provider_abi.py
          git diff --check
      - name: Test the portable provider ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/nginx \
            core/nginx/hoplite_host_provider.c \
            core/nginx/tests/host_provider_api.c \
            -o /tmp/hoplite-host-provider-api-test
          /tmp/hoplite-host-provider-api-test
      - name: Commit the generated Nginx integration
        run: |
          git config user.name "greenways-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/nginx/config \
            core/nginx/hoplite_hta.c \
            core/nginx/ngx_http_hoplite_module.c
          git diff --cached --check
          git commit -m "Dispatch through the exported native provider ABI"
          git push origin HEAD:agent/export-native-host-provider-abi
