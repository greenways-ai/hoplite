}

static int32_t
ngx_http_hoplite_complete_failure(void *data,
                                  const uint8_t *hta,
                                  size_t hta_len)
{
    return ngx_http_hoplite_complete(data, hta, hta_len, 1);
}

static int32_t
ngx_http_hoplite_provider_reject(const hoplite_host_call_v1_t *call,
                                 const char *message)
{
    ngx_http_hoplite_ctx_t *ctx = call == NULL
        ? NULL : call->request_context;
    ngx_str_t text, encoded;

    if (ctx == NULL || ctx->request == NULL || message == NULL) {
        return HOPLITE_HOST_PROVIDER_ERROR;
    }
    text.data = (u_char *) message;
    text.len = ngx_strlen(message);
    if (hoplite_hta_encode_string(ctx->request->pool, &text, &encoded)
        != NGX_OK)
    {
        return HOPLITE_HOST_PROVIDER_ERROR;
    }
    return call->completer.fail(call->completer.context,
                                encoded.data, encoded.len);
}
