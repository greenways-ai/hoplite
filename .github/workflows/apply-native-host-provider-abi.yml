name: Apply native host provider ABI

on:
  push:
    branches:
      - agent/export-native-host-provider-abi

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/export-native-host-provider-abi
      - name: Materialize the provider dispatch boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new)

          hta = Path("core/nginx/hoplite_hta.c")
          source = hta.read_text()
          source = replace_once(
              source,
              """    uint64_t raw;
    ngx_uint_t tag;

    if (hoplite_take(reader, 1, &tag_data) != NGX_OK) {
