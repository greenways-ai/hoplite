name: Apply HAB1 staging by structural markers

on:
  push:
    branches:
      - agent/hoplite-application-bundle-v1

permissions:
  contents: write

concurrency:
  group: hoplite-application-bundle-v1-structural
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/hoplite-application-bundle-v1
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply HAB1 and isolated staging
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/agent-hab1.yml").read_text()
          payload = workflow.split("          python3 - <<'PY'\n", 1)[1].split(
              "          PY\n", 1
          )[0]
          exec(compile(textwrap.dedent(payload), "agent-hab1", "exec"), {})

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_at = text.find(start)
              end_at = text.find(end, start_at + len(start))
              if start_at < 0 or end_at < 0:
                  raise SystemExit(f"cannot find structural markers in {path}")
              file.write_text(text[:start_at] + replacement + text[end_at:])

          replace_between(
              "core/runtime/src/lib.rs",
              "    fn bootstrap_application(&mut self, bundle: &[u8], manifest: &[u8]) -> Result<(), String> {\n",
              "    fn work_call(&mut self, handler: HandlerId, binding: Value) -> Result<WorkId, ()> {\n",
              '''    fn pristine_for_application_bootstrap(&self) -> bool {
              self.next_handler == 1
                  && self.next_work == 1
                  && self.next_call == 1
                  && self.next_request == 1
                  && self.next_response == 1
                  && self.events.borrow().is_empty()
                  && self.ready.borrow().is_empty()
                  && self.call_owners.is_empty()
                  && self.handlers.is_empty()
                  && self.apps.is_empty()
                  && self.works.is_empty()
                  && self.requests.borrow().is_empty()
                  && self.raw_builders.borrow().is_empty()
                  && self.responses.is_empty()
                  && self.host_pending.borrow().is_empty()
                  && *self.host_next.borrow() == 1
          }

          fn validate_application_in_isolated_thread(
              bytecode: Vec<u8>,
              manifest: Vec<u8>,
          ) -> Result<(), String> {
              let validation = std::thread::Builder::new()
                  .name("hoplite-application-preflight".into())
                  .spawn(move || {
                      let manifest = hta::decode(&manifest).map_err(|error| {
                          format!("hoplite/application-manifest-invalid: {error}")
                      })?;
                      let mut runtime = HopliteRuntime::new();
                      runtime.bootstrap_bytecode(&bytecode)?;
                      runtime.apps_prepare(manifest)
                  })
                  .map_err(|error| {
                      format!("hoplite/application-preflight-unavailable: {error}")
                  })?;
              validation
                  .join()
                  .map_err(|_| "hoplite/application-preflight-panicked".to_string())?
          }

          fn bootstrap_application(&mut self, bundle: &[u8], manifest: &[u8]) -> Result<(), String> {
              if !self.pristine_for_application_bootstrap() {
                  return Err(
                      "hoplite/application-bootstrap-stateful-runtime: use a fresh runtime"
                          .into(),
                  );
              }

              let decoded = application_bundle::decode(bundle, manifest)
                  .map_err(|error| error.to_string())?;
              Self::validate_application_in_isolated_thread(
                  decoded.bytecode().to_vec(),
                  manifest.to_vec(),
              )?;

              let manifest = hta::decode(manifest)
                  .map_err(|error| format!("hoplite/application-manifest-invalid: {error}"))?;
              let mut staged = HopliteRuntime::new();
              staged.bootstrap_bytecode(decoded.bytecode()).map_err(|error| {
                  format!("hoplite/application-bootstrap-invariant: {error}")
              })?;
              staged.apps_prepare(manifest).map_err(|error| {
                  format!("hoplite/application-bootstrap-invariant: {error}")
              })?;
              *self = staged;
              Ok(())
          }

          ''',
          )

          replace_between(
              "docs/application-bundle.md",
              "The worker validates the complete HAB1 envelope",
              "## Compatibility",
              '''The worker validates the complete HAB1 envelope, then performs a full
          bytecode-and-route preflight on an isolated thread. Hara's thread-local protocol
          and multimethod state cannot leak from a rejected preflight. Only after that
          succeeds does Hoplite construct a fresh staged runtime, load the same HBB2 bytes,
          prepare the same route handlers, and atomically replace the pristine worker
          runtime.

          A bytecode failure, unknown handler, malformed manifest, checksum mismatch, or
          manifest substitution leaves the serving runtime with neither partially loaded
          namespaces nor partially prepared routes. Combined application bootstrap is
          therefore accepted only on a fresh runtime.

          ''',
          )
          PY
      - name: Format and validate the complete core workspace
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          cargo test --manifest-path core/Cargo.toml --workspace
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null

          cc -std=c11 -Wall -Wextra -Werror \
            -I core/nginx \
            core/nginx/hoplite_response_source.c \
            core/nginx/tests/response_source.c \
            -o /tmp/hoplite-response-source
          /tmp/hoplite-response-source
      - name: Commit the validated implementation
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core docs
          git diff --cached --quiet && {
            echo "HAB1 implementation produced no changes" >&2
            exit 1
          }
          git commit -m "Add the HAB1 application bundle contract"
          git push origin HEAD:agent/hoplite-application-bundle-v1
