name: Materialize request-body source correction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'packaging/scripts/fix-nginx-request-body-v3'
      - '.github/workflows/materialize-request-body-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'greenways-ai/hoplite' && github.head_ref == 'agent/nginx-request-body-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply and publish the ordinary source correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 packaging/scripts/fix-nginx-request-body-v3
          if git diff --quiet -- core/nginx/ngx_http_hoplite_module.c; then
            echo 'Body-free V2 dispatch is already materialized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/nginx/ngx_http_hoplite_module.c
          git commit -m 'Keep body-free requests on Hoplite ABI V2'
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin HEAD:"$HEAD_BRANCH"
