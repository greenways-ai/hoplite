name: hara.blob foundation conformance

on:
  pull_request:
    paths:
      - ".github/workflows/blob-store.yml"
      - "core/abi/blob-store/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/blob-store.yml"
      - "core/abi/blob-store/**"

permissions:
  contents: read

concurrency:
  group: blob-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --manifest-path core/abi/blob-store/Cargo.toml --all -- --check
      - name: Reject warnings
        run: cargo clippy --manifest-path core/abi/blob-store/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run staged-blob conformance
        run: cargo test --manifest-path core/abi/blob-store/Cargo.toml --all-targets --locked
