# Source-only helper; removed before review completion.
name: Generate value provider FFI lock

env:
  HARA_REF: d2a2e376917131cfb8954ac156db3a5e174f2c1a

on:
  push:
    branches:
      - agent/value-object-backend-lock-91
    paths:
      - .github/workflows/agent-generate-value-ffi-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/value-object-backend-lock-91
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
      - name: Generate and verify the standalone lock
        working-directory: hoplite
        run: |
          cargo generate-lockfile \
            --manifest-path core/abi/value-provider-filesystem-ffi/Cargo.toml
          cargo test \
            --manifest-path core/abi/value-provider-filesystem-ffi/Cargo.toml \
            --all-targets --locked
      - name: Commit only the generated lock
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/value-provider-filesystem-ffi/Cargo.lock
          git commit -m "Lock the standalone value provider FFI"
          git push origin HEAD:agent/value-object-backend-lock-91
