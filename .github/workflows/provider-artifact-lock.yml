name: Provider artifact lock

env:
  HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984

on:
  push:
    paths:
      - core/src/provider_lock.rs
      - core/src/bin/hoplite-provider-lock.rs
      - packaging/providers/**/provider-lock.json
      - packaging/providers/**/provider-manifest.published.json
      - packaging/scripts/verify-blob-provider-artifact.sh
      - packaging/docker/Dockerfile.blob-provider
      - .github/workflows/provider-artifact-lock.yml
  pull_request:
    paths:
      - core/src/provider_lock.rs
      - core/src/bin/hoplite-provider-lock.rs
      - packaging/providers/**/provider-lock.json
      - packaging/providers/**/provider-manifest.published.json
      - packaging/scripts/verify-blob-provider-artifact.sh
      - packaging/docker/Dockerfile.blob-provider
      - .github/workflows/provider-artifact-lock.yml

permissions:
  contents: read

concurrency:
  group: provider-artifact-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test the closed lock and published-manifest boundary
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked \
            --bin hoplite-provider-lock
      - name: Validate the exact published lock
        working-directory: hoplite
        run: |
          verifier=(
            cargo run --quiet --manifest-path core/Cargo.toml --locked
            --bin hoplite-provider-lock --
          )
          lock=packaging/providers/blob/provider-lock.json
          manifest=packaging/providers/blob/provider-manifest.published.json
          compatibility=(
            --provider hoplite.blob
            --version 0.1.1
            --repository greenways-ai/hoplite
            --tag hoplite-blob-provider-v0.1.1
            --asset hoplite-blob-provider-0.1.1.tar.gz
            --media-type application/gzip
            --request hoplite.blob-request/1
            --result hoplite.blob-result/1
            --abi hoplite.blob-provider-ffi
            --abi-version 1
            --driver filesystem
            --driver-version 1
          )

          "${verifier[@]}" "$lock" "$manifest" "${compatibility[@]}"
          "${verifier[@]}" "$lock" "$manifest" \
            "${compatibility[@]}" --shell > /tmp/provider.env
          grep -Fx 'HOPLITE_PROVIDER_NAME=hoplite.blob' /tmp/provider.env
          grep -Fx 'HOPLITE_PROVIDER_VERSION=0.1.1' /tmp/provider.env
          grep -Fx 'HOPLITE_PROVIDER_SOURCE_REVISION=8d97a452032d47740314899bb175096d8fc83f8e' \
            /tmp/provider.env
          grep -Fx 'HOPLITE_PROVIDER_SHA256=03c5dea9854cf23b60c7d2638c17712accc7e77eb53db4d15ed0b45327ee8210' \
            /tmp/provider.env

          cp "$lock" /tmp/mismatched-lock.json
          sed -i 's/03c5dea9/13c5dea9/' /tmp/mismatched-lock.json
          if "${verifier[@]}" /tmp/mismatched-lock.json "$manifest" \
            "${compatibility[@]}"; then
            echo "mismatched lock digest unexpectedly passed" >&2
            exit 1
          fi

          cp "$manifest" /tmp/mismatched-manifest.json
          sed -i 's/03c5dea9/13c5dea9/' /tmp/mismatched-manifest.json
          if "${verifier[@]}" "$lock" /tmp/mismatched-manifest.json \
            "${compatibility[@]}"; then
            echo "mismatched published manifest unexpectedly passed" >&2
            exit 1
          fi
      - name: Download and verify the locked release bytes
        working-directory: hoplite
        run: |
          . /tmp/provider.env
          archive="/tmp/${HOPLITE_PROVIDER_ASSET}"
          curl --fail --location --retry 3 \
            "https://github.com/${HOPLITE_PROVIDER_REPOSITORY}/releases/download/${HOPLITE_PROVIDER_TAG}/${HOPLITE_PROVIDER_ASSET}" \
            --output "$archive"
          echo "${HOPLITE_PROVIDER_SHA256}  ${archive}" | sha256sum --check
          bash packaging/scripts/verify-blob-provider-artifact.sh \
            "$archive" "sha256:${HOPLITE_PROVIDER_SHA256}" /tmp/provider-root
          package="/tmp/provider-root/hoplite-blob-provider-${HOPLITE_PROVIDER_VERSION}"
          test "$(cat "${package}/SOURCE_REVISION")" = "$HOPLITE_PROVIDER_SOURCE_REVISION"
          test "$(cat "${package}/PACKAGE_VERSION")" = "$HOPLITE_PROVIDER_VERSION"
      - name: Keep locks outside request and generic provider selection
        working-directory: hoplite
        run: |
          ! grep -R -E 'provider-lock|provider-manifest\.published' \
            core/lib core/nginx core/src/app.rs core/src/host.rs
