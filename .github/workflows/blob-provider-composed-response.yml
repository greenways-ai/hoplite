name: Composed hoplite.blob response source

env:
  HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984

on:
  push:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/src/provider_lock.rs
      - core/src/bin/hoplite-provider-lock.rs
      - core/nginx/**
      - core/examples/**
      - packaging/docker/Dockerfile.blob-provider
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/providers/blob/nginx/**
      - packaging/scripts/verify-blob-provider-artifact.sh
      - packaging/scripts/smoke-response-source.sh
      - .github/workflows/blob-provider-composed-response.yml
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/src/provider_lock.rs
      - core/src/bin/hoplite-provider-lock.rs
      - core/nginx/**
      - core/examples/**
      - packaging/docker/Dockerfile.blob-provider
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/providers/blob/nginx/**
      - packaging/scripts/verify-blob-provider-artifact.sh
      - packaging/scripts/smoke-response-source.sh
      - .github/workflows/blob-provider-composed-response.yml

permissions:
  contents: read

concurrency:
  group: composed-hoplite-blob-response-${{ github.ref }}
  cancel-in-progress: true

jobs:
  response-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - name: Verify generic and distribution ownership
        run: |
          ! grep -E 'HOPLITE_(BLOB|STORE|VALUE)' \
            hoplite/packaging/docker/Dockerfile
          ! grep -E 'hoplite_(blob|value|value_store)_host_provider' \
            hoplite/core/nginx/config
          grep -F 'provider-lock.json' \
            hoplite/packaging/docker/Dockerfile.blob-provider
          grep -F '/src/provider/abi/blob-store-provider-ffi' \
            hoplite/packaging/docker/Dockerfile.blob-provider
          ! grep -F 'HOPLITE_BLOB_PROVIDER_FFI_DIR=/src/hoplite/core/abi/blob-store-provider-ffi' \
            hoplite/packaging/docker/Dockerfile.blob-provider
      - name: Build the distribution-owned blob composition
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile.blob-provider \
            -t hoplite-blob-response-ci \
            .
          docker run --rm hoplite-blob-response-ci version
      - name: Run the existing complete response-source fixture unchanged
        run: |
          bash hoplite/packaging/scripts/smoke-response-source.sh \
            hoplite-blob-response-ci
