name: Materialize provider HTA fixes

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-provider-hta-fixes.yml"
      - "core/abi/provider-hta/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-hta-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Apply exact source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("core/abi/provider-hta/src/lib.rs")
          source = path.read_text()
          anchor = (
              "    pub fn len(self) -> Result<usize, Error> {\n"
              "        match &self.data().payload {\n"
              "            Payload::Sequence(range) | Payload::Map(range) => Ok(range.len()),\n"
              "            _ => Err(self.wrong(\"collection\")),\n"
              "        }\n"
              "    }\n"
          )
          addition = (
              "\n"
              "    pub fn is_empty(self) -> Result<bool, Error> {\n"
              "        Ok(self.len()? == 0)\n"
              "    }\n"
          )
          if "pub fn is_empty(self)" not in source:
              if anchor not in source:
                  raise SystemExit("len anchor missing")
              source = source.replace(anchor, anchor + addition, 1)
          old = "        let document = Document::parse(&frame(&vector(&[request]))).unwrap();\n"
          new = (
              "        let arguments = frame(&vector(&[request]));\n"
              "        let document = Document::parse(&arguments).unwrap();\n"
          )
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --manifest-path core/abi/provider-hta/Cargo.toml --all
          cargo clippy --manifest-path core/abi/provider-hta/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path core/abi/provider-hta/Cargo.toml --all-targets --locked
      - name: Commit materialized source
        run: |
          if git diff --quiet -- core/abi/provider-hta; then
            echo "Provider HTA fixes are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/provider-hta
          git commit -m "Fix provider HTA conformance"
          git push
