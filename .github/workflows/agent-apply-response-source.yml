name: Apply response-source integration

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/nginx-response-source-streaming'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hoplite head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: hoplite
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out pinned Hara
        uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: b97f85180c57c320c1b8f011a1a91ddba4be2c46
          path: hara

      - name: Apply the Nginx integration
        working-directory: hoplite
        run: python3 .github/agent/apply_response_source.py

      - name: Validate the bounded pump and patch
        working-directory: hoplite
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/nginx \
            core/nginx/hoplite_response_source.c \
            core/nginx/tests/response_source.c \
            -o /tmp/hoplite-response-source-test
          /tmp/hoplite-response-source-test
          bash -n packaging/scripts/smoke-response-source.sh
          git diff --check
          grep -F 'ngx_http_hoplite_response_source_drive' \
            core/nginx/ngx_http_hoplite_module.c
          grep -F 'ngx_http_output_filter(request, NULL)' \
            core/nginx/ngx_http_hoplite_module.c

      - name: Build the production Nginx image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-response-source-ci .

      - name: Smoke request bodies and host providers
        run: |
          bash hoplite/packaging/scripts/smoke-request-body-v3.sh hoplite-response-source-ci
          bash hoplite/packaging/scripts/smoke-host-providers.sh hoplite-response-source-ci

      - name: Smoke bounded response-source streaming
        run: bash hoplite/packaging/scripts/smoke-response-source.sh hoplite-response-source-ci

      - name: Commit the validated integration
        working-directory: hoplite
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/nginx/ngx_http_hoplite_module.c
          git commit -m 'Stream bounded response sources through Nginx'
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
