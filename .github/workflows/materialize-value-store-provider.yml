name: Materialize hara.store provider adapter

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-value-store-provider.yml"
      - "core/abi/value-store-provider/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: value-store-provider-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Apply exact adapter corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("core/abi/value-store-provider/src/lib.rs")
          source = path.read_text()
          source = source.replace(
              "request_value(request)?",
              "self.value_from_request(request)?",
          )
          start = source.find("\nfn request_value<S, V>(")
          end = source.find("\nfn exact_fields(", start)
          if start >= 0 and end > start:
              source = source[:start] + "\n" + source[end:]
          source = source.replace(
              "const VECTOR: u8 = 9;\n",
              "#[cfg(test)]\nconst VECTOR: u8 = 9;\n",
              1,
          )
          replacements = {
              "        let result = Document::parse(&initialized).unwrap().root();\n": (
                  "        let initialized_document = Document::parse(&initialized).unwrap();\n"
                  "        let result = initialized_document.root();\n"
              ),
              "        let applied = Document::parse(&applied).unwrap().root();\n": (
                  "        let applied_document = Document::parse(&applied).unwrap();\n"
                  "        let applied = applied_document.root();\n"
              ),
              "        let receipt_lookup = Document::parse(&receipt_lookup).unwrap().root();\n": (
                  "        let receipt_document = Document::parse(&receipt_lookup).unwrap();\n"
                  "        let receipt_lookup = receipt_document.root();\n"
              ),
          }
          for old, new in replacements.items():
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --manifest-path core/abi/value-store-provider/Cargo.toml --all
          cargo clippy --manifest-path core/abi/value-store-provider/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path core/abi/value-store-provider/Cargo.toml --all-targets --locked
      - name: Commit materialized source
        run: |
          if git diff --quiet -- core/abi/value-store-provider; then
            echo "hara.store adapter source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/value-store-provider
          git commit -m "Materialize the hara.store protocol adapter"
          git push
