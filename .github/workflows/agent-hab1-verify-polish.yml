name: Polish the HAB1 verification public surface

on:
  push:
    branches:
      - agent/hoplite-verify-bundle-v1

permissions:
  contents: write

concurrency:
  group: hoplite-verify-bundle-v1-polish
  cancel-in-progress: true

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/hoplite-verify-bundle-v1
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Correct the public header and documentation
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "core/nginx/hoplite_runtime.h",
              "                                     const uint8_t *manifest,\n                           size_t manifest_len);",
              "                                     const uint8_t *manifest,\n                                     size_t manifest_len);",
          )
          replace_exact(
              "docs/application-bundle.md",
              "The lower-level `hoplite_bootstrap_bytecode` and `hoplite_apps_prepare` symbols\nremain available for embedding compatibility, but the generated Nginx\nproduction configuration uses `hoplite_bootstrap_application_v1`.\n\n\n## Source-free verification",
              "The lower-level `hoplite_bootstrap_bytecode`, `hoplite_apps_prepare`, and\nbyte-oriented `hoplite_bootstrap_application_v1` symbols remain available for\nembedding compatibility. Generated Nginx production configuration uses the\nbounded file-based `hoplite_bootstrap_application_files_v1` entry point.\n\n## Source-free verification",
          )
          PY
          git diff --check
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null
      - name: Commit the polished public surface
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/nginx/hoplite_runtime.h docs/application-bundle.md
          git commit -m "Polish the HAB1 verification surface"
          git push origin HEAD:agent/hoplite-verify-bundle-v1
