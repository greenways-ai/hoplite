name: Materialize blob-store formatting

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-blob-store-format.yml"
      - "core/abi/blob-store/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blob-store-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt
      - name: Format and test blob-store source
        run: |
          cargo fmt --manifest-path core/abi/blob-store/Cargo.toml --all
          cargo test --manifest-path core/abi/blob-store/Cargo.toml --all-targets --locked
      - name: Commit materialized source
        run: |
          if git diff --quiet -- core/abi/blob-store; then
            echo "Blob-store source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/blob-store
          git commit -m "Format the generic blob-store foundation"
          git push
