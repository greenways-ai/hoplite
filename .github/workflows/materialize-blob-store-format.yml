name: Materialize blob-store source

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-blob-store-format.yml"
      - "core/abi/blob-store/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blob-store-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Apply exact blob-store corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("core/abi/blob-store/src/lib.rs")
          source = path.read_text()
          old_object = (
              "        if let Some(object) = state.objects.get(&request.expected_digest) {\n"
              "            if object.descriptor.size == request.expected_size {\n"
              "                state.staging.remove(&request.staging_key);\n"
              "                return Ok(object.descriptor.clone());\n"
              "            }\n"
              "            return Err(Error::ObjectConflict {\n"
              "                digest: request.expected_digest,\n"
              "            });\n"
              "        }\n"
          )
          new_object = (
              "        if let Some(descriptor) = state\n"
              "            .objects\n"
              "            .get(&request.expected_digest)\n"
              "            .map(|object| object.descriptor.clone())\n"
              "        {\n"
              "            if descriptor.size == request.expected_size {\n"
              "                state.staging.remove(&request.staging_key);\n"
              "                return Ok(descriptor);\n"
              "            }\n"
              "            return Err(Error::ObjectConflict {\n"
              "                digest: request.expected_digest,\n"
              "            });\n"
              "        }\n"
          )
          source = source.replace(old_object, new_object, 1)
          source = source.replace(
              "        let store = store();\n        let wrong = digest(b\"wxyz\");\n",
              "        let store = self::store();\n        let wrong = digest(b\"wxyz\");\n",
              1,
          )
          old_media = (
              "        let value = value.into();\n"
              "        validate_logical_text(\n"
              "            &value,\n"
              "            limits.validate()?.max_media_type_bytes,\n"
              "            Error::InvalidMediaType,\n"
              "        )?;\n"
              "        if !value.contains('/') || value.chars().any(char::is_whitespace) {\n"
              "            return Err(Error::InvalidMediaType);\n"
              "        }\n"
              "        Ok(Self(value))\n"
          )
          new_media = (
              "        let value = value.into();\n"
              "        let limit = limits.validate()?.max_media_type_bytes;\n"
              "        let Some((type_name, subtype)) = value.split_once('/') else {\n"
              "            return Err(Error::InvalidMediaType);\n"
              "        };\n"
              "        let token = |character: char| {\n"
              "            character.is_ascii_alphanumeric()\n"
              "                || matches!(\n"
              "                    character,\n"
              "                    '!' | '#' | '$' | '&' | '\\'' | '*' | '+' | '-' | '.' | '^' | '_' | '`' | '|' | '~'\n"
              "                )\n"
              "        };\n"
              "        if value.len() > limit\n"
              "            || type_name.is_empty()\n"
              "            || subtype.is_empty()\n"
              "            || subtype.contains('/')\n"
              "            || !type_name.chars().all(token)\n"
              "            || !subtype.chars().all(token)\n"
              "        {\n"
              "            return Err(Error::InvalidMediaType);\n"
              "        }\n"
              "        Ok(Self(value))\n"
          )
          source = source.replace(old_media, new_media, 1)
          path.write_text(source)
          PY
          cargo fmt --manifest-path core/abi/blob-store/Cargo.toml --all
          cargo clippy --manifest-path core/abi/blob-store/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path core/abi/blob-store/Cargo.toml --all-targets --locked
      - name: Commit materialized source
        run: |
          if git diff --quiet -- core/abi/blob-store; then
            echo "Blob-store source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/blob-store
          git commit -m "Materialize the generic blob-store foundation"
          git push
