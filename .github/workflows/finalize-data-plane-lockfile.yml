name: Finalize data-plane lockfile

on:
  push:
    branches:
      - agent/data-plane-resource-registry
    paths:
      - '.github/workflows/finalize-data-plane-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: finalize-data-plane-lockfile
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/data-plane-resource-registry
          path: hoplite
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d0794a7f2e20993220778bcbff97c16735fbb8b4
          path: hara
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and verify the complete workspace lockfile
        working-directory: hoplite
        run: |
          cargo generate-lockfile --manifest-path core/Cargo.toml
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text()
          old = 'cargo test --manifest-path hoplite/core/Cargo.toml --workspace'
          new = 'cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked'
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit('expected one CI workspace-test command')
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
      - name: Commit the generated lockfile and remove this one-shot workflow
        working-directory: hoplite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-data-plane-lockfile.yml
          git add .github/workflows/ci.yml core/Cargo.lock
          git commit -m "Regenerate the data-plane workspace lockfile"
          git push origin HEAD:agent/data-plane-resource-registry
