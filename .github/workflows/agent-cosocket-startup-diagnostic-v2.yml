name: Apply cosocket startup diagnostics

on:
  pull_request:

permissions:
  contents: write

env:
  HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cosocket-bytecode-startup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cosocket-bytecode-startup
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive

      - name: Run the reviewed patcher
        working-directory: hoplite
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            workflow = YAML.load_file(ARGV.fetch(0))
            step = workflow.fetch("jobs").fetch("patch").fetch("steps").find do |entry|
              entry["name"] == "Add bounded startup failure detail"
            end
            abort "startup diagnostic patcher step not found" unless step
            print step.fetch("run")
          ' .github/workflows/agent-cosocket-startup-diagnostic.yml > /tmp/patch-startup.sh
          test -s /tmp/patch-startup.sh
          bash /tmp/patch-startup.sh

      - name: Validate the runtime change
        working-directory: hoplite
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo test --manifest-path core/runtime/Cargo.toml startup_diagnostic_tests -- --nocapture

      - name: Commit the runtime change
        working-directory: hoplite
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/runtime/src/lib.rs
          git commit -m "feat: report bounded startup failure details"
          git push origin "HEAD:${BRANCH}"
