name: Finalize data-plane FFI tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'packaging/scripts/fix-data-plane-ffi-unsafe-tests'
      - '.github/workflows/finalize-data-plane-ffi-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-data-plane-ffi-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'greenways-ai/hoplite' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'agent/data-plane-ffi-runtime')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          path: hoplite
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d0794a7f2e20993220778bcbff97c16735fbb8b4
          path: hara
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply the explicit-unsafe test fix
        working-directory: hoplite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile packaging/scripts/fix-data-plane-ffi-unsafe-tests
          python3 packaging/scripts/fix-data-plane-ffi-unsafe-tests
          cargo fmt --manifest-path core/Cargo.toml --all

      - name: Test the complete Rust workspace
        working-directory: hoplite
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: Compile the public native data-plane header
        working-directory: hoplite
        run: |
          cat > /tmp/hoplite-data-plane.c <<'EOF'
          #include "hoplite_data_plane.h"

          int main(void) {
            hoplite_request_body_v1 request = {0};
            hoplite_response_body_v1 response = {0};
            return request.has_declared_length == 0u && response.length == 0u ? 0 : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/abi/data-plane-ffi/include \
            -fsyntax-only /tmp/hoplite-data-plane.c

      - name: Commit the reviewed source fix
        working-directory: hoplite
        run: |
          if git diff --quiet -- core/abi/data-plane-ffi/src/implementation.rs; then
            echo 'FFI test callbacks are already finalized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/abi/data-plane-ffi/src/implementation.rs
          git commit -m "Make native callback tests explicit under Rust 2024"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
