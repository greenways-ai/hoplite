name: Format blob driver conformance 92

on:
  push:
    branches:
      - agent/blob-driver-conformance-41

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact rustfmt output
        run: |
          cargo fmt --manifest-path core/abi/blob-store-conformance/Cargo.toml
          git diff --check
          git add core/abi/blob-store-conformance/src/lib.rs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Format shared blob driver conformance"
          git push origin HEAD:${GITHUB_REF_NAME}
