name: Nginx programmability

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoplite-nginx-programmability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tcp-cosocket:
    name: TCP cosocket
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara source revision
        id: hara_source
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the reviewed Hara Native revision
        id: hara_native
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-native-revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara_source.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-native
          ref: ${{ steps.hara_native.outputs.revision }}
          path: hara-native
      - name: Verify the Hara compatibility checkout
        working-directory: hoplite
        run: bash packaging/scripts/check-hara-compatibility.sh --verify-only
      - name: Validate the fixture harness
        run: bash -n hoplite/packaging/scripts/smoke-cosocket-tcp.sh
      - name: Build the source-free TCP cosocket application
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/cosocket-tcp \
            --build-arg HOPLITE_DEFAULT_WORKERS=1 \
            -t hoplite-cosocket-tcp \
            .
      - name: Verify the fixture worker override
        run: |
          workers="$(docker image inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            hoplite-cosocket-tcp \
            | sed -n 's/^HOPLITE_WORKERS=//p')"
          test "$workers" = 1
      - name: Verify the production artifact contains no Hara source
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-cosocket-tcp
      - name: Prove connect, send, receive, receiveany, close, and cleanup
        run: bash hoplite/packaging/scripts/smoke-cosocket-tcp.sh hoplite-cosocket-tcp

  directional-cosocket:
    name: TCP directional cosocket
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara source revision
        id: hara_source
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the reviewed Hara Native revision
        id: hara_native
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-native-revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara_source.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-native
          ref: ${{ steps.hara_native.outputs.revision }}
          path: hara-native
      - name: Verify the Hara compatibility checkout
        working-directory: hoplite
        run: bash packaging/scripts/check-hara-compatibility.sh --verify-only
      - name: Validate the directional fixture harness
        run: bash -n hoplite/packaging/scripts/smoke-cosocket-directional.sh
      - name: Build the source-free directional cosocket application
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/cosocket-directional \
            --build-arg HOPLITE_DEFAULT_WORKERS=1 \
            -t hoplite-cosocket-directional \
            .
      - name: Verify the directional production artifact contains no Hara source
        run: |
          bash hoplite/packaging/scripts/assert-production-image.sh \
            hoplite-cosocket-directional
      - name: Prove source-free directional lifecycle cleanup
        run: |
          bash hoplite/packaging/scripts/smoke-cosocket-directional.sh \
            hoplite-cosocket-directional
