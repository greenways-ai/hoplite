name: Nginx programmability

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoplite-nginx-programmability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tcp-cosocket:
    name: TCP cosocket
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: |
          revision="$(tr -d '[:space:]' < packaging/hara-revision)"
          case "$revision" in
            ''|*[!0-9a-f]*) echo "invalid Hara revision: $revision" >&2; exit 1 ;;
          esac
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
      - name: Validate the fixture harness
        run: bash -n hoplite/packaging/scripts/smoke-cosocket-tcp.sh
      - name: Build the source-free TCP cosocket application
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/cosocket-tcp \
            --build-arg HOPLITE_DEFAULT_WORKERS=1 \
            -t hoplite-cosocket-tcp \
            .
      - name: Verify the fixture worker override
        run: |
          workers="$(docker image inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            hoplite-cosocket-tcp \
            | sed -n 's/^HOPLITE_WORKERS=//p')"
          test "$workers" = 1
      - name: Verify the production artifact contains no Hara source
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-cosocket-tcp
      - name: Prove connect, send, receive, receiveany, close, and cleanup
        run: bash hoplite/packaging/scripts/smoke-cosocket-tcp.sh hoplite-cosocket-tcp
