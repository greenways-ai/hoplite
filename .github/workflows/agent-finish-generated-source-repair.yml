name: Finish generated source repair

on:
  push:
    branches:
      - agent/prune-generated-source-output
    paths:
      - ".github/workflows/agent-finish-generated-source-repair.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/prune-generated-source-output
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoplite/website/package-lock.json

      - name: Add the scoped application-build stack and preserve source exclusions
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("core/src/app.rs")
          source = path.read_text()

          old_import = "use std::collections::{BTreeSet, VecDeque};\n"
          new_import = "use std::any::Any;\nuse std::collections::{BTreeSet, VecDeque};\n"
          if source.count(old_import) != 1:
              raise SystemExit("cannot locate the app.rs collection imports")
          source = source.replace(old_import, new_import, 1)

          constant_anchor = '''pub const RESPONSE_SOURCE: &str = include_str!("../lib/src/hoplite/response_source.hal");
          '''
          constant_replacement = '''pub const RESPONSE_SOURCE: &str = include_str!("../lib/src/hoplite/response_source.hal");

          // Loading a registered application namespace adds one nested Hara resource
          // boundary beyond direct source evaluation. The reviewed alpha runtime needs
          // more than libtest's 2 MiB worker stack, so keep that finite evaluator depth
          // inside one explicit Hoplite-owned build thread rather than changing every
          // process or test through RUST_MIN_STACK.
          const APPLICATION_BUILD_STACK_BYTES: usize = 8 * 1024 * 1024;
          '''
          if source.count(constant_anchor) != 1:
              raise SystemExit("cannot locate the response-source constant")
          source = source.replace(constant_anchor, constant_replacement, 1)

          generated_anchor = '''fn generated_output(root: &Path, path: &Path) -> bool {
              path.strip_prefix(root)
                  .unwrap_or(path)
                  .components()
                  .any(|component| component.as_os_str() == OsStr::new(".hoplite"))
          }
          '''
          generated_replacement = generated_anchor + '''
          fn editor_artifact(path: &Path) -> bool {
              path.file_name()
                  .and_then(OsStr::to_str)
                  .is_some_and(|name| {
                      name.starts_with(".#") || (name.starts_with('#') && name.ends_with('#'))
                  })
          }
          '''
          if source.count(generated_anchor) != 1:
              raise SystemExit("cannot locate generated_output")
          source = source.replace(generated_anchor, generated_replacement, 1)

          old_entry_filter = '''            if entry.file_name() == OsStr::new(".hoplite")
                          || excluded_application_path(&path, &excluded)
                      {
                          continue;
                      }
          '''
          new_entry_filter = '''            if entry.file_name() == OsStr::new(".hoplite")
                          || editor_artifact(&path)
                          || excluded_application_path(&path, &excluded)
                      {
                          continue;
                      }
          '''
          if source.count(old_entry_filter) != 1:
              raise SystemExit("cannot locate the application source entry filter")
          source = source.replace(old_entry_filter, new_entry_filter, 1)

          load_signature = '''pub fn load(project: &Project, profile: Option<&str>, production: bool) -> Result<Config, String> {
          '''
          load_replacement = '''pub fn load(project: &Project, profile: Option<&str>, production: bool) -> Result<Config, String> {
              let project = project.clone();
              let profile = profile.map(str::to_owned);
              let build = std::thread::Builder::new()
                  .name("hoplite-application-build".into())
                  .stack_size(APPLICATION_BUILD_STACK_BYTES)
                  .spawn(move || load_inner(&project, profile.as_deref(), production))
                  .map_err(|error| format!("cannot start Hoplite application build: {error}"))?;
              match build.join() {
                  Ok(result) => result,
                  Err(payload) => Err(format!(
                      "Hoplite application build panicked: {}",
                      panic_message(payload)
                  )),
              }
          }

          fn panic_message(payload: Box<dyn Any + Send>) -> String {
              if let Some(message) = payload.downcast_ref::<&str>() {
                  (*message).to_owned()
              } else if let Some(message) = payload.downcast_ref::<String>() {
                  message.clone()
              } else {
                  "non-string panic payload".into()
              }
          }

          fn load_inner(
              project: &Project,
              profile: Option<&str>,
              production: bool,
          ) -> Result<Config, String> {
          '''
          if source.count(load_signature) != 1:
              raise SystemExit("cannot locate the public application load function")
          source = source.replace(load_signature, load_replacement, 1)

          test_anchor = '''    #[test]
              fn application_source_discovery_rejects_generated_source_roots() {
          '''
          editor_test = '''    #[test]
              fn application_source_discovery_ignores_editor_artifacts() {
                  let root = temp_project("editor-artifacts");
                  write_project(&root, r#""src""#);
                  fs::create_dir_all(root.join("src/demo")).unwrap();
                  fs::write(root.join("src/demo/core.hal"), "(ns demo.core)").unwrap();
                  fs::write(
                      root.join("src/demo/.#core.hal"),
                      "unreadable editor lock",
                  )
                  .unwrap();
                  fs::write(
                      root.join("src/demo/#core.hal#"),
                      "invalid editor backup",
                  )
                  .unwrap();

                  let project = hara_wasm::project::read(&root).unwrap();
                  let sources = application_source_files(&project).unwrap();
                  assert_eq!(
                      sources,
                      vec![root.join("src/demo/core.hal").canonicalize().unwrap()]
                  );
                  fs::remove_dir_all(root).unwrap();
              }

          ''' + test_anchor
          if source.count(test_anchor) != 1:
              raise SystemExit("cannot locate the generated source-root test")
          source = source.replace(test_anchor, editor_test, 1)

          path.write_text(source)
          PY
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check

      - name: Publish the scoped runtime repair
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-finish-generated-source-repair.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bound application builds to an explicit evaluator stack"
          git push origin HEAD:agent/prune-generated-source-output

      - name: Check Rust formatting
        working-directory: hoplite
        shell: bash
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Test application source discovery
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --bin hoplite app::tests::application_source_discovery -- --nocapture

      - name: Test minimal project loading on the default caller stack
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --bin hoplite app::tests::minimal_application_project_loads -- --exact --nocapture

      - name: Test the complete Hoplite core workspace
        working-directory: hoplite
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

      - name: Build and verify the documentation site
        working-directory: hoplite/website
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          npm ci
          npm run build
