name: Apply object backend lock parser

on:
  push:
    branches:
      - agent/value-object-backend-lock-91
    paths:
      - .github/workflows/agent-apply-object-backend-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/value-object-backend-lock-91
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Export and test the closed parser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/src/provider_lock.rs')
          text = path.read_text()
          if 'mod object_backend;' in text:
              raise SystemExit('object backend lock module is already exported')
          marker = 'use std::collections::BTreeSet;\n\n'
          replacement = (
              'use std::collections::BTreeSet;\n\n'
              'mod object_backend;\n'
              'pub use object_backend::{\n'
              '    validate as validate_object_backend_lock, Expected as ObjectBackendExpected,\n'
              '    ValidatedLock as ValidatedObjectBackendLock, FORMAT as OBJECT_BACKEND_FORMAT,\n'
              '};\n\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('provider lock import marker changed')
          path.write_text(text.replace(marker, replacement))
          PY

          rustfmt --edition 2021 \
            core/src/provider_lock.rs \
            core/src/provider_lock/object_backend.rs \
            core/src/bin/hoplite-object-backend-lock.rs
          cargo test --manifest-path core/Cargo.toml --workspace --locked \
            --bin hoplite-object-backend-lock
          cargo clippy --manifest-path core/Cargo.toml --locked \
            --bin hoplite-object-backend-lock -- -D warnings

      - name: Commit only source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/src/provider_lock.rs \
            core/src/provider_lock/object_backend.rs \
            core/src/bin/hoplite-object-backend-lock.rs
          git commit -m "Validate value object backend bindings"
          git push origin HEAD:agent/value-object-backend-lock-91
