name: HTTP and footprint benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/benchmark.yml"
      - "core/**"
      - "packaging/docker/**"
      - "packaging/hara-revision"
      - "packaging/scripts/benchmark-http.sh"
      - "packaging/scripts/measure-stack-footprints.sh"
      - "packaging/scripts/run-benchmarks.sh"
      - "packaging/scripts/run-with-docker-top-compat.sh"
      - "packaging/scripts/validate-benchmark-data.sh"
      - "website/scripts/verify-pages-output.mjs"
      - "website/src/components/PerformanceProof.astro"
      - "website/src/components/RuntimeFootprint.astro"
      - "website/src/components/StackComparison.astro"

permissions:
  contents: read

concurrency:
  group: hoplite-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve pinned Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wrk jq curl
      - name: Run and validate benchmark suite
        run: bash hoplite/packaging/scripts/run-benchmarks.sh benchmark-output
      - uses: actions/upload-artifact@v4
        with:
          name: hoplite-benchmarks
          path: |
            hoplite/benchmark-output/http-benchmark.json
            hoplite/benchmark-output/stack-footprints.json
          if-no-files-found: error
          retention-days: 90
      - name: Build website against measured reports
        working-directory: hoplite
        run: |
          cp benchmark-output/http-benchmark.json website/src/data/http-benchmark.json
          cp benchmark-output/stack-footprints.json website/src/data/stack-footprints.json
          npm --prefix website ci
          HOPLITE_REQUIRE_MEASURED_BENCHMARKS=1 npm --prefix website run build
      - uses: actions/upload-artifact@v4
        with:
          name: hoplite-benchmark-site-${{ github.sha }}
          path: hoplite/website/dist
          if-no-files-found: error
          retention-days: 14
