name: Generic value store

on:
  pull_request:
    paths:
      - ".github/workflows/value-store.yml"
      - "core/abi/value-store/**"
      - "core/abi/value-store-sqlite/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/value-store.yml"
      - "core/abi/value-store/**"
      - "core/abi/value-store-sqlite/**"

permissions:
  contents: write

jobs:
  value-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Materialize stale-writer ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/abi/value-store-sqlite/src/lib.rs")
          source = path.read_text()
          old = '''        if let Some(existing_key) = load_receipt_key_by_revision(&transaction, request.revision())?
          {
              return Err(StoreError::driver(
                  "sqlite-revision-receipt-collision",
                  format!(
                      "revision {} is already bound to receipt key {existing_key}",
                      request.revision()
                  ),
              ));
          }

          let current = load_snapshot(&transaction, self.limits)?.ok_or(StoreError::Uninitialized)?;
          if current.revision() != request.expected_revision() {
              return Err(StoreError::StaleRevision {
                  expected: request.expected_revision(),
                  actual: current.revision(),
              });
          }
          '''
          new = '''        let current = load_snapshot(&transaction, self.limits)?.ok_or(StoreError::Uninitialized)?;
          if current.revision() != request.expected_revision() {
              return Err(StoreError::StaleRevision {
                  expected: request.expected_revision(),
                  actual: current.revision(),
              });
          }

          if let Some(existing_key) = load_receipt_key_by_revision(&transaction, request.revision())?
          {
              return Err(StoreError::driver(
                  "sqlite-revision-receipt-collision",
                  format!(
                      "revision {} is already bound to receipt key {existing_key}",
                      request.revision()
                  ),
              ));
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("expected one SQLite stale-writer ordering block")
          path.write_text(source.replace(old, new))
          PY
          cargo fmt --manifest-path core/abi/value-store-sqlite/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/value-store-sqlite/src/lib.rs
          git commit -m "Report stale SQLite writers before revision collisions"
          git push
      - name: Check foundation formatting
        run: cargo fmt --manifest-path core/abi/value-store/Cargo.toml --all -- --check
      - name: Reject foundation warnings
        run: cargo clippy --manifest-path core/abi/value-store/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run foundation conformance
        run: cargo test --manifest-path core/abi/value-store/Cargo.toml --all-targets --locked
      - name: Reject SQLite warnings
        run: cargo clippy --manifest-path core/abi/value-store-sqlite/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run SQLite conformance
        run: cargo test --manifest-path core/abi/value-store-sqlite/Cargo.toml --all-targets --locked
