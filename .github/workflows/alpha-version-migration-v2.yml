name: Alpha version alignment migration v2

on:
  push:
    branches:
      - agent/align-alpha-versioning

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 6dd73bbb9ba546b90dee0a075323998dd3abac85
          path: hara
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply the alpha contract migration
        working-directory: hoplite
        run: python3 .github/alpha-version-migration.py
      - name: Resolve, format and test the complete Hoplite workspace
        run: |
          cargo metadata --manifest-path hoplite/core/Cargo.toml --format-version 1 >/dev/null
          cargo fmt --manifest-path hoplite/core/Cargo.toml -- --check
          cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Commit the aligned alpha epoch
        working-directory: hoplite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align Hoplite with the alpha contract epoch'
          git push origin HEAD:agent/align-alpha-versioning
