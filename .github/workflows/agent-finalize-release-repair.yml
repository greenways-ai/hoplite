name: Finalize release compatibility repair

on:
  push:
    branches:
      - agent/import-harp-modules
    paths:
      - ".github/workflows/agent-finalize-release-repair.yml"

permissions:
  contents: write

concurrency:
  group: agent-finalize-release-repair
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/import-harp-modules
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hoplite/website/package-lock.json

      - name: Apply the reviewed source, toolchain, and conformance repairs
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_hara = "6dd73bbb9ba546b90dee0a075323998dd3abac85"
          new_hara = "2b3efd14451e96e9e79cd9645fb7e10d9e3782d6"

          revision = Path("packaging/hara-revision")
          current_revision = revision.read_text().strip()
          if current_revision not in {old_hara, new_hara}:
              raise SystemExit(f"unexpected reviewed Hara revision: {current_revision}")
          revision.write_text(new_hara + "\n")

          ci = Path(".github/workflows/ci.yml")
          source = ci.read_text()
          if old_hara in source:
              source = source.replace(old_hara, new_hara)
          if source.count(new_hara) != 1:
              raise SystemExit("CI must contain exactly one reviewed Hara revision")
          ci.write_text(source)

          dockerfile = Path("packaging/docker/Dockerfile")
          source = dockerfile.read_text()
          old = "ARG NCHAN_VERSION=1.3.8\n\nFROM rust:1.85-bookworm AS builder"
          new = "ARG NCHAN_VERSION=1.3.8\nARG RUST_VERSION=1.88.0\n\nFROM rust:${RUST_VERSION}-bookworm AS builder"
          if old in source:
              source = source.replace(old, new)
          if source.count("ARG RUST_VERSION=1.88.0") != 1 or source.count("FROM rust:${RUST_VERSION}-bookworm AS builder") != 1:
              raise SystemExit("production Dockerfile does not declare the reviewed Rust toolchain")
          dockerfile.write_text(source)

          for manifest in [Path("core/Cargo.toml"), Path("core/runtime/Cargo.toml")]:
              source = manifest.read_text()
              source = source.replace('rust-version = "1.78"', 'rust-version = "1.88"')
              if source.count('rust-version = "1.88"') != 1:
                  raise SystemExit(f"unexpected rust-version declaration in {manifest}")
              manifest.write_text(source)

          response_source = Path("core/lib/src/hoplite/response_source.hal")
          source = response_source.read_text()
          source = source.replace("   (= :hara/Integer (type value))", "   (integer? value)")
          if source.count("   (integer? value)") != 1:
              raise SystemExit("response-source portable integer contract was not repaired")
          response_source.write_text(source)

          response_test = Path("core/lib/test/hoplite/response_source_test.hal")
          source = response_test.read_text()
          if "(defn test-check" not in source:
              marker = "(ns hoplite.response-source-test\n  (:require [hoplite.response-source :as source]))\n\n"
              helper = """(defn test-check
  [name actual expected]
  (if (= actual expected)
    true
    (throw
     (ex-info name
              {:actual actual
               :expected expected}))))

"""
              if source.count(marker) != 1:
                  raise SystemExit("unexpected response-source test namespace header")
              source = source.replace(marker, marker + helper)
          if source.count("(defn test-check") != 1:
              raise SystemExit("response-source tests must contain one local assertion helper")
          response_test.write_text(source)
          PY

          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null
          cargo test --manifest-path core/Cargo.toml --bin hoplite response_source_boundary_contract_evaluates_from_hoplite
          cargo test --manifest-path core/Cargo.toml --test core_boundary
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          git diff --exit-code -- core/Cargo.lock
          git diff --check

      - name: Build and verify the documentation site
        working-directory: hoplite/website
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          npm ci
          npm run build

      - name: Build the exact generic production image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .

      - name: Publish the verified repair
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/agent-finalize-release-repair.yml \
            .github/workflows/agent-repair-release-drift.yml
          git add \
            .github/workflows/ci.yml \
            packaging/hara-revision \
            packaging/docker/Dockerfile \
            core/Cargo.toml \
            core/runtime/Cargo.toml \
            core/lib/src/hoplite/response_source.hal \
            core/lib/test/hoplite/response_source_test.hal
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair reviewed runtime and release compatibility"
          git push origin HEAD:agent/import-harp-modules
