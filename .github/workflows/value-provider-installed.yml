name: Installed hoplite.value provider

env:
  HARA_REF: d2a2e376917131cfb8954ac156db3a5e174f2c1a

on:
  pull_request:
    paths:
      - core/abi/blob-filesystem-reader/**
      - core/abi/value-provider-filesystem/**
      - core/abi/value-provider-filesystem-ffi/**
      - core/nginx/hoplite_value_host_provider.*
      - core/nginx/hoplite_value_store_host_provider.c
      - core/nginx/config
      - core/Makefile
      - packaging/docker/Dockerfile
      - packaging/hara-value-revision
      - docs/hara-value-provider.md
      - .github/workflows/value-provider-installed.yml
  push:
    branches: [main]
    paths:
      - core/abi/blob-filesystem-reader/**
      - core/abi/value-provider-filesystem/**
      - core/abi/value-provider-filesystem-ffi/**
      - core/nginx/hoplite_value_host_provider.*
      - core/nginx/hoplite_value_store_host_provider.c
      - core/nginx/config
      - core/Makefile
      - packaging/docker/Dockerfile
      - packaging/hara-value-revision
      - docs/hara-value-provider.md
      - .github/workflows/value-provider-installed.yml

permissions:
  contents: read

concurrency:
  group: installed-hara-value-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Verify the canonical decoder revision
        run: test "$(tr -d '\n' < hoplite/packaging/hara-value-revision)" = "$HARA_REF"
      - name: Check Rust formatting
        run: |
          rustfmt --edition 2021 --check \
            hoplite/core/abi/value-provider-filesystem-ffi/src/lib.rs
      - name: Reject Rust warnings
        run: |
          cargo clippy \
            --manifest-path hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml \
            --all-targets -- -D warnings
      - name: Run the FFI provider fixture
        run: |
          cargo test \
            --manifest-path hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml \
            --all-targets
      - name: Materialize the static provider library
        run: |
          cargo build \
            --manifest-path hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml \
            --release
          test -f hoplite/core/abi/value-provider-filesystem-ffi/target/release/libhoplite_value_provider_filesystem_ffi.a
      - name: Compile the installed host boundary
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Ihoplite/core/nginx \
            -Ihoplite/core/abi/value-provider-filesystem-ffi/include \
            -Ihoplite/core/abi/value-store-provider-ffi/include \
            -c hoplite/core/nginx/hoplite_value_host_provider.c \
            -o /tmp/hoplite_value_host_provider.o
          cc -std=c11 -Wall -Wextra -Werror \
            -Ihoplite/core/nginx \
            -Ihoplite/core/abi/value-provider-filesystem-ffi/include \
            -Ihoplite/core/abi/value-store-provider-ffi/include \
            -c hoplite/core/nginx/hoplite_value_store_host_provider.c \
            -o /tmp/hoplite_value_store_host_provider.o
      - name: Guard standalone source and core exclusion
        run: |
          grep -F '"hoplite.value"' hoplite/core/nginx/hoplite_value_host_provider.c
          grep -F 'HOPLITE_VALUE_PROVIDER' hoplite/core/nginx/hoplite_value_host_provider.c
          ! grep -F 'libhoplite_value_provider_filesystem_ffi.a' hoplite/core/nginx/config
          grep -F 'value-provider-filesystem-ffi/Cargo.toml' hoplite/core/Makefile
          ! grep -F 'HOPLITE_VALUE_PROVIDER=filesystem' hoplite/packaging/docker/Dockerfile
          ! grep -F 'HOPLITE_VALUE_ROOT=/var/lib/hoplite/blob' hoplite/packaging/docker/Dockerfile
          ! grep -F 'HOPLITE_VALUE_ROOT' hoplite/core/abi/value-provider-filesystem/src/provider.rs
          grep -F 'hoplite-blob-filesystem-reader' \
            hoplite/core/abi/value-provider-filesystem/Cargo.toml
          ! grep -F 'objects/sha256' \
            hoplite/core/abi/value-provider-filesystem/src/lib.rs \
            hoplite/core/abi/value-provider-filesystem/src/reader.rs \
            hoplite/core/abi/value-provider-filesystem/src/provider.rs \
            hoplite/core/abi/value-provider-filesystem/src/hta.rs
          ! grep -F 'HBO0' \
            hoplite/core/abi/value-provider-filesystem/src/lib.rs \
            hoplite/core/abi/value-provider-filesystem/src/reader.rs \
            hoplite/core/abi/value-provider-filesystem/src/provider.rs \
            hoplite/core/abi/value-provider-filesystem/src/hta.rs
          ! grep -F 'store.lock' \
            hoplite/core/abi/value-provider-filesystem/src/lib.rs \
            hoplite/core/abi/value-provider-filesystem/src/reader.rs \
            hoplite/core/abi/value-provider-filesystem/src/provider.rs \
            hoplite/core/abi/value-provider-filesystem/src/hta.rs
          ! grep -F 'fs2' \
            hoplite/core/abi/value-provider-filesystem/src/lib.rs \
            hoplite/core/abi/value-provider-filesystem/src/reader.rs \
            hoplite/core/abi/value-provider-filesystem/src/provider.rs \
            hoplite/core/abi/value-provider-filesystem/src/hta.rs
          ! grep -F 'Sha256' \
            hoplite/core/abi/value-provider-filesystem/src/lib.rs \
            hoplite/core/abi/value-provider-filesystem/src/reader.rs \
            hoplite/core/abi/value-provider-filesystem/src/provider.rs \
            hoplite/core/abi/value-provider-filesystem/src/hta.rs
