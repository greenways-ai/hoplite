name: Provider package manifest

env:
  HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984

on:
  push:
    paths:
      - core/src/provider_manifest.rs
      - core/src/bin/hoplite-provider-manifest.rs
      - packaging/providers/**/provider-manifest.json
      - packaging/docker/Dockerfile.blob-provider
      - .github/workflows/provider-package-manifest.yml
  pull_request:
    paths:
      - core/src/provider_manifest.rs
      - core/src/bin/hoplite-provider-manifest.rs
      - packaging/providers/**/provider-manifest.json
      - packaging/docker/Dockerfile.blob-provider
      - .github/workflows/provider-package-manifest.yml

permissions:
  contents: read

concurrency:
  group: provider-package-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the closed generic manifest validator
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked \
            --bin hoplite-provider-manifest
      - name: Verify source-tree and published artifact policies
        working-directory: hoplite
        run: |
          verifier=(
            cargo run --quiet --manifest-path core/Cargo.toml --locked
            --bin hoplite-provider-manifest --
          )
          compatibility=(
            --provider hoplite.blob
            --request hoplite.blob-request/1
            --result hoplite.blob-result/1
            --abi hoplite.blob-provider-ffi
            --abi-version 1
            --driver filesystem
            --driver-version 1
          )

          "${verifier[@]}" \
            packaging/providers/blob/provider-manifest.json \
            "${compatibility[@]}"

          if "${verifier[@]}" \
            packaging/providers/blob/provider-manifest.json \
            "${compatibility[@]}" --require-artifact; then
            echo "source-tree manifest unexpectedly passed published-artifact policy" >&2
            exit 1
          fi

          cp packaging/providers/blob/provider-manifest.json /tmp/incompatible.json
          sed -i 's|hoplite.blob-result/1|hoplite.blob-result/2|' /tmp/incompatible.json
          if "${verifier[@]}" /tmp/incompatible.json "${compatibility[@]}"; then
            echo "incompatible result contract unexpectedly passed" >&2
            exit 1
          fi

          cp packaging/providers/blob/provider-manifest.json /tmp/published.json
          sed -i 's|"digest": null|"digest": "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"|' \
            /tmp/published.json
          "${verifier[@]}" /tmp/published.json \
            "${compatibility[@]}" --require-artifact
