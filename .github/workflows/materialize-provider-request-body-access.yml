name: Materialize provider request-body access

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-provider-request-body-access.yml"
      - "core/nginx/hoplite_host_provider.h"
      - "core/nginx/ngx_http_hoplite_module.c"
      - "packaging/scripts/materialize-provider-request-body-access"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-request-body-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: d0794a7f2e20993220778bcbff97c16735fbb8b4
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Materialize provider request-body access
        working-directory: hoplite
        run: python3 packaging/scripts/materialize-provider-request-body-access
      - name: Verify the work-scoped access boundary
        working-directory: hoplite
        run: |
          grep -F 'hoplite_host_request_body_read_v1(' core/nginx/ngx_http_hoplite_module.c
          grep -F 'hoplite_host_request_body_finish_v1(' core/nginx/ngx_http_hoplite_module.c
          grep -F 'ctx->native_provider = native_provider;' core/nginx/ngx_http_hoplite_module.c
          grep -F '& HOPLITE_HOST_PROVIDER_REQUEST_BODY' core/nginx/ngx_http_hoplite_module.c
          grep -F 'ctx->work == work' core/nginx/ngx_http_hoplite_module.c
      - name: Test the locked Rust workspace
        run: cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Compile the provider header
        working-directory: hoplite
        run: |
          cat > /tmp/hoplite-provider-body-access.c <<'EOF'
          #include "hoplite_host_provider.h"

          static void check_signatures(void) {
            int32_t (*read_body)(void *, uint64_t, uint64_t, uint8_t *, size_t, size_t *) =
              hoplite_host_request_body_read_v1;
            int32_t (*finish_body)(void *, uint64_t, uint64_t) =
              hoplite_host_request_body_finish_v1;
            (void)read_body;
            (void)finish_body;
          }

          int main(void) {
            check_signatures();
            return HOPLITE_HOST_RESOURCE_OK == 0 &&
                   HOPLITE_HOST_RESOURCE_ERROR < 0 ? 0 : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/nginx \
            -fsyntax-only /tmp/hoplite-provider-body-access.c
      - name: Remove local build output before the production image
        run: rm -rf hoplite/core/target hara/core/rust/target
      - name: Build and exercise the production image
        run: |
          docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-provider-body-access .
          bash hoplite/packaging/scripts/smoke-request-body-v3.sh hoplite-provider-body-access
          bash hoplite/packaging/scripts/smoke-host-providers.sh hoplite-provider-body-access
      - name: Commit materialized Nginx source
        working-directory: hoplite
        run: |
          if git diff --quiet -- core/nginx/ngx_http_hoplite_module.c; then
            echo "Nginx source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/nginx/ngx_http_hoplite_module.c
          git commit -m "Expose work-scoped request bodies to native providers"
          git push
