name: Filesystem hara.blob driver

on:
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - .github/workflows/blob-store-filesystem.yml

permissions:
  contents: write

concurrency:
  group: filesystem-hara-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem-blob-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt,clippy
      - name: Materialize the staging-path ownership repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/abi/blob-store-filesystem/src/lib.rs")
          source = path.read_text()
          marker = 'io_error("blob-filesystem-staging-create", error)'
          marker_at = source.index(marker)
          open_at = source.rfind(".open(data_path)", 0, marker_at)
          if open_at < 0:
              raise SystemExit("expected the staging-create owned path open")
          prior = source.rfind(".open(data_path)", 0, open_at)
          if prior >= 0 and prior > marker_at - 500:
              raise SystemExit("staging-create ownership selection is ambiguous")
          source = source[:open_at] + ".open(&data_path)" + source[open_at + len(".open(data_path)"):]
          path.write_text(source)
          PY
          cargo fmt \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/blob-store-filesystem/src/lib.rs
          git commit -m "Preserve the staging path for rollback"
          git fetch origin agent/filesystem-blob-store
          git rebase origin/agent/filesystem-blob-store
          git push origin HEAD:agent/filesystem-blob-store
      - name: Reject warnings
        run: |
          cargo clippy \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked -- -D warnings
      - name: Run restart and integrity conformance
        run: |
          cargo test \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked
