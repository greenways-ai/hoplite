name: Filesystem hara.blob driver

on:
  push:
    branches: [agent/filesystem-blob-store]
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - .github/workflows/blob-store-filesystem.yml
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - .github/workflows/blob-store-filesystem.yml

permissions:
  contents: write

concurrency:
  group: filesystem-hara-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem-blob-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt,clippy
      - name: Materialize the first review repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("core/abi/blob-store-filesystem/src/lib.rs")
          source = lib.read_text()

          old = ".create(true)\n            .read(true)"
          new = ".create(true)\n            .truncate(false)\n            .read(true)"
          if source.count(old) != 2:
              raise SystemExit("expected exactly two non-truncating lock opens")
          source = source.replace(old, new)

          old = ".open(&data_path)"
          count = source.count(old)
          if count < 2:
              raise SystemExit(f"expected at least two owned data-path opens, found {count}")
          source = source.replace(old, ".open(data_path)")
          lib.write_text(source)

          tests = Path("core/abi/blob-store-filesystem/src/tests.rs")
          source = tests.read_text()
          import_line = "use sha2::Digest as _;\n"
          if source.count(import_line) != 1:
              raise SystemExit("expected one redundant Digest import")
          source = source.replace(import_line, "")

          start = source.index(
              "fn restart_truncates_uncommitted_tail_to_the_last_metadata_offset()"
          )
          end = source.index("\n#[test]\n", start)
          section = source[start:end]
          replacements = {
              "let store = store(&root);": "let active = store(&root);",
              "store\n        .staging_open": "active\n        .staging_open",
              "append(&store,": "append(&active,",
              "store.staging_paths": "active.staging_paths",
              "drop(store);": "drop(active);",
          }
          for old, new in replacements.items():
              if section.count(old) != 1:
                  raise SystemExit(f"expected one recovery-test occurrence: {old}")
              section = section.replace(old, new)
          tests.write_text(source[:start] + section + source[end:])
          PY
          cargo generate-lockfile \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml
          cargo fmt \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/blob-store-filesystem
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair filesystem blob-store conformance"
          git push
      - name: Reject warnings
        run: |
          cargo clippy \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked -- -D warnings
      - name: Run restart and integrity conformance
        run: |
          cargo test \
            --manifest-path core/abi/blob-store-filesystem/Cargo.toml \
            --all-targets --locked
