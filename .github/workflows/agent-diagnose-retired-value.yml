name: Diagnose retired value namespace resolution

on:
  push:
    branches:
      - fix/application-source-boundary
    paths:
      - ".github/workflows/agent-diagnose-retired-value.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/application-source-boundary
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Remove the diagnostic workflow from the branch
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-diagnose-retired-value.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove retired-value diagnostic workflow"
          git push origin HEAD:fix/application-source-boundary

      - name: Run the retirement assertion alone
        working-directory: hoplite
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --manifest-path core/Cargo.toml \
            --bin hoplite \
            app::tests::resources_exclude_the_retired_value_contract \
            -- --exact --nocapture --test-threads=1

      - name: Run all Hoplite app tests serially
        working-directory: hoplite
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --manifest-path core/Cargo.toml \
            --bin hoplite \
            app::tests \
            -- --nocapture --test-threads=1

      - name: Run all Hoplite app tests in parallel
        working-directory: hoplite
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --manifest-path core/Cargo.toml \
            --bin hoplite \
            app::tests \
            -- --nocapture
