name: Blob provider source artifact

env:
  HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984
  PROVIDER_VERSION: 0.1.0

on:
  push:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/abi/provider-hta/**
      - packaging/providers/blob/provider-manifest.json
      - packaging/providers/blob/ARTIFACT.md
      - packaging/scripts/build-blob-provider-artifact.sh
      - packaging/scripts/verify-blob-provider-artifact.sh
      - .github/workflows/blob-provider-artifact.yml
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/abi/provider-hta/**
      - packaging/providers/blob/provider-manifest.json
      - packaging/providers/blob/ARTIFACT.md
      - packaging/scripts/build-blob-provider-artifact.sh
      - packaging/scripts/verify-blob-provider-artifact.sh
      - .github/workflows/blob-provider-artifact.yml

permissions:
  contents: read

concurrency:
  group: blob-provider-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive_name: ${{ steps.build.outputs.archive_name }}
      checksum_name: ${{ steps.build.outputs.checksum_name }}
      digest: ${{ steps.build.outputs.digest }}
      revision: ${{ steps.build.outputs.revision }}
      workflow_artifact_name: ${{ steps.build.outputs.workflow_artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the exact artifact twice
        id: build
        run: |
          revision=$(git -C hoplite rev-parse HEAD)
          archive_name="hoplite-blob-provider-${PROVIDER_VERSION}.tar.gz"
          checksum_name="${archive_name}.sha256"
          workflow_artifact_name="hoplite-blob-provider-${PROVIDER_VERSION}-${revision}"
          artifact="$RUNNER_TEMP/$archive_name"
          repeated="$RUNNER_TEMP/hoplite-blob-provider-${PROVIDER_VERSION}.repeated.tar.gz"

          bash hoplite/packaging/scripts/build-blob-provider-artifact.sh \
            "$PROVIDER_VERSION" "$revision" "$artifact"
          bash hoplite/packaging/scripts/build-blob-provider-artifact.sh \
            "$PROVIDER_VERSION" "$revision" "$repeated"

          cmp "$artifact" "$repeated"
          cmp "$artifact.sha256" "$repeated.sha256"
          digest=$(awk '{print $1}' "$artifact.sha256")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$checksum_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "workflow_artifact_name=$workflow_artifact_name" >> "$GITHUB_OUTPUT"
          {
            echo '### hoplite.blob source artifact'
            echo
            echo "- version: \`$PROVIDER_VERSION\`"
            echo "- source revision: \`$revision\`"
            echo "- digest: \`sha256:$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify closed bytes and extracted package
        run: |
          extracted="$RUNNER_TEMP/extracted"
          bash hoplite/packaging/scripts/verify-blob-provider-artifact.sh \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.digest }}" \
            "$extracted"
          package="$extracted/hoplite-blob-provider-${PROVIDER_VERSION}"

          cargo run --quiet --manifest-path hoplite/core/Cargo.toml --locked \
            --bin hoplite-provider-manifest -- \
            "$package/provider-manifest.json" \
            --provider hoplite.blob \
            --request hoplite.blob-request/1 \
            --result hoplite.blob-result/1 \
            --abi hoplite.blob-provider-ffi \
            --abi-version 1 \
            --driver filesystem \
            --driver-version 1

          rustup toolchain install 1.78.0 --profile minimal --no-self-update
          cargo +1.78.0 test \
            --manifest-path "$package/abi/blob-store-provider-ffi/Cargo.toml" \
            --locked
          cargo build \
            --manifest-path "$package/abi/blob-store-provider-ffi/Cargo.toml" \
            --release --locked
      - name: Reject digest and inventory tampering
        run: |
          artifact="${{ steps.build.outputs.artifact }}"
          zeros=$(printf '0%.0s' {1..64})
          if bash hoplite/packaging/scripts/verify-blob-provider-artifact.sh \
            "$artifact" "$zeros"; then
            echo "artifact unexpectedly accepted an incorrect digest" >&2
            exit 1
          fi

          tampered_root="$RUNNER_TEMP/tampered"
          mkdir -p "$tampered_root"
          tar -xzf "$artifact" -C "$tampered_root"
          package_name="hoplite-blob-provider-${PROVIDER_VERSION}"
          printf '%s\n' 'unexpected' > "$tampered_root/$package_name/UNEXPECTED"
          tampered="$RUNNER_TEMP/tampered.tar.gz"
          LC_ALL=C tar \
            --sort=name \
            --format=ustar \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C "$tampered_root" \
            -cf - "$package_name" \
            | gzip -n -9 > "$tampered"
          tampered_digest=$(sha256sum "$tampered" | awk '{print $1}')
          if bash hoplite/packaging/scripts/verify-blob-provider-artifact.sh \
            "$tampered" "$tampered_digest"; then
            echo "artifact unexpectedly accepted a file outside its inventory" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.workflow_artifact_name }}
          path: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.build.outputs.artifact }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    needs: artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artifact.outputs.workflow_artifact_name }}
          path: release
      - name: Publish or verify the content-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.artifact.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.artifact.outputs.checksum_name }}
          DIGEST: ${{ needs.artifact.outputs.digest }}
          REVISION: ${{ needs.artifact.outputs.revision }}
        run: |
          set -euo pipefail
          tag="hoplite-blob-provider-v${PROVIDER_VERSION}"
          archive="release/$ARCHIVE_NAME"
          checksum="release/$CHECKSUM_NAME"

          test -f "$archive"
          test -f "$checksum"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$DIGEST"
          test "$(awk '{print $1}' "$checksum")" = "$DIGEST"
          test "$(awk '{print $2}' "$checksum")" = "$ARCHIVE_NAME"

          cat > release-notes.md <<EOF
          Deterministic source artifact for the separately composed filesystem \`hoplite.blob\` provider.

          - provider version: \`${PROVIDER_VERSION}\`
          - source revision: \`${REVISION}\`
          - artifact digest: \`sha256:${DIGEST}\`
          - portable contracts: \`hoplite.blob-request/1\`, \`hoplite.blob-result/1\`
          - native ABI: \`hoplite.blob-provider-ffi/1\`
          - driver: \`filesystem/1\`

          Consumers must verify the exact SHA-256 digest before extraction or compilation.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            object_type=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.type')
            target=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')
            if test "$object_type" = tag; then
              target=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$target" \
                --jq '.object.sha')
            fi
            test "$target" = "$REVISION"

            mkdir existing
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARCHIVE_NAME" \
              --pattern "$CHECKSUM_NAME" \
              --dir existing
            cmp "$archive" "existing/$ARCHIVE_NAME"
            cmp "$checksum" "existing/$CHECKSUM_NAME"
          else
            gh release create "$tag" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$REVISION" \
              --title "Hoplite blob provider ${PROVIDER_VERSION}" \
              --notes-file release-notes.md \
              --latest=false
          fi

          immutable=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq '.isImmutable')
          {
            echo '### Published hoplite.blob provider'
            echo
            echo "- tag: \`$tag\`"
            echo "- revision: \`$REVISION\`"
            echo "- digest: \`sha256:$DIGEST\`"
            echo "- GitHub release immutability: \`$immutable\`"
          } >> "$GITHUB_STEP_SUMMARY"
