name: Patch CI smoke cleanup

on:
  push:
    branches:
      - fix/remove-temporary-ci-repair-workflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/remove-temporary-ci-repair-workflow
      - name: Restore the existing response-source smoke execution
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = """            hoplite/core/nginx/tests/response_source.c \\
            -o /tmp/hoplite-response-source

  integration:"""
          new = """            hoplite/core/nginx/tests/response_source.c \\
            -o /tmp/hoplite-response-source
          /tmp/hoplite-response-source

  integration:"""
          if text.count(old) != 1:
              raise SystemExit('expected one response-source insertion point')
          path.write_text(text.replace(old, new, 1))
          PY
          additions=$(git diff --numstat -- .github/workflows/ci.yml | cut -f1)
          deletions=$(git diff --numstat -- .github/workflows/ci.yml | cut -f2)
          test "$additions" = 1
          test "$deletions" = 0
      - name: Commit the smoke restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Restore the response-source smoke execution"
          git push origin HEAD:fix/remove-temporary-ci-repair-workflow
