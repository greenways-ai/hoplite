name: Materialize provider HTA formatting

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-provider-hta-format.yml"
      - "core/abi/provider-hta/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-hta-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt
      - name: Format provider HTA source
        run: cargo fmt --manifest-path core/abi/provider-hta/Cargo.toml --all
      - name: Commit materialized formatting
        run: |
          if git diff --quiet -- core/abi/provider-hta; then
            echo "Provider HTA source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/abi/provider-hta
          git commit -m "Format the provider HTA reader"
          git push
