name: Repair CI stack diff

on:
  push:
    branches:
      - fix/ci-hara-test-stack

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-hara-test-stack
      - name: Restore the existing response-source smoke command
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''            hoplite/core/nginx/tests/response_source.c \\
            -o /tmp/hoplite-response-source

  integration:'''
          new = '''            hoplite/core/nginx/tests/response_source.c \\
            -o /tmp/hoplite-response-source
          /tmp/hoplite-response-source

  integration:'''
          if text.count(old) != 1:
              raise SystemExit('expected one response-source command insertion point')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit the exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Restore the complete CI smoke sequence"
          git push origin HEAD:fix/ci-hara-test-stack
