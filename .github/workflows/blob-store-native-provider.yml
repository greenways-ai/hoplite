name: Native hoplite.blob provider

on:
  push:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/nginx/hoplite_blob_host_provider.c
      - core/nginx/hoplite_blob_host_provider.h
      - core/nginx/hoplite_host_provider.c
      - core/nginx/hoplite_host_provider.h
      - core/nginx/ngx_http_hoplite_module.c
      - core/nginx/config
      - core/nginx/tests/blob_host_provider.c
      - core/Makefile
      - .github/workflows/blob-store-native-provider.yml
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-provider/**
      - core/abi/blob-store-provider-ffi/**
      - core/nginx/hoplite_blob_host_provider.c
      - core/nginx/hoplite_blob_host_provider.h
      - core/nginx/hoplite_host_provider.c
      - core/nginx/hoplite_host_provider.h
      - core/nginx/ngx_http_hoplite_module.c
      - core/nginx/config
      - core/nginx/tests/blob_host_provider.c
      - core/Makefile
      - .github/workflows/blob-store-native-provider.yml

permissions:
  contents: read

concurrency:
  group: native-hara-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy
      - name: Check the standalone provider FFI
        run: |
          cargo fmt --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml -- --check
          cargo clippy --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml --locked
      - name: Test exact native service registration and trusted driver selection
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I core/nginx \
            -I core/abi/blob-store-provider-ffi/include \
            core/nginx/hoplite_host_provider.c \
            core/nginx/hoplite_blob_host_provider.c \
            core/nginx/tests/blob_host_provider.c \
            -o /tmp/hoplite-blob-host-provider-test

          /tmp/hoplite-blob-host-provider-test

          HOPLITE_BLOB_ROOT=/tmp/hoplite-blob-test-root \
          HOPLITE_BLOB_MAX_OBJECT_BYTES=33554432 \
          HOPLITE_BLOB_MAX_APPEND_BYTES=2097152 \
          HOPLITE_BLOB_MAX_SOURCE_CHUNK_BYTES=32768 \
          HOPLITE_BLOB_MAX_STAGING_KEY_BYTES=192 \
          HOPLITE_BLOB_MAX_MEDIA_TYPE_BYTES=160 \
          HOPLITE_BLOB_MAX_STAGING_ENTRIES=64 \
          HOPLITE_BLOB_MAX_OBJECTS=4096 \
            /tmp/hoplite-blob-host-provider-test

          HOPLITE_BLOB_MAX_OBJECT_BYTES=not-a-number \
          HOPLITE_BLOB_TEST_EXPECT_INIT_FAILURE=1 \
            /tmp/hoplite-blob-host-provider-test

          HOPLITE_BLOB_MAX_APPEND_BYTES=1024 \
          HOPLITE_BLOB_MAX_SOURCE_CHUNK_BYTES=2048 \
          HOPLITE_BLOB_TEST_EXPECT_INIT_FAILURE=1 \
            /tmp/hoplite-blob-host-provider-test
      - name: Audit standalone provider lifecycle and core exclusion
        run: |
          grep -F 'hoplite_blob_host_provider_init_process_v1()' \
            core/nginx/tests/blob_host_provider.c
          grep -F 'hoplite_blob_host_provider_exit_process_v1();' \
            core/nginx/tests/blob_host_provider.c
          ! grep -F 'hoplite_blob_host_provider' core/nginx/config
          ! grep -F 'hoplite_blob_host_provider' \
            core/nginx/ngx_http_hoplite_module.c
          grep -F 'HOPLITE_BLOB_ROOT' \
            core/nginx/hoplite_blob_host_provider.c
          grep -F 'hoplite_blob_store_provider_open_filesystem_v1' \
            core/nginx/hoplite_blob_host_provider.c
          ! grep -F 'hoplite_blob_host_provider.c' core/nginx/config
          ! grep -F 'libhoplite_blob_store_provider_ffi.a' core/nginx/config
          grep -F 'nginx: runtime nginx-source' \
            core/Makefile
