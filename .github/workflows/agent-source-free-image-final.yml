name: Finalize the source-free Hoplite production image

on:
  push:
    branches:
      - agent/source-free-production-image

permissions:
  contents: write

concurrency:
  group: hoplite-source-free-production-image-final
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-free-production-image
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply the source-free patch with raw test fixtures
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              ".github/workflows/agent-source-free-image-repair.yml"
          ).read_text()
          payload = workflow.split("          python3 - <<'PY'\n", 1)[1].split(
              "          PY\n", 1
          )[0]
          exec(compile(textwrap.dedent(payload), "source-free-repair", "exec"), {})

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_at = text.find(start)
              end_at = text.find(end, start_at + len(start))
              if start_at < 0 or end_at < 0:
                  raise SystemExit(f"{path}: test fixture markers not found")
              file.write_text(text[:start_at] + replacement + text[end_at:])

          replace_between(
              "core/src/app.rs",
              '        fs::write(\n            root.join("project.edn"),\n',
              '        )\n        .unwrap();\n',
              '''        fs::write(
              root.join("project.edn"),
              r#"{:hara/type :project :hara/version "1.0.0" :project/id demo/app :project/version "0.1.0" :project/source-paths ["."] :project/test-paths [] :project/extension-paths [] :project/capabilities #{} :project/main demo.app :project/default-profile :server :project/profiles {:server {:profile/language :hoplite :profile/main demo.app/app}}}"#,
          ''',
          )
          replace_between(
              "core/src/app.rs",
              '        fs::write(\n            root.join("app.hal"),\n',
              '        )\n        .unwrap();\n',
              '''        fs::write(
              root.join("app.hal"),
              r#"(ns demo.app (:require [hoplite.core :as h])) (defn hello [_request] {:status 200 :body "ok"}) (def app (h/app {:name "demo" :resources [["/hello" {:get {:handler #'hello}}]]}))"#,
          ''',
          )
          PY
          chmod +x packaging/scripts/assert-production-image.sh
          cargo fmt --manifest-path core/Cargo.toml --all
          git diff --check
      - name: Prove source filtering and dev-to-production transition
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          rm -rf core/examples/.hoplite
          cargo run --manifest-path core/Cargo.toml -- serve build --mode dev core/examples
          test -f core/examples/.hoplite/app.hal
          cargo run --manifest-path core/Cargo.toml -- serve build --mode prod core/examples
          test ! -e core/examples/.hoplite/app.hal
          cargo run --manifest-path core/Cargo.toml -- verify core/examples
          cargo run --manifest-path core/Cargo.toml -- serve build --mode prod core/examples
          test ! -e core/examples/.hoplite/app.hal
          rm -rf core/examples/.hoplite
      - name: Commit the validated implementation
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/app.rs core/src/main.rs packaging/docker/Dockerfile \
            packaging/scripts/assert-production-image.sh README.md \
            docs/application-bundle.md
          git diff --cached --quiet && {
            echo "source-free production implementation produced no changes" >&2
            exit 1
          }
          git commit -m "Make the production image source-free"
          git push origin HEAD:agent/source-free-production-image
