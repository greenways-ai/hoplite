name: Hoplite

env:
  # Hoplite consumes an immutable Hara source checkout until the embedding ABI
  # is available as a published crate. This commit is the first compatible pin
  # after Hara moved its Rust workspace under core/rust.
  HARA_REF: d0794a7f2e20993220778bcbff97c16735fbb8b4

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Compile the public native data-plane header
        run: |
          cat > /tmp/hoplite-data-plane-header.c <<'EOF'
          #include "hoplite_data_plane.h"

          static int32_t read_body(
              void *context,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          static int32_t read_body_at(
              void *context,
              uint64_t offset,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)offset;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          int main(void) {
            hoplite_request_body_v1 request = {0};
            hoplite_response_body_v1 response = {0};
            request.read = read_body;
            response.read_at = read_body_at;
            return HOPLITE_DATA_PLANE_ABI_VERSION == 1u &&
                       request.read == read_body &&
                       response.read_at == read_body_at
                     ? 0
                     : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/abi/data-plane-ffi/include \
            -fsyntax-only /tmp/hoplite-data-plane-header.c
      - name: Test the fixed-capacity host-provider registry
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/tests/host_registry.c \
            -o /tmp/hoplite-host-registry-test
          /tmp/hoplite-host-registry-test
      - name: Test the exported native host-provider ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/hoplite_host_provider.c \
            hoplite/core/nginx/tests/host_provider_api.c \
            -o /tmp/hoplite-host-provider-api-test
          /tmp/hoplite-host-provider-api-test

  nginx-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - name: Build the production image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .
      - name: Smoke-test the production server, request bodies, and host providers
        run: |
          docker run --rm hoplite-ci version
          bash hoplite/packaging/scripts/smoke-request-body-v3.sh hoplite-ci
          bash hoplite/packaging/scripts/smoke-host-providers.sh hoplite-ci

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render and validate the Homebrew formula
        run: |
          VERSION=$(grep -m1 '^version = ' core/Cargo.toml | cut -d'"' -f2) \
          HOPLITE_REVISION=$(git rev-parse HEAD) \
          HARA_REVISION="$HARA_REF" \
          LICENSE=$(grep -m1 '^license = ' core/Cargo.toml | cut -d'"' -f2) \
          NGINX_VERSION=$(sed -n 's/^NGINX_VERSION := //p' core/Makefile) \
          NGINX_SHA256=$(sed -n 's/^NGINX_SHA256 := //p' core/Makefile) \
            packaging/scripts/render-homebrew-formula > /tmp/hoplite.rb
          ruby -c /tmp/hoplite.rb
          grep -F "$HARA_REF" /tmp/hoplite.rb
          grep -F 'bin.install "core/target/release/hoplite-server"' /tmp/hoplite.rb

  benchmark-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate benchmark and smoke scripts
        run: |
          bash -n packaging/scripts/benchmark-http.sh
          bash -n packaging/scripts/measure-stack-footprints.sh
          bash -n packaging/scripts/run-benchmarks.sh
          bash -n packaging/scripts/run-with-docker-top-compat.sh
          bash -n packaging/scripts/smoke-request-body-v3.sh
          bash -n packaging/scripts/smoke-host-providers.sh
          bash -n packaging/scripts/validate-benchmark-data.sh

          compat_test_root="$(mktemp -d)"
          trap 'rm -rf "$compat_test_root"' EXIT
          mkdir -p "$compat_test_root/bin"
          cat > "$compat_test_root/bin/docker" <<'SCRIPT'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "$HOPLITE_DOCKER_TOP_TEST_OUTPUT"
          SCRIPT
          chmod +x "$compat_test_root/bin/docker"
          cat > "$compat_test_root/probe.sh" <<'SCRIPT'
          command -v docker >/dev/null
          docker top benchmark-probe -eo args
          SCRIPT
          HOPLITE_DOCKER_TOP_TEST_OUTPUT="$compat_test_root/output" \
          PATH="$compat_test_root/bin:$PATH" \
            bash packaging/scripts/run-with-docker-top-compat.sh "$compat_test_root/probe.sh"
          grep -Fx 'top benchmark-probe -eo pid,args' "$compat_test_root/output"

          bash packaging/scripts/validate-benchmark-data.sh --allow-pending \
            website/src/data/http-benchmark.json \
            website/src/data/stack-footprints.json

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci && npm run build
