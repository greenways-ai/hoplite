name: CI

env:
  # Cargo is invoked from the parent of the hoplite checkout, so repository
  # .cargo configuration is not discovered by CI. Match the normal Linux
  # process stack used by the builder and worker for evaluator-heavy tests.
  RUST_MIN_STACK: 8388608

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hoplite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hara-compatibility:
    name: Hara compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara source revision
        id: hara_source
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the reviewed Hara Native revision
        id: hara_native
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-native-revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara_source.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-native
          ref: ${{ steps.hara_native.outputs.revision }}
          path: hara-native
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove the focused Hara embedding boundary
        working-directory: hoplite
        run: bash packaging/scripts/check-hara-compatibility.sh

  library:
    name: library
    needs: hara-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara source revision
        id: hara_source
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the reviewed Hara Native revision
        id: hara_native
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-native-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Verify the alpha version policy
        working-directory: hoplite
        run: bash packaging/scripts/verify-alpha-versioning.sh
      - name: Validate runtime measurement and comparison contracts
        working-directory: hoplite
        run: node packaging/scripts/validate-runtime-measurement.mjs --self-test
      - name: Test worker reload failure diagnostics
        working-directory: hoplite
        run: |
          set +e
          output="$(
            GITHUB_ACTIONS=true \
            HOPLITE_WORKER_RELOAD_DIAGNOSTIC_CAPTURE_ONLY=1 \
            HOPLITE_WORKER_RELOAD_DIAGNOSTIC_SELF_TEST=1 \
            bash packaging/scripts/smoke-worker-reload.sh 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" = 97
          grep -F 'worker-reload-phase: diagnostic-self-test' <<<"$output"
          grep -F 'worker-reload-annotation file=packaging/scripts/smoke-worker-reload.sh,title=worker-reload-diagnostic-self-test-log-base64::' <<<"$output"
          grep -F 'worker-reload-annotation file=packaging/scripts/smoke-worker-reload.sh,title=worker-reload-diagnostic-self-test-exit::fixture exited with status 97' <<<"$output"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara_source.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-native
          ref: ${{ steps.hara_native.outputs.revision }}
          path: hara-native
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify the Hara compatibility checkout
        working-directory: hoplite
        run: bash packaging/scripts/check-hara-compatibility.sh --verify-only
      - name: Check Rust formatting
        working-directory: hoplite
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Verify the committed dependency graph
        run: |
          cargo metadata \
            --manifest-path hoplite/core/Cargo.toml \
            --locked --no-deps >/dev/null
      - name: Test the complete Hoplite core workspace
        run: cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Test the deterministic cosocket lifecycle corpus
        working-directory: hoplite
        run: |
          cargo test \
            --manifest-path core/runtime/Cargo.toml \
            --test cosocket_lifecycle_model --locked -- --nocapture
      - name: Verify the default product boundary
        run: bash hoplite/packaging/scripts/verify-default-product.sh
      - name: Test the public Rust and C embedding contracts
        run: bash hoplite/packaging/scripts/smoke-embedding.sh
      - name: Compile the public data-plane header
        run: |
          cat > /tmp/hoplite-public-header.c <<'HEADER'
          #include "hoplite_data_plane.h"

          static int32_t read_body(
              void *context,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          static int32_t read_body_at(
              void *context,
              uint64_t offset,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)offset;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          int main(void) {
            hoplite_request_body_v1 request = {0};
            hoplite_response_body_v1 response = {0};
            request.read = read_body;
            response.read_at = read_body_at;
            return HOPLITE_CALLBACK_OK == 0 &&
                       request.read == read_body &&
                       response.read_at == read_body_at
                     ? 0
                     : 1;
          }
          HEADER
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/abi/data-plane-ffi/include \
            /tmp/hoplite-public-header.c \
            -o /tmp/hoplite-public-header
          /tmp/hoplite-public-header
      - name: Test the native host registry and provider ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/tests/host_registry.c \
            -o /tmp/hoplite-host-registry
          /tmp/hoplite-host-registry

          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/hoplite_host_provider.c \
            hoplite/core/nginx/tests/host_provider_api.c \
            -o /tmp/hoplite-host-provider-api
          /tmp/hoplite-host-provider-api
      - name: Test bounded response-source transport
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/hoplite_response_source.c \
            hoplite/core/nginx/tests/response_source.c \
            -o /tmp/hoplite-response-source
          /tmp/hoplite-response-source

  integration:
    name: integration
    needs: hara-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara source revision
        id: hara_source
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-revision.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the reviewed Hara Native revision
        id: hara_native
        working-directory: hoplite
        run: echo "revision=$(bash packaging/scripts/hara-native-revision.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara_source.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-native
          ref: ${{ steps.hara_native.outputs.revision }}
          path: hara-native
      - name: Verify the Hara compatibility checkout
        working-directory: hoplite
        run: bash packaging/scripts/check-hara-compatibility.sh --verify-only
      - name: Build the generic production image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .
      - name: Prove reproducible source-free application output
        env:
          REPRODUCIBILITY_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          first="$work/first"
          second="$work/second"

          for label in first second; do
            output="$work/$label"
            mkdir -p "$output"
            docker build \
              -f hoplite/packaging/docker/Dockerfile \
              --target application-artifacts \
              --build-arg HOPLITE_APP=packaging/fixtures/multi-module \
              --build-arg "HOPLITE_REPRODUCIBILITY_NONCE=${REPRODUCIBILITY_SEED}-${label}" \
              --output "type=local,dest=$output" \
              .
          done

          for output in "$first" "$second"; do
            for required in app.hbx apps.hta conf/nginx.conf; do
              test -f "$output/$required" || {
                echo "generated application is missing $required" >&2
                exit 1
              }
            done

            if find "$output" -type f \
                \( -name '*.hal' -o -name project.edn -o -name hara.extension.edn \) \
                -print -quit | grep -q .; then
              echo "generated application artifact contains source input" >&2
              find "$output" -type f \
                \( -name '*.hal' -o -name project.edn -o -name hara.extension.edn \) \
                -print >&2
              exit 1
            fi
          done

          (
            cd "$first"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$work/first.sha256"
          (
            cd "$second"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$work/second.sha256"

          diff -u "$work/first.sha256" "$work/second.sha256"
          diff -r --no-dereference "$first" "$second"
          echo "independent application builds are byte-identical"
          cat "$work/first.sha256"
      - name: Verify the source-free production image
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-ci
      - name: Exercise the real serving plane
        run: |
          docker run --rm hoplite-ci version
          bash hoplite/packaging/scripts/smoke-request-body-v3.sh hoplite-ci
      - name: Prove graceful worker reload and process recreation
        run: bash hoplite/packaging/scripts/smoke-worker-reload.sh hoplite-ci
      - name: Prove ordered and fail-stopped startup diagnostics
        run: bash hoplite/packaging/scripts/smoke-startup-diagnostics.sh hoplite-ci
      - name: Build the three-module production fixture
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/multi-module \
            -t hoplite-multi-module \
            .
      - name: Verify the fixture remains source-free
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-multi-module
      - name: Prove aliases, referred Vars and ordered namespaces through Nginx
        run: bash hoplite/packaging/scripts/smoke-multi-module.sh hoplite-multi-module
      - name: Build the TCP cosocket production fixture
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/cosocket-tcp \
            -t hoplite-cosocket-tcp \
            .
      - name: Exercise stable TCP cosocket errors through Nginx
        run: bash hoplite/packaging/scripts/smoke-cosocket-tcp.sh hoplite-cosocket-tcp
      - name: Build the directional cosocket production fixture
        run: |
          docker build \
            -f hoplite/packaging/docker/Dockerfile \
            --build-arg HOPLITE_APP=packaging/fixtures/cosocket-directional \
            -t hoplite-cosocket-directional \
            .
      - name: Exercise directional cosocket lifecycle cleanup through Nginx
        run: bash hoplite/packaging/scripts/smoke-cosocket-directional.sh hoplite-cosocket-directional

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm run build
