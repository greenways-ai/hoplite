name: Hoplite

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          path: hara.lang
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path hoplite/Cargo.toml --workspace

  nginx-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          path: hara.lang
          submodules: recursive
      - run: docker build -f hoplite/docker/Dockerfile -t hoplite-ci .
