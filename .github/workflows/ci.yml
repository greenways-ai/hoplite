name: CI

env:
  # Hoplite consumes one reviewed Hara source revision until the embedding
  # runtime is available as a published dependency.
  HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
  # Cargo is invoked from the parent of the hoplite checkout, so repository
  # .cargo configuration is not discovered by CI. Match the normal Linux
  # process stack used by the builder and worker for evaluator-heavy tests.
  RUST_MIN_STACK: 8388608

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoplite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Verify the reviewed Hara revision
        working-directory: hoplite
        run: test "$(tr -d '[:space:]' < packaging/hara-revision)" = "$HARA_REF"
      - name: Verify the alpha version policy
        working-directory: hoplite
        run: bash packaging/scripts/verify-alpha-versioning.sh
      - name: Validate runtime measurement and comparison contracts
        working-directory: hoplite
        run: node packaging/scripts/validate-runtime-measurement.mjs --self-test
      - name: Test worker reload failure diagnostics
        working-directory: hoplite
        run: |
          set +e
          output="$(
            GITHUB_ACTIONS=true \
            HOPLITE_WORKER_RELOAD_DIAGNOSTIC_CAPTURE_ONLY=1 \
            HOPLITE_WORKER_RELOAD_DIAGNOSTIC_SELF_TEST=1 \
            bash packaging/scripts/smoke-worker-reload.sh 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" = 97
          grep -F 'worker-reload-phase: diagnostic-self-test' <<<"$output"
          grep -F 'worker-reload-annotation file=packaging/scripts/smoke-worker-reload.sh,title=worker-reload-diagnostic-self-test-log-base64::' <<<"$output"
          grep -F 'worker-reload-annotation file=packaging/scripts/smoke-worker-reload.sh,title=worker-reload-diagnostic-self-test-exit::fixture exited with status 97' <<<"$output"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: hoplite
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Verify the committed dependency graph
        run: |
          cargo metadata \
            --manifest-path hoplite/core/Cargo.toml \
            --locked --no-deps >/dev/null
      - name: Test the complete Hoplite core workspace
        run: cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked
      - name: Verify the default product boundary
        run: bash hoplite/packaging/scripts/verify-default-product.sh
      - name: Test the public Rust and C embedding contracts
        run: bash hoplite/packaging/scripts/smoke-embedding.sh
      - name: Compile the public data-plane header
        run: |
          cat > /tmp/hoplite-public-header.c <<'EOF'
          #include "hoplite_data_plane.h"

          static int32_t read_body(
              void *context,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          static int32_t read_body_at(
              void *context,
              uint64_t offset,
              uint8_t *output,
              size_t capacity,
              size_t *returned) {
            (void)context;
            (void)offset;
            (void)output;
            (void)capacity;
            *returned = 0;
            return HOPLITE_CALLBACK_OK;
          }

          int main(void) {
            hoplite_request_body_v1 request = {0};
            hoplite_response_body_v1 response = {0};
            request.read = read_body;
            response.read_at = read_body_at;
            return HOPLITE_CALLBACK_OK == 0 &&
                       request.read == read_body &&
                       response.read_at == read_body_at
                     ? 0
                     : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/abi/data-plane-ffi/include \
            /tmp/hoplite-public-header.c \
            -o /tmp/hoplite-public-header
          /tmp/hoplite-public-header
      - name: Test the native host registry and provider ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/tests/host_registry.c \
            -o /tmp/hoplite-host-registry
          /tmp/hoplite-host-registry

          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/hoplite_host_provider.c \
            hoplite/core/nginx/tests/host_provider_api.c \
            -o /tmp/hoplite-host-provider-api
          /tmp/hoplite-host-provider-api
      - name: Test bounded response-source transport
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I hoplite/core/nginx \
            hoplite/core/nginx/hoplite_response_source.c \
            hoplite/core/nginx/tests/response_source.c \
            -o /tmp/hoplite-response-source
          /tmp/hoplite-response-source

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "ref=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.ref }}
          path: hara
          submodules: recursive
      - name: Build the generic production image
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-ci .
      - name: Prove reproducible source-free application output
        run: bash hoplite/packaging/scripts/smoke-reproducible-build.sh
      - name: Verify the source-free production image
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-ci
      - name: Exercise the real serving plane
        run: bash hoplite/packaging/scripts/smoke-serving.sh hoplite-ci
      - name: Prove graceful worker reload and process recreation
        run: bash hoplite/packaging/scripts/smoke-worker-reload.sh hoplite-ci
      - name: Prove ordered and fail-stopped startup diagnostics
        run: bash hoplite/packaging/scripts/smoke-startup-diagnostics.sh hoplite-ci
      - name: Build the three-module production fixture
        run: bash hoplite/packaging/scripts/smoke-multi-module.sh build hoplite-ci
      - name: Verify the fixture remains source-free
        run: bash hoplite/packaging/scripts/smoke-multi-module.sh verify hoplite-ci
      - name: Prove aliases, referred Vars and ordered namespaces through Nginx
        run: bash hoplite/packaging/scripts/smoke-multi-module.sh serve hoplite-ci

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoplite/website/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf git@github.com:
      - name: Run npm ci
        working-directory: hoplite/website
        run: npm ci
      - name: Run npm run build
        working-directory: hoplite/website
        run: npm run build
