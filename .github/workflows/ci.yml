name: Hoplite

env:
  # Hoplite currently consumes the source checkout while the new runtime ABI
  # is being released from Hara. Keep CI reproducible and in sync with the
  # version used to develop this branch.
  HARA_REF: ba52a6bfce31aeff7359d0e60d7f8d1538204694

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara.lang
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path hoplite/Cargo.toml --workspace

  nginx-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara.lang
          submodules: recursive
      - run: docker build -f hoplite/docker/Dockerfile -t hoplite-ci .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci && npm run build
