name: Wire cosocket draft PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/openresty-cosocket-tcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/openresty-cosocket-tcp
          fetch-depth: 0

      - name: Patch and validate the product tree
        id: patch
        run: |
          set -euo pipefail
          python3 .github/agent/wire_cosocket.py
          chmod +x packaging/scripts/smoke-cosocket-tcp.sh
          git restore .github/workflows/ci.yml

          git diff --check
          bash -n packaging/scripts/smoke-cosocket-tcp.sh
          python3 -m json.tool docs/public-surfaces.json >/dev/null
          grep -F '#include "cosocket/hoplite_cosocket.h"' \
            core/nginx/ngx_http_hoplite_module.c >/dev/null
          grep -F 'hoplite_host_request_cleanup_add_v1' \
            core/nginx/ngx_http_hoplite_module.c >/dev/null
          grep -F 'hoplite_cosocket_register(cycle)' \
            core/nginx/ngx_http_hoplite_module.c >/dev/null
          grep -F 'hoplite.socket' docs/public-surfaces.json >/dev/null

          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the product wiring commit
        if: steps.patch.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/nginx/ngx_http_hoplite_module.c \
            core/nginx/cosocket/hoplite_cosocket.c \
            docs/public-surfaces.json \
            docs/public-api.md \
            website/astro.config.mjs \
            website/src/content/docs/concepts/host-capabilities.mdx \
            packaging/scripts/smoke-cosocket-tcp.sh
          git commit -m "feat: wire evented TCP cosockets into Hoplite"
          git push origin "HEAD:${BRANCH}"
