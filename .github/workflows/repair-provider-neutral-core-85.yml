name: Repair provider-neutral core 85

on:
  push:
    branches:
      - agent/provider-neutral-core-85

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OLD_HARA_REF: b97f85180c57c320c1b8f011a1a91ddba4be2c46
      HARA_REF: d2a2e376917131cfb8954ac156db3a5e174f2c1a
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore provider-neutral core composition and reviewed Hara pin
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("hoplite")
          old_pin = os.environ["OLD_HARA_REF"]
          new_pin = os.environ["HARA_REF"]

          changed_pins = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or "target" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old_pin in text:
                  path.write_text(text.replace(old_pin, new_pin), encoding="utf-8")
                  changed_pins.append(str(path.relative_to(root)))
          if not changed_pins:
              raise SystemExit("reviewed Hara pin was not found in the repository")
          print("updated Hara pin in:")
          for path in changed_pins:
              print(f"  {path}")

          config = root / "core/nginx/config"
          config.write_text(
              """ngx_addon_name=ngx_http_hoplite_module

          HOPLITE_RUNTIME_DIR=${HOPLITE_RUNTIME_DIR:-$ngx_addon_dir/../../target/release}

          ngx_module_type=HTTP
          ngx_module_name=ngx_http_hoplite_module
          ngx_module_srcs=\"$ngx_addon_dir/ngx_http_hoplite_module.c \\
                           $ngx_addon_dir/hoplite_hta.c \\
                           $ngx_addon_dir/hoplite_host_provider.c \\
                           $ngx_addon_dir/hoplite_response_source.c\"
          ngx_module_incs=\"$ngx_addon_dir\"
          ngx_module_libs=\"$HOPLITE_RUNTIME_DIR/libhoplite_runtime.a \\
                           -ldl -lpthread -lm\"

          . auto/module
          """.replace("          ", ""),
              encoding="utf-8",
          )

          makefile = root / "core/Makefile"
          text = makefile.read_text(encoding="utf-8")
          old = "nginx: runtime value-store-provider value-provider blob-store-provider nginx-source"
          new = "nginx: runtime nginx-source"
          if text.count(old) != 1:
              raise SystemExit(f"expected one bundled nginx target, found {text.count(old)}")
          makefile.write_text(text.replace(old, new), encoding="utf-8")

          module = root / "core/nginx/ngx_http_hoplite_module.c"
          text = module.read_text(encoding="utf-8")
          replacements = [
              ('#include "hoplite_blob_host_provider.h"\n', ''),
              ('#include "hoplite_value_store_host_provider.h"\n', ''),
              ('    int32_t value_store_status;\n', ''),
              ('''    value_store_status = hoplite_value_store_host_provider_init_process_v1();
              if ((value_store_status != HOPLITE_VALUE_STORE_HOST_PROVIDER_OK
                   && value_store_status != HOPLITE_VALUE_STORE_HOST_PROVIDER_DISABLED)
                  || hoplite_blob_host_provider_init_process_v1()
                         != HOPLITE_BLOB_HOST_PROVIDER_OK)
              {
                  ngx_log_error(NGX_LOG_EMERG, cycle->log, 0,
                                "hoplite storage host providers could not be initialized");
                  return NGX_ERROR;
              }
          ''', ''),
              ('    hoplite_blob_host_provider_exit_process_v1();\n', ''),
              ('    hoplite_value_store_host_provider_exit_process_v1();\n', ''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one module fragment, found {count}: {old!r}")
              text = text.replace(old, new)
          if "hoplite_blob_host_provider" in text or "hoplite_value_store_host_provider" in text:
              raise SystemExit("provider lifecycle remains in the core Nginx module")
          module.write_text(text, encoding="utf-8")

          app = root / "core/src/app.rs"
          text = app.read_text(encoding="utf-8")
          old = (
              "    #[test]\n"
              "    fn value_boundary_contract_evaluates_from_hoplite() {\n"
              "        let mut runtime = Runtime::new();\n"
              "        runtime.register_resource(\"hoplite.value\", VALUE_SOURCE);\n"
              "        runtime.eval_native_value(VALUE_TEST_SOURCE).unwrap();\n"
              "    }\n"
          )
          new = (
              "    #[test]\n"
              "    fn value_boundary_contract_evaluates_from_hoplite() {\n"
              "        // This evaluator-heavy recursive contract exceeds libtest's 2 MiB\n"
              "        // worker stack. Keep the larger stack scoped to this test.\n"
              "        std::thread::Builder::new()\n"
              "            .name(\"hoplite-value-contract\".to_owned())\n"
              "            .stack_size(8 * 1024 * 1024)\n"
              "            .spawn(|| {\n"
              "                let mut runtime = Runtime::new();\n"
              "                runtime.register_resource(\"hoplite.value\", VALUE_SOURCE);\n"
              "                runtime.eval_native_value(VALUE_TEST_SOURCE).unwrap();\n"
              "            })\n"
              "            .expect(\"spawn value contract test\")\n"
              "            .join()\n"
              "            .expect(\"value contract test panicked\");\n"
              "    }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one value-contract test, found {text.count(old)}")
          app.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Reconcile and validate the reviewed Hara lock
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/Cargo.toml --workspace --no-run
          git diff -- core/Cargo.lock
          cargo test --manifest-path core/Cargo.toml --workspace --locked
      - name: Validate standalone provider workspaces
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/abi/value-store-provider-ffi/Cargo.toml
          cargo test --manifest-path core/abi/value-provider-filesystem-ffi/Cargo.toml
          cargo test --manifest-path core/abi/blob-store-provider-ffi/Cargo.toml --locked
      - name: Prove core composition excludes provider implementations
        working-directory: hoplite
        run: |
          ! grep -R --exclude-dir=.git --exclude-dir=target \
            -F "$OLD_HARA_REF" .
          ! grep -E 'hoplite_(blob|value|value_store)_host_provider' core/nginx/config
          ! grep -E 'libhoplite_(blob|value)' core/nginx/config
          ! grep -E 'hoplite_(blob|value|value_store)_host_provider' \
            core/nginx/ngx_http_hoplite_module.c
          grep -F 'nginx: runtime nginx-source' core/Makefile
      - name: Commit the validated repair and remove this workflow
        working-directory: hoplite
        run: |
          rm .github/workflows/repair-provider-neutral-core-85.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Restore provider-neutral core composition"
          git push origin HEAD:${GITHUB_REF_NAME}
