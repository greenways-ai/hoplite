name: Value provider artifact lock

env:
  CORE_HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984
  VALUE_HARA_REF: d2a2e376917131cfb8954ac156db3a5e174f2c1a
  VALUE_VERSION: 0.1.0
  VALUE_REVISION: bbc42008a44223a977a84ffedb8f2262ba06f1ba
  VALUE_SHA256: 47e96af3768621b25ef448004795ce9ecbdca091cfa31910308009156ed89e4f
  BACKEND_VERSION: 0.1.1
  BACKEND_REVISION: 8d97a452032d47740314899bb175096d8fc83f8e
  BACKEND_SHA256: 03c5dea9854cf23b60c7d2638c17712accc7e77eb53db4d15ed0b45327ee8210

on:
  push:
    paths:
      - core/src/provider_lock.rs
      - core/src/provider_lock/object_backend.rs
      - core/src/bin/hoplite-provider-lock.rs
      - core/src/bin/hoplite-object-backend-lock.rs
      - packaging/providers/value/provider-lock.json
      - packaging/providers/value/provider-manifest.json
      - packaging/providers/value/provider-manifest.published.json
      - packaging/providers/value/object-backend-lock.json
      - packaging/providers/value/ARTIFACT.md
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/hara-value-revision
      - packaging/scripts/verify-value-provider-artifact.sh
      - .github/workflows/value-provider-artifact-lock.yml
  pull_request:
    paths:
      - core/src/provider_lock.rs
      - core/src/provider_lock/object_backend.rs
      - core/src/bin/hoplite-provider-lock.rs
      - core/src/bin/hoplite-object-backend-lock.rs
      - packaging/providers/value/provider-lock.json
      - packaging/providers/value/provider-manifest.json
      - packaging/providers/value/provider-manifest.published.json
      - packaging/providers/value/object-backend-lock.json
      - packaging/providers/value/ARTIFACT.md
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/hara-value-revision
      - packaging/scripts/verify-value-provider-artifact.sh
      - .github/workflows/value-provider-artifact-lock.yml

permissions:
  contents: read

concurrency:
  group: value-provider-artifact-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.CORE_HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Test the generic provider and backend lock boundaries
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked \
            --bin hoplite-provider-lock \
            --bin hoplite-object-backend-lock

      - name: Validate the exact published value lock
        working-directory: hoplite
        run: |
          verifier=(
            cargo run --quiet --manifest-path core/Cargo.toml --locked
            --bin hoplite-provider-lock --
          )
          lock=packaging/providers/value/provider-lock.json
          manifest=packaging/providers/value/provider-manifest.published.json
          compatibility=(
            --provider hoplite.value
            --version "$VALUE_VERSION"
            --repository greenways-ai/hoplite
            --tag "hoplite-value-provider-v${VALUE_VERSION}"
            --asset "hoplite-value-provider-${VALUE_VERSION}.tar.gz"
            --media-type application/gzip
            --request hoplite.value-request/1
            --result hoplite.value-result/1
            --abi hoplite.value-provider-ffi
            --abi-version 1
            --driver filesystem
            --driver-version 1
          )

          "${verifier[@]}" "$lock" "$manifest" "${compatibility[@]}"
          "${verifier[@]}" "$lock" "$manifest" \
            "${compatibility[@]}" --shell > /tmp/value-provider.env
          grep -Fx 'HOPLITE_PROVIDER_NAME=hoplite.value' /tmp/value-provider.env
          grep -Fx "HOPLITE_PROVIDER_VERSION=${VALUE_VERSION}" /tmp/value-provider.env
          grep -Fx "HOPLITE_PROVIDER_SOURCE_REVISION=${VALUE_REVISION}" \
            /tmp/value-provider.env
          grep -Fx "HOPLITE_PROVIDER_SHA256=${VALUE_SHA256}" /tmp/value-provider.env

          cp "$lock" /tmp/value-lock-mismatch.json
          sed -i 's/47e96af3/57e96af3/' /tmp/value-lock-mismatch.json
          if "${verifier[@]}" /tmp/value-lock-mismatch.json "$manifest" \
            "${compatibility[@]}"; then
            echo "mismatched value lock digest unexpectedly passed" >&2
            exit 1
          fi

          cp "$manifest" /tmp/value-manifest-mismatch.json
          sed -i 's/47e96af3/57e96af3/' /tmp/value-manifest-mismatch.json
          if "${verifier[@]}" "$lock" /tmp/value-manifest-mismatch.json \
            "${compatibility[@]}"; then
            echo "mismatched value manifest digest unexpectedly passed" >&2
            exit 1
          fi

      - name: Download and verify the locked value release
        working-directory: hoplite
        run: |
          . /tmp/value-provider.env
          archive="/tmp/${HOPLITE_PROVIDER_ASSET}"
          curl --fail --location --retry 3 \
            "https://github.com/${HOPLITE_PROVIDER_REPOSITORY}/releases/download/${HOPLITE_PROVIDER_TAG}/${HOPLITE_PROVIDER_ASSET}" \
            --output "$archive"
          echo "${HOPLITE_PROVIDER_SHA256}  ${archive}" | sha256sum --check
          bash packaging/scripts/verify-value-provider-artifact.sh \
            "$archive" "sha256:${HOPLITE_PROVIDER_SHA256}" /tmp/value-root

          package="/tmp/value-root/hoplite-value-provider-${HOPLITE_PROVIDER_VERSION}"
          test "$(cat "${package}/PACKAGE_VERSION")" = "$VALUE_VERSION"
          test "$(cat "${package}/SOURCE_REVISION")" = "$VALUE_REVISION"
          test "$(cat "${package}/HARA_REVISION")" = "$VALUE_HARA_REF"
          test "$(cat packaging/hara-value-revision | tr -d '\r\n')" = "$VALUE_HARA_REF"
          cmp \
            packaging/providers/value/object-backend-lock.json \
            "$package/object-backend-lock.json"

      - name: Revalidate the embedded value and backend contracts
        working-directory: hoplite
        run: |
          package="/tmp/value-root/hoplite-value-provider-${VALUE_VERSION}"

          cargo run --quiet --manifest-path core/Cargo.toml --locked \
            --bin hoplite-provider-manifest -- \
            "$package/provider-manifest.json" \
            --provider hoplite.value \
            --request hoplite.value-request/1 \
            --result hoplite.value-result/1 \
            --abi hoplite.value-provider-ffi \
            --abi-version 1 \
            --driver filesystem \
            --driver-version 1

          cargo run --quiet --manifest-path core/Cargo.toml --locked \
            --bin hoplite-object-backend-lock -- \
            "$package/object-backend-lock.json" \
            "$package/provider-manifest.json" \
            "$package/backend/provider-lock.json" \
            "$package/backend/provider-manifest.published.json" \
            --consumer hoplite.value \
            --consumer-request hoplite.value-request/1 \
            --consumer-result hoplite.value-result/1 \
            --consumer-abi hoplite.value-provider-ffi \
            --consumer-abi-version 1 \
            --consumer-driver filesystem \
            --consumer-driver-version 1 \
            --backend-package hoplite-blob-filesystem-reader \
            --backend-package-version 0.1.0 \
            --backend-provider hoplite.blob \
            --backend-version "$BACKEND_VERSION" \
            --backend-repository greenways-ai/hoplite \
            --backend-tag "hoplite-blob-provider-v${BACKEND_VERSION}" \
            --backend-asset "hoplite-blob-provider-${BACKEND_VERSION}.tar.gz" \
            --backend-media-type application/gzip \
            --backend-request hoplite.blob-request/1 \
            --backend-result hoplite.blob-result/1 \
            --backend-abi hoplite.blob-provider-ffi \
            --backend-abi-version 1 \
            --backend-driver filesystem \
            --backend-driver-version 1

          grep -Fx "$BACKEND_REVISION" "$package/backend/provider-lock.json" >/dev/null || true
          grep -F "$BACKEND_SHA256" "$package/object-backend-lock.json"
          grep -F "$BACKEND_SHA256" "$package/backend/provider-lock.json"
          grep -F "$BACKEND_SHA256" "$package/backend/provider-manifest.published.json"

      - name: Build only from the verified extracted package
        working-directory: hoplite
        run: |
          package="/tmp/value-root/hoplite-value-provider-${VALUE_VERSION}"
          rustup toolchain install 1.78.0 --profile minimal --no-self-update
          cargo +1.78.0 test \
            --manifest-path "$package/hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml" \
            --all-targets --locked
          cargo +1.78.0 build \
            --manifest-path "$package/hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml" \
            --release --locked

      - name: Keep published selection outside portable requests and generic core
        working-directory: hoplite
        run: |
          ! grep -R -E 'value-provider-v0\.1\.0|provider-manifest\.published|provider-lock\.json' \
            core/lib core/nginx core/src/app.rs core/src/host.rs
