name: Prepare Nginx baseline branch

on:
  push:
    branches:
      - agent/nginx-baseline-and-footprints

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          ref: agent/nginx-baseline-and-footprints
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ba52a6bfce31aeff7359d0e60d7f8d1538204694
          path: hara.lang
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hoplite/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Refresh the exact visual-language lock
        working-directory: hoplite
        run: npm install --package-lock-only --ignore-scripts
      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wrk jq curl
      - name: Build Hoplite and same-toolchain Nginx baseline
        run: |
          docker build -f hoplite/docker/Dockerfile -t hoplite-benchmark .
          docker build -f hoplite/docker/Dockerfile.nginx-baseline -t hoplite-nginx-baseline hoplite
      - name: Build representative footprint images
        run: |
          docker build -f hoplite/docker/footprints/java/Dockerfile -t hoplite-footprint-java hoplite
          docker build -f hoplite/docker/footprints/python/Dockerfile -t hoplite-footprint-python hoplite
          docker build -f hoplite/docker/footprints/lua/Dockerfile -t hoplite-footprint-lua hoplite
      - name: Record equivalent-payload HTTP comparison
        working-directory: hoplite
        run: bash scripts/benchmark-http.sh hoplite-benchmark hoplite-nginx-baseline src/data/http-benchmark.json
      - name: Record representative stack footprints
        working-directory: hoplite
        run: bash scripts/measure-stack-footprints.sh hoplite-benchmark hoplite-nginx-baseline hoplite-footprint-java hoplite-footprint-python hoplite-footprint-lua src/data/stack-footprints.json
      - name: Commit generated evidence
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/data/http-benchmark.json src/data/stack-footprints.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Nginx comparison and stack footprints [skip ci]"
          git push origin HEAD:agent/nginx-baseline-and-footprints
