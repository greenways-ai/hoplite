name: Prepare Nginx baseline branch

on:
  push:
    branches:
      - agent/nginx-baseline-and-footprints

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          ref: agent/nginx-baseline-and-footprints
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ba52a6bfce31aeff7359d0e60d7f8d1538204694
          path: hara.lang
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hoplite/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Refresh the exact visual-language lock
        working-directory: hoplite
        run: npm install --package-lock-only --ignore-scripts
      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wrk jq curl
      - name: Build Hoplite and same-toolchain Nginx baseline
        run: |
          docker build -f hoplite/docker/Dockerfile -t hoplite-benchmark .
          docker build -f hoplite/docker/Dockerfile.nginx-baseline -t hoplite-nginx-baseline hoplite
      - name: Build representative footprint images
        run: |
          docker build -f hoplite/docker/footprints/java/Dockerfile -t hoplite-footprint-java hoplite
          docker build -f hoplite/docker/footprints/python/Dockerfile -t hoplite-footprint-python hoplite
          docker build -f hoplite/docker/footprints/lua/Dockerfile -t hoplite-footprint-lua hoplite
      - name: Record equivalent-payload HTTP comparison
        working-directory: hoplite
        run: bash scripts/benchmark-http.sh hoplite-benchmark hoplite-nginx-baseline src/data/http-benchmark.json
      - name: Record representative stack footprints
        id: footprints
        continue-on-error: true
        working-directory: hoplite
        run: |
          set -o pipefail
          bash -x scripts/measure-stack-footprints.sh \
            hoplite-benchmark \
            hoplite-nginx-baseline \
            hoplite-footprint-java \
            hoplite-footprint-python \
            hoplite-footprint-lua \
            src/data/stack-footprints.json \
            2>&1 | tee footprint-debug.log
      - name: Capture Docker diagnostics
        if: always()
        working-directory: hoplite
        run: |
          {
            echo "## docker ps -a"
            docker ps -a
            echo
            echo "## benchmark image sizes"
            docker image inspect \
              hoplite-benchmark \
              hoplite-nginx-baseline \
              hoplite-footprint-java \
              hoplite-footprint-python \
              hoplite-footprint-lua \
              --format '{{.RepoTags}} {{.Size}}' || true
            echo
            echo "## retained container logs"
            for container in $(docker ps -a --format '{{.Names}}' | grep '^hoplite-footprint-' || true); do
              echo "### $container"
              docker inspect "$container" --format '{{json .State}}' || true
              docker logs "$container" || true
            done
          } > footprint-docker-debug.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hoplite/footprint-debug.log
            hoplite/footprint-docker-debug.log
          if-no-files-found: warn
      - name: Fail when footprint measurement failed
        if: steps.footprints.outcome == 'failure'
        run: exit 1
      - name: Commit generated evidence
        if: steps.footprints.outcome == 'success'
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/data/http-benchmark.json src/data/stack-footprints.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Nginx comparison and stack footprints [skip ci]"
          git push origin HEAD:agent/nginx-baseline-and-footprints
