name: Repair distribution worker environment 85 v2

on:
  push:
    branches:
      - agent/distribution-worker-env-85

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply bounded distribution composition repair
        run: |
          printf '%s' '' | base64 --decode > /tmp/repair.py
          python3 /tmp/repair.py
      - name: Format and validate
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          ! grep -E 'env HOPLITE_(BLOB|STORE|VALUE)' core/src/main.rs
          ! grep -F 'const TRUSTED_WORKER_ENVIRONMENT' core/src/bin/hoplite-server.rs
          grep -F 'option_env!("HOPLITE_DISTRIBUTION_WORKER_ENVIRONMENT")' \
            core/src/bin/hoplite-server.rs
          grep -F 'HOPLITE_DISTRIBUTION_WORKER_ENVIRONMENT=HOPLITE_BLOB_ROOT' \
            packaging/docker/Dockerfile.blob-provider
      - name: Commit validated source changes
        working-directory: hoplite
        run: |
          git add core/src/main.rs core/src/bin/hoplite-server.rs \
            packaging/docker/Dockerfile.blob-provider
          git diff --cached --check
          git diff --cached --name-status
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Move provider environment into distribution builds"
          git push origin HEAD:${GITHUB_REF_NAME}
