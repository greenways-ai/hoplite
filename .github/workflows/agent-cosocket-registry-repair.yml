name: Apply cosocket registry repair

on:
  push:
    branches:
      - agent/cosocket-baseline-conformance
  pull_request:

permissions:
  contents: write

env:
  HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6

jobs:
  repair:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/cosocket-baseline-conformance')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/cosocket-baseline-conformance
          path: hoplite
          fetch-depth: 0

      - name: Verify the reviewed Hara revision
        working-directory: hoplite
        run: test "$(tr -d '[:space:]' < packaging/hara-revision)" = "$HARA_REF"

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive

      - name: Apply the product-code repair
        id: repair
        working-directory: hoplite
        run: |
          set -euo pipefail
          if grep -Fq 'pub const SOCKET_SOURCE' core/src/app.rs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/agent/patch_cosocket_registry.py
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          changed="$(git status --short)"
          test "$changed" = ' M core/src/app.rs'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Test production resource completeness
        if: steps.repair.outputs.changed == 'true'
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/Cargo.toml --lib \
            app::tests::production_resources_cover_the_non_development_hal_library \
            -- --exact --nocapture

      - name: Test the socket HAL contract through the production registry
        if: steps.repair.outputs.changed == 'true'
        working-directory: hoplite
        run: |
          cargo test --manifest-path core/Cargo.toml --lib \
            app::tests::socket_hal_contract_evaluates_from_the_production_registry \
            -- --exact --nocapture

      - name: Commit the repaired registry
        if: steps.repair.outputs.changed == 'true'
        working-directory: hoplite
        env:
          BRANCH: agent/cosocket-baseline-conformance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/app.rs
          git commit -m 'fix: register the complete Hoplite application library'
          git push origin "HEAD:${BRANCH}"
