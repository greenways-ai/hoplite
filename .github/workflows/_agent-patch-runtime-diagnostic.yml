name: Apply runtime diagnostic test hardening

on:
  push:
    branches:
      - agent/cosocket-source-free-dependency-bundle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cosocket-source-free-dependency-bundle
          fetch-depth: 0

      - name: Make diagnostic assertion independent of JSON key order
        shell: python
        run: |
          from pathlib import Path

          path = Path("core/runtime/src/lib.rs")
          source = path.read_text()
          old = '''        assert_eq!(diagnostics.len(), 1);
                  assert!(diagnostics[0].contains(
                      "\\\"sequence\\\":2,\\\"stage\\\":\\\"bundle\\\",\\\"status\\\":\\\"failed\\\",\\\"class\\\":\\\"application-bundle-checksum-mismatch\\\""
                  ));
          '''
          new = '''        assert_eq!(diagnostics.len(), 1);
                  let diagnostic: serde_json::Value = serde_json::from_str(&diagnostics[0]).unwrap();
                  assert_eq!(diagnostic["sequence"], 2);
                  assert_eq!(diagnostic["stage"], "bundle");
                  assert_eq!(diagnostic["status"], "failed");
                  assert_eq!(
                      diagnostic["class"],
                      "application-bundle-checksum-mismatch"
                  );
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one diagnostic assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new))

      - name: Remove one-shot workflow and publish patch
        shell: bash
        run: |
          rm .github/workflows/_agent-patch-runtime-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/runtime/src/lib.rs .github/workflows/_agent-patch-runtime-diagnostic.yml
          git commit -m "Make startup diagnostic assertion key-order independent"
          git push origin HEAD:agent/cosocket-source-free-dependency-bundle
