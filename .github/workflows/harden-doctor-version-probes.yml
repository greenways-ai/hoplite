name: Harden doctor version probes

on:
  push:
    branches:
      - agent/hoplite-doctor-108

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Require exact runtime identities
        run: python3 .github/scripts/harden-doctor-version-probes.py
      - name: Format and validate the implementation
        run: |
          rustfmt --edition 2021 core/src/doctor.rs
          test ! -e .github/workflows/harden-doctor-version-probes.yml
          test ! -e .github/scripts/harden-doctor-version-probes.py
          git diff --check
      - name: Commit the hardened doctor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "hardening produced no changes" >&2
            exit 1
          }
          git commit -m "Require exact doctor runtime identities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
