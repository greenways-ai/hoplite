name: Prepare shared docs branch

on:
  push:
    branches:
      - agent/shared-docs-and-measurements

permissions:
  contents: write

concurrency:
  group: prepare-shared-docs-branch
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          fetch-depth: 0
          ref: agent/shared-docs-and-measurements
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ba52a6bfce31aeff7359d0e60d7f8d1538204694
          path: hara.lang
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hoplite/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Refresh the exact visual-language lock
        working-directory: hoplite
        run: npm install --package-lock-only --ignore-scripts
      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wrk jq curl
      - name: Build the measured image
        run: docker build -f hoplite/docker/Dockerfile -t hoplite-benchmark .
      - name: Record raw HTTP measurements
        working-directory: hoplite
        run: scripts/benchmark-http.sh hoplite-benchmark src/data/http-benchmark.json
      - name: Commit generated inputs
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/data/http-benchmark.json
          if git diff --cached --quiet; then
            echo "Generated inputs are already current."
            exit 0
          fi
          git commit -m "chore: record measured documentation inputs [skip ci]"
          git push origin HEAD:agent/shared-docs-and-measurements
