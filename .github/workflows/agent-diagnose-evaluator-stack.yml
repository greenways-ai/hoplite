name: Diagnose evaluator stack depth

on:
  push:
    branches:
      - agent/prune-generated-source-output
    paths:
      - ".github/workflows/agent-diagnose-evaluator-stack.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/prune-generated-source-output
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Remove the diagnostic workflow from the branch
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-diagnose-evaluator-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove evaluator stack diagnostic workflow"
          git push origin HEAD:agent/prune-generated-source-output

      - name: Prove direct HAL application evaluation on the default stack
        working-directory: hoplite
        shell: bash
        run: |
          cargo test --manifest-path core/Cargo.toml \
            --bin hoplite \
            app::tests::app_sources_evaluate_and_preserve_handler_vars \
            -- --exact --nocapture --test-threads=1

      - name: Measure the minimal project-load stack threshold
        working-directory: hoplite
        shell: bash
        run: |
          set +e
          failed=0
          for stack in 4194304 8388608 16777216 33554432 67108864; do
            echo "=== RUST_MIN_STACK=$stack ==="
            RUST_MIN_STACK="$stack" cargo test --manifest-path core/Cargo.toml \
              --bin hoplite \
              app::tests::minimal_application_project_loads \
              -- --exact --nocapture --test-threads=1
            status=$?
            echo "=== stack $stack exit $status ==="
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            failed=$status
          done
          exit "$failed"
