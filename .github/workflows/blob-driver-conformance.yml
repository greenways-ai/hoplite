name: Blob driver conformance

on:
  push:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-conformance/**
      - .github/workflows/blob-driver-conformance.yml
  pull_request:
    paths:
      - core/abi/blob-store/**
      - core/abi/blob-store-filesystem/**
      - core/abi/blob-store-conformance/**
      - .github/workflows/blob-driver-conformance.yml

permissions:
  contents: read

concurrency:
  group: blob-driver-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.78.0
          - stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Verify shared memory/filesystem behaviour
        run: |
          cargo fmt --manifest-path core/abi/blob-store-conformance/Cargo.toml -- --check
          cargo test --manifest-path core/abi/blob-store-conformance/Cargo.toml --locked
      - name: Keep conformance outside generic Hoplite composition
        run: |
          ! grep -F 'blob-store-conformance' core/Cargo.toml
          ! grep -F 'blob-store-conformance' core/nginx/config
          ! grep -F 'blob-store-conformance' packaging/docker/Dockerfile

  driver-extensions:
    name: driver extension suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve generic and filesystem-specific evidence
        run: |
          cargo test --manifest-path core/abi/blob-store/Cargo.toml --locked
          cargo test --manifest-path core/abi/blob-store-filesystem/Cargo.toml --locked
