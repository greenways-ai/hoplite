name: Add HAB1 verification and bounded startup reads

on:
  push:
    branches:
      - agent/hoplite-verify-bundle-v1

permissions:
  contents: write

concurrency:
  group: hoplite-verify-bundle-v1
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/hoplite-verify-bundle-v1
          path: hoplite
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "revision=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.revision }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Implement bounded file verification and file-based bootstrap
        working-directory: hoplite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_at = text.find(start)
              end_at = text.find(end, start_at + len(start))
              if start_at < 0 or end_at < 0:
                  raise SystemExit(f"{path}: structural markers not found")
              file.write_text(text[:start_at] + replacement + text[end_at:])

          def insert_before_last(path: str, marker: str, content: str) -> None:
              file = Path(path)
              text = file.read_text()
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f"{path}: final marker not found")
              file.write_text(text[:index] + content + text[index:])

          # Shared bounded file ownership in the HAB1 library.
          replace_exact(
              "core/application-bundle/src/lib.rs",
              "use sha2::{Digest, Sha256};\nuse std::fmt;\n",
              "use sha2::{Digest, Sha256};\nuse std::fmt;\nuse std::fs::File;\nuse std::io::{self, Read};\nuse std::path::{Path, PathBuf};\n",
          )
          replace_exact(
              "core/application-bundle/src/lib.rs",
              "impl std::error::Error for Error {}\n\n",
              '''impl std::error::Error for Error {}

          #[derive(Debug)]
          pub enum FileError {
              Io {
                  class: &'static str,
                  operation: &'static str,
                  path: PathBuf,
                  source: io::Error,
              },
              NotRegular {
                  class: &'static str,
                  path: PathBuf,
              },
              TooLarge {
                  class: &'static str,
                  path: PathBuf,
                  actual: u64,
                  maximum: usize,
              },
              Changed {
                  class: &'static str,
                  path: PathBuf,
                  expected: u64,
                  actual: usize,
              },
          }

          impl fmt::Display for FileError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  match self {
                      Self::Io {
                          class,
                          operation,
                          path,
                          source,
                      } => write!(
                          formatter,
                          "hoplite/{class}-file-{operation}: {}: {source}",
                          path.display()
                      ),
                      Self::NotRegular { class, path } => write!(
                          formatter,
                          "hoplite/{class}-file-not-regular: {}",
                          path.display()
                      ),
                      Self::TooLarge {
                          class,
                          path,
                          actual,
                          maximum,
                      } => write!(
                          formatter,
                          "hoplite/{class}-file-too-large: {} is {actual} bytes; maximum is {maximum}",
                          path.display()
                      ),
                      Self::Changed {
                          class,
                          path,
                          expected,
                          actual,
                      } => write!(
                          formatter,
                          "hoplite/{class}-file-changed: {} was {expected} bytes and read as {actual}",
                          path.display()
                      ),
                  }
              }
          }

          impl std::error::Error for FileError {
              fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {
                  match self {
                      Self::Io { source, .. } => Some(source),
                      _ => None,
                  }
              }
          }

          ''',
          )
          replace_exact(
              "core/application-bundle/src/lib.rs",
              "pub fn encode(manifest: &[u8], bytecode: &[u8]) -> Result<Vec<u8>, Error> {\n",
              '''pub fn read_bundle_file(path: impl AsRef<Path>) -> Result<Vec<u8>, FileError> {
              read_bounded(path.as_ref(), MAX_BUNDLE_BYTES, "application-bundle")
          }

          pub fn read_manifest_file(path: impl AsRef<Path>) -> Result<Vec<u8>, FileError> {
              read_bounded(
                  path.as_ref(),
                  MAX_MANIFEST_BYTES,
                  "application-manifest",
              )
          }

          fn read_bounded(
              path: &Path,
              maximum: usize,
              class: &'static str,
          ) -> Result<Vec<u8>, FileError> {
              let path = path.to_path_buf();
              let file = File::open(&path).map_err(|source| FileError::Io {
                  class,
                  operation: "open",
                  path: path.clone(),
                  source,
              })?;
              let metadata = file.metadata().map_err(|source| FileError::Io {
                  class,
                  operation: "metadata",
                  path: path.clone(),
                  source,
              })?;
              if !metadata.is_file() {
                  return Err(FileError::NotRegular { class, path });
              }
              if metadata.len() > maximum as u64 {
                  return Err(FileError::TooLarge {
                      class,
                      path,
                      actual: metadata.len(),
                      maximum,
                  });
              }

              let expected = metadata.len();
              let mut bytes = Vec::with_capacity(expected as usize);
              file.take(maximum as u64 + 1)
                  .read_to_end(&mut bytes)
                  .map_err(|source| FileError::Io {
                      class,
                      operation: "read",
                      path: path.clone(),
                      source,
                  })?;
              if bytes.len() > maximum {
                  return Err(FileError::TooLarge {
                      class,
                      path,
                      actual: bytes.len() as u64,
                      maximum,
                  });
              }
              if bytes.len() as u64 != expected {
                  return Err(FileError::Changed {
                      class,
                      path,
                      expected,
                      actual: bytes.len(),
                  });
              }
              Ok(bytes)
          }

          pub fn encode(manifest: &[u8], bytecode: &[u8]) -> Result<Vec<u8>, Error> {
          ''',
          )
          insert_before_last(
              "core/application-bundle/src/lib.rs",
              "}\n",
              '''
              #[test]
              fn bounded_file_reads_preserve_exact_bytes_and_reject_oversize() {
                  use std::sync::atomic::{AtomicU64, Ordering};

                  static NEXT: AtomicU64 = AtomicU64::new(1);
                  let path = std::env::temp_dir().join(format!(
                      "hoplite-hab1-file-{}-{}",
                      std::process::id(),
                      NEXT.fetch_add(1, Ordering::Relaxed)
                  ));
                  std::fs::write(&path, b"exact").unwrap();
                  assert_eq!(read_bounded(&path, 5, "test").unwrap(), b"exact");
                  assert!(matches!(
                      read_bounded(&path, 4, "test"),
                      Err(FileError::TooLarge {
                          actual: 5,
                          maximum: 4,
                          ..
                      })
                  ));
                  std::fs::remove_file(path).unwrap();
              }
          ''',
          )

          # Operator-facing source-free verification.
          replace_exact(
              "core/src/main.rs",
              "use hara_wasm::kernel::{parse_forms, Form};\n",
              "use hara_wasm::hta;\nuse hara_wasm::kernel::{parse_forms, Form};\n",
          )
          replace_exact(
              "core/src/main.rs",
              '        Some("serve") => run_serve_command(&arguments[1..])?,\n',
              '        Some("serve") => run_serve_command(&arguments[1..])?,\n        Some("verify") => run_verify_command(&arguments[1..])?,\n',
          )
          replace_exact(
              "core/src/main.rs",
              '    println!("  hoplite package [check|build|inspect|install|verify] [OPTIONS]");\n',
              '    println!("  hoplite verify [--manifest FILE] [PROJECT|OUTPUT|BUNDLE]");\n    println!("  hoplite package [check|build|inspect|install|verify] [OPTIONS]");\n',
          )
          replace_exact(
              "core/src/main.rs",
              "#[cfg(feature = \"legacy-management\")]\nfn run_auth_command(arguments: &[String]) -> Result<(), String> {\n",
              '''#[derive(Clone, Debug, PartialEq, Eq)]
          struct ApplicationVerification {
              bundle_path: PathBuf,
              manifest_path: PathBuf,
              bundle_bytes: usize,
              manifest_bytes: usize,
              bytecode_bytes: usize,
              manifest_digest: [u8; 32],
          }

          fn run_verify_command(arguments: &[String]) -> Result<(), String> {
              if matches!(
                  arguments.first().map(String::as_str),
                  Some("--help" | "-h" | "help")
              ) {
                  verify_usage();
                  return Ok(());
              }

              let mut target = None;
              let mut manifest_override = None;
              let mut index = 0;
              while index < arguments.len() {
                  match arguments[index].as_str() {
                      "--manifest" => {
                          index += 1;
                          manifest_override = Some(PathBuf::from(
                              arguments
                                  .get(index)
                                  .ok_or("verify --manifest requires a file")?,
                          ));
                      }
                      value if target.is_none() => target = Some(PathBuf::from(value)),
                      value => return Err(format!("unexpected verify argument: {value}")),
                  }
                  index += 1;
              }

              let target = target.unwrap_or(env::current_dir().map_err(io)?);
              let (bundle_path, default_manifest_path) = verification_paths(&target);
              let manifest_path = manifest_override.unwrap_or(default_manifest_path);
              let verified = verify_application_bundle(&bundle_path, &manifest_path)?;
              println!("verified {}", application_bundle::FORMAT);
              println!(
                  "bundle: {} ({} bytes)",
                  verified.bundle_path.display(),
                  verified.bundle_bytes
              );
              println!(
                  "manifest: {} ({} bytes)",
                  verified.manifest_path.display(),
                  verified.manifest_bytes
              );
              println!(
                  "runtime ABI: {}",
                  application_bundle::RUNTIME_ABI_VERSION
              );
              println!(
                  "manifest sha256: {}",
                  lower_hex(&verified.manifest_digest)
              );
              println!("embedded HBB2: {} bytes", verified.bytecode_bytes);
              Ok(())
          }

          fn verify_usage() {
              println!("Verify a built Hoplite application without executing it");
              println!();
              println!(
                  "usage: hoplite verify [--manifest FILE] [PROJECT|OUTPUT|BUNDLE]"
              );
          }

          fn verification_paths(target: &Path) -> (PathBuf, PathBuf) {
              let explicit_bundle = target.is_file()
                  || target
                      .extension()
                      .and_then(|value| value.to_str())
                      .is_some_and(|value| value.eq_ignore_ascii_case("hbx"));
              if explicit_bundle {
                  let manifest = target
                      .parent()
                      .unwrap_or_else(|| Path::new("."))
                      .join("apps.hta");
                  return (target.to_path_buf(), manifest);
              }

              let is_output = target
                  .file_name()
                  .and_then(|value| value.to_str())
                  .is_some_and(|value| value == ".hoplite")
                  || target.join("app.hbx").is_file()
                  || target.join("apps.hta").is_file();
              let output = if is_output {
                  target.to_path_buf()
              } else {
                  target.join(".hoplite")
              };
              (output.join("app.hbx"), output.join("apps.hta"))
          }

          fn verify_application_bundle(
              bundle_path: &Path,
              manifest_path: &Path,
          ) -> Result<ApplicationVerification, String> {
              let bundle = application_bundle::read_bundle_file(bundle_path)
                  .map_err(|error| error.to_string())?;
              let manifest = application_bundle::read_manifest_file(manifest_path)
                  .map_err(|error| error.to_string())?;
              let decoded = application_bundle::decode(&bundle, &manifest)
                  .map_err(|error| error.to_string())?;
              hta::decode(&manifest)
                  .map_err(|error| format!("hoplite/application-manifest-invalid: {error}"))?;
              Ok(ApplicationVerification {
                  bundle_path: bundle_path.to_path_buf(),
                  manifest_path: manifest_path.to_path_buf(),
                  bundle_bytes: bundle.len(),
                  manifest_bytes: manifest.len(),
                  bytecode_bytes: decoded.bytecode().len(),
                  manifest_digest: decoded.manifest_digest(),
              })
          }

          fn lower_hex(bytes: &[u8]) -> String {
              const HEX: &[u8; 16] = b"0123456789abcdef";
              let mut output = String::with_capacity(bytes.len() * 2);
              for byte in bytes {
                  output.push(HEX[(byte >> 4) as usize] as char);
                  output.push(HEX[(byte & 0x0f) as usize] as char);
              }
              output
          }

          #[cfg(feature = "legacy-management")]
          fn run_auth_command(arguments: &[String]) -> Result<(), String> {
          ''',
          )
          insert_before_last(
              "core/src/main.rs",
              "}\n",
              '''
              #[test]
              fn verifies_a_built_application_without_source_execution() {
                  use std::sync::atomic::{AtomicU64, Ordering};

                  static NEXT: AtomicU64 = AtomicU64::new(1);
                  let root = std::env::temp_dir().join(format!(
                      "hoplite-verify-{}-{}",
                      std::process::id(),
                      NEXT.fetch_add(1, Ordering::Relaxed)
                  ));
                  let output = root.join(".hoplite");
                  std::fs::create_dir_all(&output).unwrap();
                  let manifest = hta::encode(&hara_wasm::core::Value::Map(Default::default()))
                      .unwrap();
                  let bundle = application_bundle::encode(&manifest, b"HBB2verification").unwrap();
                  std::fs::write(output.join("app.hbx"), &bundle).unwrap();
                  std::fs::write(output.join("apps.hta"), &manifest).unwrap();

                  let (bundle_path, manifest_path) = verification_paths(&root);
                  let verified = verify_application_bundle(&bundle_path, &manifest_path).unwrap();
                  assert_eq!(verified.bundle_bytes, bundle.len());
                  assert_eq!(verified.manifest_bytes, manifest.len());
                  assert_eq!(verified.bytecode_bytes, b"HBB2verification".len());
                  assert_eq!(lower_hex(&verified.manifest_digest).len(), 64);

                  std::fs::remove_dir_all(root).unwrap();
              }
          ''',
          )

          # File-based FFI bootstrap gives Nginx the same pre-allocation limits.
          replace_exact(
              "core/runtime/src/lib.rs",
              "#[no_mangle]\npub unsafe extern \"C\" fn hoplite_work_start(\n",
              '''#[no_mangle]
          pub unsafe extern "C" fn hoplite_bootstrap_application_files_v1(
              runtime: *mut HopliteRuntime,
              bundle_path_ptr: *const u8,
              bundle_path_len: usize,
              manifest_path_ptr: *const u8,
              manifest_path_len: usize,
          ) -> i32 {
              catch_unwind(AssertUnwindSafe(|| {
                  let runtime = runtime_mut(runtime)?;
                  let bundle_path = source(bundle_path_ptr, bundle_path_len)?;
                  let manifest_path = source(manifest_path_ptr, manifest_path_len)?;
                  let bundle = application_bundle::read_bundle_file(bundle_path).map_err(|error| {
                      eprintln!("hoplite application bootstrap: {error}");
                  })?;
                  let manifest =
                      application_bundle::read_manifest_file(manifest_path).map_err(|error| {
                          eprintln!("hoplite application bootstrap: {error}");
                      })?;
                  if let Err(error) = runtime.bootstrap_application(&bundle, &manifest) {
                      eprintln!("hoplite application bootstrap: {error}");
                      return Err(());
                  }
                  Ok::<i32, ()>(0)
              }))
              .ok()
              .and_then(Result::ok)
              .unwrap_or(1)
          }

          #[no_mangle]
          pub unsafe extern "C" fn hoplite_work_start(
          ''',
          )
          replace_exact(
              "core/nginx/hoplite_runtime.h",
              "                                     const uint8_t *manifest,\n                                     size_t manifest_len);\n\n",
              '''                                     const uint8_t *manifest,
                                     size_t manifest_len);

          /*
           * Read the configured HAB1 and manifest as bounded regular files,
           * then perform the same combined transactional startup.
           */
          int hoplite_bootstrap_application_files_v1(
              hoplite_runtime_t *runtime,
              const uint8_t *bundle_path,
              size_t bundle_path_len,
              const uint8_t *manifest_path,
              size_t manifest_path_len);

          ''',
          )
          replace_between(
              "core/nginx/ngx_http_hoplite_module.c",
              "static ngx_int_t\nngx_http_hoplite_read_file(",
              "static ngx_int_t\nngx_http_hoplite_init_process(",
              '''static ngx_int_t
          ngx_http_hoplite_bootstrap(ngx_cycle_t *cycle,
                                     const ngx_str_t *bundle_path,
                                     const ngx_str_t *manifest_path)
          {
              if (hoplite_bootstrap_application_files_v1(
                      ngx_http_hoplite_runtime,
                      bundle_path->data,
                      bundle_path->len,
                      manifest_path->data,
                      manifest_path->len) != 0)
              {
                  ngx_log_error(NGX_LOG_EMERG, cycle->log, 0,
                                "hoplite HAB1 application bootstrap loading failed");
                  return NGX_ERROR;
              }
              return NGX_OK;
          }

          ''',
          )

          with Path("docs/application-bundle.md").open("a") as file:
              file.write('''

          ## Source-free verification

          `hoplite verify [--manifest FILE] [PROJECT|OUTPUT|BUNDLE]` reads only the
          built HAB1 and its exact manifest. It applies the same regular-file and size
          limits used by production worker startup, verifies the envelope and manifest
          digest, validates the HTA document, and reports the runtime ABI, digest and
          embedded HBB2 size without executing application code.

          The Nginx module passes configured paths to the Rust runtime rather than
          allocating files in C. Bundle and manifest limits are therefore checked before
          allocation from one library-owned implementation.
          ''')
          PY
      - name: Format and validate the complete workspace
        working-directory: hoplite
        run: |
          cargo fmt --manifest-path core/Cargo.toml --all
          git diff --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null
      - name: Commit the validated implementation
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core docs
          git diff --cached --quiet && {
            echo "verification implementation produced no changes" >&2
            exit 1
          }
          git commit -m "Add source-free HAB1 verification"
          git push origin HEAD:agent/hoplite-verify-bundle-v1
