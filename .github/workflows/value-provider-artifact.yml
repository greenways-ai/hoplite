name: Value provider source artifact

env:
  CORE_HARA_REF: d310105d54954399da0b0289b7d43c7d1bf9d984
  VALUE_HARA_REF: d2a2e376917131cfb8954ac156db3a5e174f2c1a
  PROVIDER_VERSION: 0.1.0
  BACKEND_VERSION: 0.1.1
  BACKEND_REVISION: 8d97a452032d47740314899bb175096d8fc83f8e
  BACKEND_SHA256: 03c5dea9854cf23b60c7d2638c17712accc7e77eb53db4d15ed0b45327ee8210

on:
  push:
    paths:
      - core/src/provider_lock.rs
      - core/src/provider_lock/object_backend.rs
      - core/src/bin/hoplite-object-backend-lock.rs
      - core/abi/blob-store/**
      - core/abi/blob-filesystem-reader/**
      - core/abi/provider-hta/**
      - core/abi/value-provider-filesystem/**
      - core/abi/value-provider-filesystem-ffi/**
      - packaging/providers/value/provider-manifest.json
      - packaging/providers/value/object-backend-lock.json
      - packaging/providers/value/ARTIFACT.md
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/hara-value-revision
      - packaging/scripts/build-value-provider-artifact.sh
      - packaging/scripts/verify-value-provider-artifact.sh
      - packaging/scripts/verify-blob-provider-artifact.sh
      - .github/workflows/value-provider-artifact.yml
  pull_request:
    paths:
      - core/src/provider_lock.rs
      - core/src/provider_lock/object_backend.rs
      - core/src/bin/hoplite-object-backend-lock.rs
      - core/abi/blob-store/**
      - core/abi/blob-filesystem-reader/**
      - core/abi/provider-hta/**
      - core/abi/value-provider-filesystem/**
      - core/abi/value-provider-filesystem-ffi/**
      - packaging/providers/value/provider-manifest.json
      - packaging/providers/value/object-backend-lock.json
      - packaging/providers/value/ARTIFACT.md
      - packaging/providers/blob/provider-lock.json
      - packaging/providers/blob/provider-manifest.published.json
      - packaging/hara-value-revision
      - packaging/scripts/build-value-provider-artifact.sh
      - packaging/scripts/verify-value-provider-artifact.sh
      - packaging/scripts/verify-blob-provider-artifact.sh
      - .github/workflows/value-provider-artifact.yml

permissions:
  contents: read

concurrency:
  group: value-provider-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_name: ${{ steps.build.outputs.archive_name }}
      checksum_name: ${{ steps.build.outputs.checksum_name }}
      digest: ${{ steps.build.outputs.digest }}
      hara_revision: ${{ steps.build.outputs.hara_revision }}
      revision: ${{ steps.build.outputs.revision }}
      workflow_artifact_name: ${{ steps.build.outputs.workflow_artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.CORE_HARA_REF }}
          path: hara
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.VALUE_HARA_REF }}
          path: value-hara
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Validate provider and object-backend contracts
        working-directory: hoplite
        run: |
          test "$(tr -d '\n' < packaging/hara-value-revision)" = "$VALUE_HARA_REF"

          cargo run --quiet --manifest-path core/Cargo.toml --locked \
            --bin hoplite-provider-manifest -- \
            packaging/providers/value/provider-manifest.json \
            --provider hoplite.value \
            --request hoplite.value-request/0-alpha \
            --result hoplite.value-result/0-alpha \
            --abi hoplite.value-provider-ffi \
            --abi-version 1 \
            --driver filesystem \
            --driver-version 1

          cargo run --quiet --manifest-path core/Cargo.toml --locked \
            --bin hoplite-object-backend-lock -- \
            packaging/providers/value/object-backend-lock.json \
            packaging/providers/value/provider-manifest.json \
            packaging/providers/blob/provider-lock.json \
            packaging/providers/blob/provider-manifest.published.json \
            --consumer hoplite.value \
            --consumer-request hoplite.value-request/0-alpha \
            --consumer-result hoplite.value-result/0-alpha \
            --consumer-abi hoplite.value-provider-ffi \
            --consumer-abi-version 1 \
            --consumer-driver filesystem \
            --consumer-driver-version 1 \
            --backend-package hoplite-blob-filesystem-reader \
            --backend-package-version 0.1.0 \
            --backend-provider hoplite.blob \
            --backend-version "$BACKEND_VERSION" \
            --backend-repository greenways-ai/hoplite \
            --backend-tag "hoplite-blob-provider-v${BACKEND_VERSION}" \
            --backend-asset "hoplite-blob-provider-${BACKEND_VERSION}.tar.gz" \
            --backend-media-type application/gzip \
            --backend-request hoplite.blob-request/0-alpha \
            --backend-result hoplite.blob-result/0-alpha \
            --backend-abi hoplite.blob-provider-ffi \
            --backend-abi-version 1 \
            --backend-driver filesystem \
            --backend-driver-version 1

      - name: Prove exact object-reader bytes before packaging
        working-directory: hoplite
        run: |
          backend_archive="$RUNNER_TEMP/hoplite-blob-provider-${BACKEND_VERSION}.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/greenways-ai/hoplite/releases/download/hoplite-blob-provider-v${BACKEND_VERSION}/hoplite-blob-provider-${BACKEND_VERSION}.tar.gz" \
            --output "$backend_archive"
          echo "${BACKEND_SHA256}  ${backend_archive}" | sha256sum --check
          bash packaging/scripts/verify-blob-provider-artifact.sh \
            "$backend_archive" "sha256:${BACKEND_SHA256}" \
            "$RUNNER_TEMP/backend-root"

          backend="$RUNNER_TEMP/backend-root/hoplite-blob-provider-${BACKEND_VERSION}"
          test "$(cat "${backend}/SOURCE_REVISION")" = "$BACKEND_REVISION"
          test "$(cat "${backend}/PACKAGE_VERSION")" = "$BACKEND_VERSION"
          diff -ru \
            core/abi/blob-filesystem-reader \
            "$backend/abi/blob-filesystem-reader"

      - name: Build the exact artifact twice
        id: build
        run: |
          revision=$(git -C hoplite rev-parse HEAD)
          hara_revision=$(git -C value-hara rev-parse HEAD)
          archive_name="hoplite-value-provider-${PROVIDER_VERSION}.tar.gz"
          checksum_name="${archive_name}.sha256"
          workflow_artifact_name="hoplite-value-provider-${PROVIDER_VERSION}-${revision}"
          artifact="$RUNNER_TEMP/$archive_name"
          repeated="$RUNNER_TEMP/hoplite-value-provider-${PROVIDER_VERSION}.repeated.tar.gz"

          bash hoplite/packaging/scripts/build-value-provider-artifact.sh \
            "$PROVIDER_VERSION" "$revision" value-hara "$hara_revision" "$artifact"
          bash hoplite/packaging/scripts/build-value-provider-artifact.sh \
            "$PROVIDER_VERSION" "$revision" value-hara "$hara_revision" "$repeated"

          cmp "$artifact" "$repeated"
          cmp "$artifact.sha256" "$repeated.sha256"
          digest=$(awk '{print $1}' "$artifact.sha256")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$checksum_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "hara_revision=$hara_revision" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "workflow_artifact_name=$workflow_artifact_name" >> "$GITHUB_OUTPUT"
          {
            echo '### hoplite.value source artifact'
            echo
            echo "- version: \`$PROVIDER_VERSION\`"
            echo "- Hoplite revision: \`$revision\`"
            echo "- Hara revision: \`$hara_revision\`"
            echo "- object backend: \`sha256:$BACKEND_SHA256\`"
            echo "- artifact digest: \`sha256:$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the extracted source package
        run: |
          extracted="$RUNNER_TEMP/extracted"
          bash hoplite/packaging/scripts/verify-value-provider-artifact.sh \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.digest }}" \
            "$extracted"
          package="$extracted/hoplite-value-provider-${PROVIDER_VERSION}"

          test "$(cat "${package}/SOURCE_REVISION")" = \
            "${{ steps.build.outputs.revision }}"
          test "$(cat "${package}/HARA_REVISION")" = \
            "${{ steps.build.outputs.hara_revision }}"
          cmp \
            hoplite/packaging/providers/value/object-backend-lock.json \
            "$package/object-backend-lock.json"
          cmp \
            hoplite/core/abi/blob-filesystem-reader/Cargo.toml \
            "$package/hoplite/core/abi/blob-filesystem-reader/Cargo.toml"

          cargo run --quiet --manifest-path hoplite/core/Cargo.toml --locked \
            --bin hoplite-provider-manifest -- \
            "$package/provider-manifest.json" \
            --provider hoplite.value \
            --request hoplite.value-request/0-alpha \
            --result hoplite.value-result/0-alpha \
            --abi hoplite.value-provider-ffi \
            --abi-version 1 \
            --driver filesystem \
            --driver-version 1

          cargo run --quiet --manifest-path hoplite/core/Cargo.toml --locked \
            --bin hoplite-object-backend-lock -- \
            "$package/object-backend-lock.json" \
            "$package/provider-manifest.json" \
            "$package/backend/provider-lock.json" \
            "$package/backend/provider-manifest.published.json" \
            --consumer hoplite.value \
            --consumer-request hoplite.value-request/0-alpha \
            --consumer-result hoplite.value-result/0-alpha \
            --consumer-abi hoplite.value-provider-ffi \
            --consumer-abi-version 1 \
            --consumer-driver filesystem \
            --consumer-driver-version 1 \
            --backend-package hoplite-blob-filesystem-reader \
            --backend-package-version 0.1.0 \
            --backend-provider hoplite.blob \
            --backend-version "$BACKEND_VERSION" \
            --backend-repository greenways-ai/hoplite \
            --backend-tag "hoplite-blob-provider-v${BACKEND_VERSION}" \
            --backend-asset "hoplite-blob-provider-${BACKEND_VERSION}.tar.gz" \
            --backend-media-type application/gzip \
            --backend-request hoplite.blob-request/0-alpha \
            --backend-result hoplite.blob-result/0-alpha \
            --backend-abi hoplite.blob-provider-ffi \
            --backend-abi-version 1 \
            --backend-driver filesystem \
            --backend-driver-version 1

          rustup toolchain install 1.78.0 --profile minimal --no-self-update
          cargo +1.78.0 test \
            --manifest-path "$package/hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml" \
            --all-targets --locked
          cargo +1.78.0 build \
            --manifest-path "$package/hoplite/core/abi/value-provider-filesystem-ffi/Cargo.toml" \
            --release --locked

      - name: Reject digest and inventory tampering
        run: |
          artifact="${{ steps.build.outputs.artifact }}"
          zeros=$(printf '0%.0s' {1..64})
          if bash hoplite/packaging/scripts/verify-value-provider-artifact.sh \
            "$artifact" "$zeros"; then
            echo "artifact unexpectedly accepted an incorrect digest" >&2
            exit 1
          fi

          tampered_root="$RUNNER_TEMP/tampered"
          mkdir -p "$tampered_root"
          tar -xzf "$artifact" -C "$tampered_root"
          package_name="hoplite-value-provider-${PROVIDER_VERSION}"
          printf '%s\n' 'unexpected' > "$tampered_root/$package_name/UNEXPECTED"
          tampered="$RUNNER_TEMP/tampered.tar.gz"
          LC_ALL=C tar \
            --sort=name \
            --format=ustar \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C "$tampered_root" \
            -cf - "$package_name" \
            | gzip -n -9 > "$tampered"
          tampered_digest=$(sha256sum "$tampered" | awk '{print $1}')
          if bash hoplite/packaging/scripts/verify-value-provider-artifact.sh \
            "$tampered" "$tampered_digest"; then
            echo "artifact unexpectedly accepted a file outside its inventory" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.workflow_artifact_name }}
          path: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.build.outputs.artifact }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    needs: artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artifact.outputs.workflow_artifact_name }}
          path: release
      - name: Publish or verify the content-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.artifact.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.artifact.outputs.checksum_name }}
          DIGEST: ${{ needs.artifact.outputs.digest }}
          HARA_REVISION: ${{ needs.artifact.outputs.hara_revision }}
          REVISION: ${{ needs.artifact.outputs.revision }}
        run: |
          set -euo pipefail
          tag="hoplite-value-provider-v${PROVIDER_VERSION}"
          archive="release/$ARCHIVE_NAME"
          checksum="release/$CHECKSUM_NAME"

          test -f "$archive"
          test -f "$checksum"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$DIGEST"
          test "$(awk '{print $1}' "$checksum")" = "$DIGEST"
          test "$(awk '{print $2}' "$checksum")" = "$ARCHIVE_NAME"

          cat > release-notes.md <<EOF
          Deterministic source artifact for the separately installed filesystem \`hoplite.value\` provider.

          - provider version: \`${PROVIDER_VERSION}\`
          - Hoplite source revision: \`${REVISION}\`
          - Hara decoder revision: \`${HARA_REVISION}\`
          - object backend artifact: \`sha256:${BACKEND_SHA256}\`
          - artifact digest: \`sha256:${DIGEST}\`
          - portable contracts: \`hoplite.value-request/0-alpha\`, \`hoplite.value-result/0-alpha\`
          - native ABI: \`hoplite.value-provider-ffi/0-alpha\`
          - driver: \`filesystem/1\`

          Consumers must verify the exact SHA-256 digest before extraction or compilation.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            object_type=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.type')
            target=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')
            if test "$object_type" = tag; then
              target=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$target" \
                --jq '.object.sha')
            fi
            test "$target" = "$REVISION"

            mkdir existing
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARCHIVE_NAME" \
              --pattern "$CHECKSUM_NAME" \
              --dir existing
            cmp "$archive" "existing/$ARCHIVE_NAME"
            cmp "$checksum" "existing/$CHECKSUM_NAME"
          else
            gh release create "$tag" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$REVISION" \
              --title "Hoplite value provider ${PROVIDER_VERSION}" \
              --notes-file release-notes.md \
              --latest=false
          fi

          immutable=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq '.isImmutable')
          {
            echo '### Published hoplite.value provider'
            echo
            echo "- tag: \`$tag\`"
            echo "- Hoplite revision: \`$REVISION\`"
            echo "- Hara revision: \`$HARA_REVISION\`"
            echo "- digest: \`sha256:$DIGEST\`"
            echo "- GitHub release immutability: \`$immutable\`"
          } >> "$GITHUB_STEP_SUMMARY"
