name: Apply self-contained RTC module repair

on:
  push:
    branches:
      - fix/align-hara-stream-runtime
    paths:
      - .github/workflows/agent-align-hara-stream-runtime.yml

permissions:
  contents: write

env:
  RUST_MIN_STACK: 8388608
  HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6

concurrency:
  group: align-hara-stream-runtime
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/align-hara-stream-runtime
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Make hoplite.rtc self-contained and add regression coverage
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rtc_path = Path("core/lib/src/hoplite/rtc.hal")
          rtc = rtc_path.read_text()
          old_ns = '''(ns hoplite.rtc
            (:config {})
            (:require [std.stream.duplex :as duplex]))
          '''
          new_ns = '''(ns hoplite.rtc
            (:config {}))
          '''
          if rtc.count(old_ns) != 1:
              raise SystemExit("cannot locate the hoplite.rtc namespace declaration")
          rtc = rtc.replace(old_ns, new_ns, 1)

          old_receive = '''(defn receive-stream
            "Creates the pull side of an RTC transport. A nil host result closes it."
            [handle]
            (stream
             (fn []
               (loop []
                 (let [item
                       (co/await
                        (host-call "receive" [handle]))]
                   (if (nil? item)
                     :done
                     (do
                       (co/yield item)
                       (recur))))))))
          '''
          new_receive = '''(defn receive-stream
            "Creates the pull side of an RTC transport. A nil host result closes it."
            [handle]
            (Stream/generate
             (fn [session]
               (loop []
                 (let [item
                       (Coroutine/await
                        (host-call "receive" [session]))]
                   (if (nil? item)
                     :done
                     (do
                       (Coroutine/yield item)
                       (recur))))))
             handle))
          '''
          if rtc.count(old_receive) != 1:
              raise SystemExit("cannot locate the RTC receive-stream definition")
          rtc = rtc.replace(old_receive, new_receive, 1)

          await_count = rtc.count("(co/await")
          if await_count != 4:
              raise SystemExit(f"expected four remaining RTC awaits, found {await_count}")
          rtc = rtc.replace("(co/await", "(Coroutine/await")
          if rtc.count("(duplex/create") != 1:
              raise SystemExit("cannot locate the portable duplex constructor")
          rtc = rtc.replace("(duplex/create", "(Duplex/create", 1)
          rtc_path.write_text(rtc)

          main_path = Path("core/src/main.rs")
          main = main_path.read_text()
          marker = '''    #[test]
              fn orders_application_modules_before_their_dependents() {
          '''
          regression = '''    #[test]
              fn compiles_builtin_hoplite_modules_against_reviewed_hara_runtime() {
                  let modules = application_modules(&[]).unwrap();
                  let hbx0 = compile_application_modules(&modules).unwrap();
                  assert_eq!(&hbx0[..4], b"HBX0");
              }

          '''
          if main.count(marker) != 1:
              raise SystemExit("cannot locate the application-module test insertion point")
          main = main.replace(marker, regression + marker, 1)
          main_path.write_text(main)
          PY

          if grep -Fq 'std.stream.duplex' core/lib/src/hoplite/rtc.hal; then
            echo "hoplite.rtc still depends on an unbundled Hara source namespace" >&2
            exit 1
          fi
          if grep -Eq '\((stream|co/await|co/yield|duplex/create)([[:space:]]|$)' core/lib/src/hoplite/rtc.hal; then
            echo "hoplite.rtc still depends on convenience bindings outside the production bundle" >&2
            exit 1
          fi
          grep -Fq '(Stream/generate' core/lib/src/hoplite/rtc.hal
          grep -Fq '(Coroutine/await' core/lib/src/hoplite/rtc.hal
          grep -Fq '(Coroutine/yield' core/lib/src/hoplite/rtc.hal
          grep -Fq '(Duplex/create' core/lib/src/hoplite/rtc.hal
          test "$(tr -d '[:space:]' < packaging/hara-revision)" = "$HARA_REF"
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          bash packaging/scripts/verify-alpha-versioning.sh

      - name: Verify the dependency graph
        working-directory: hoplite
        run: cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null

      - name: Compile every built-in Hoplite module against reviewed Hara
        working-directory: hoplite
        run: |
          cargo test \
            --manifest-path core/Cargo.toml \
            --bin hoplite \
            --locked \
            compiles_builtin_hoplite_modules_against_reviewed_hara_runtime \
            -- --nocapture

      - name: Test the complete Hoplite core workspace
        working-directory: hoplite
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

      - name: Reproduce the generic production image build
        run: docker build -f hoplite/packaging/docker/Dockerfile -t hoplite-rtc-module-ci .

      - name: Verify the source-free production image
        run: bash hoplite/packaging/scripts/assert-production-image.sh hoplite-rtc-module-ci

      - name: Publish the verified repair
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-align-hara-stream-runtime.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep hoplite.rtc within the reviewed Hara runtime"
          git push origin HEAD:fix/align-hara-stream-runtime
