name: Apply Hara stream runtime alignment

on:
  push:
    branches:
      - fix/align-hara-stream-runtime
    paths:
      - .github/workflows/agent-align-hara-stream-runtime.yml

permissions:
  contents: write

env:
  RUST_MIN_STACK: 8388608
  OLD_HARA_REF: 2b3efd14451e96e9e79cd9645fb7e10d9e3782d6
  HARA_REF: d89cf3370cc83e0c1e9d8c5d9359added42c07f8

concurrency:
  group: align-hara-stream-runtime
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/align-hara-stream-runtime
          path: hoplite
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_REF }}
          path: hara
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Align the reviewed Hara runtime and add regression coverage
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          old = os.environ["OLD_HARA_REF"]
          new = os.environ["HARA_REF"]
          for name in [
              "packaging/hara-revision",
              ".github/workflows/ci.yml",
              "packaging/scripts/verify-alpha-versioning.sh",
          ]:
              path = Path(name)
              source = path.read_text()
              count = source.count(old)
              if count == 0:
                  raise SystemExit(f"{name} does not contain the previous reviewed Hara revision")
              path.write_text(source.replace(old, new))

          path = Path("core/src/main.rs")
          source = path.read_text()
          marker = '''    #[test]
              fn orders_application_modules_before_their_dependents() {
          '''
          regression = '''    #[test]
              fn compiles_builtin_hoplite_modules_against_reviewed_hara_runtime() {
                  let modules = application_modules(&[]).unwrap();
                  let hbx0 = compile_application_modules(&modules).unwrap();
                  assert_eq!(&hbx0[..4], b"HBX0");
              }

          '''
          if source.count(marker) != 1:
              raise SystemExit("cannot locate the application-module test insertion point")
          source = source.replace(marker, regression + marker, 1)
          path.write_text(source)
          PY

          remaining="$(git grep -n "$OLD_HARA_REF" -- ':!.github/workflows/agent-align-hara-stream-runtime.yml' || true)"
          if test -n "$remaining"; then
            printf '%s\n' "$remaining" >&2
            echo "stale reviewed Hara revision remains" >&2
            exit 1
          fi

          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          bash packaging/scripts/verify-alpha-versioning.sh

      - name: Verify the dependency graph
        working-directory: hoplite
        run: cargo metadata --manifest-path core/Cargo.toml --locked --no-deps >/dev/null

      - name: Compile every built-in Hoplite module against Hara
        working-directory: hoplite
        run: |
          cargo test \
            --manifest-path core/Cargo.toml \
            --bin hoplite \
            --locked \
            compiles_builtin_hoplite_modules_against_reviewed_hara_runtime \
            -- --nocapture

      - name: Test the complete Hoplite core workspace
        working-directory: hoplite
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

      - name: Publish the verified repair
        working-directory: hoplite
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-align-hara-stream-runtime.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Hoplite with Hara stream modules"
          git push origin HEAD:fix/align-hara-stream-runtime
