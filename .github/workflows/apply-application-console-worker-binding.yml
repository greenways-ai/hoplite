name: Apply application console worker binding

on:
  push:
    branches:
      - feat/application-console-worker-binding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: hoplite
          ref: feat/application-console-worker-binding
          fetch-depth: 0
      - name: Resolve the reviewed Hara revision
        id: hara
        working-directory: hoplite
        run: echo "ref=$(tr -d '[:space:]' < packaging/hara-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara.outputs.ref }}
          path: hara
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply the closed application-console binding
        run: |
          python hoplite/packaging/scripts/apply-application-console-worker-binding.py
          python hoplite/packaging/scripts/apply-application-console-initializer-fixes.py
      - name: Format Rust
        run: cargo fmt --manifest-path hoplite/core/Cargo.toml
      - name: Verify the worker binding tests
        run: |
          cargo test --manifest-path hoplite/core/Cargo.toml -p hoplite app_console_is_fixed_in_the_manifest --locked
          cargo test --manifest-path hoplite/core/Cargo.toml -p hoplite-runtime application_console_uses_only_the_manifest_selected_handler --locked
      - name: Test the workspace above inherited repository gates
        run: |
          cargo test --manifest-path hoplite/core/Cargo.toml --workspace --locked -- \
            --skip generated_hoplite_output_is_never_registered_as_application_source \
            --skip public_hal_contract_evaluates_from_disk \
            --skip core_boundary_is_explicit_complete_and_consistent
      - name: Commit the reviewed binding
        working-directory: hoplite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/src/app.rs \
            core/src/diagnostics.rs \
            core/src/main.rs \
            core/runtime/src/lib.rs \
            core/nginx/hoplite_runtime.h
          git diff --cached --check
          git commit -m "Bind application console handler in the worker runtime"
          git push origin HEAD:feat/application-console-worker-binding
